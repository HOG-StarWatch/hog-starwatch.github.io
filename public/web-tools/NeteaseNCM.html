const AES_RCON = new Uint8Array([0x00,0x01,0x02,0x04,0x08,0x10,0x20,0x40,0x80,0x1b,0x36]);

function aesSubWord(w) {
  return (AES_SBOX[w[0]]<<24|AES_SBOX[w[1]]<<16|AES_SBOX[w[2]]<<8|AES_SBOX[w[3]])>>>0;
}

function aesRotWord(w) {
  return ((w<<8)|(w>>>24))>>>0;
}

function aesGmul(a, b) {
  let p = 0;
  for (let i = 0; i < 8; i++) {
    if (b & 1) p ^= a;
    const hi = a & 0x80;
    a = (a << 1) & 0xff;
    if (hi) a ^= 0x1b;
    b >>= 1;
  }
  return p;
}

function aesKeyExpansion(key) {
  const Nk = 4, Nb = 4, Nr = 10;
  const w = new Uint32Array(Nb * (Nr + 1));
  for (let i = 0; i < Nk; i++) {
    w[i] = (key[4*i]<<24) | (key[4*i+1]<<16) | (key[4*i+2]<<8) | key[4*i+3];
  }
  for (let i = Nk; i < Nb * (Nr + 1); i++) {
    let t = w[i-1];
    if (i % Nk === 0) {
      const rot = aesRotWord(t);
      t = aesSubWord([(rot>>>24)&0xff,(rot>>>16)&0xff,(rot>>>8)&0xff,rot&0xff]) ^ (AES_RCON[i/Nk]<<24);
    }
    w[i] = w[i-Nk] ^ t;
  }
  return w;
}

function aesDecryptBlock(block, w) {
  const state = new Uint8Array(block);
  const Nb = 4;
  const Nr = 10;

  function addRoundKey(r) {
    for (let c = 0; c < Nb; c++) {
      const k = w[r * Nb + c];
      state[c * 4]     ^= (k >>> 24) & 0xff;
      state[c * 4 + 1] ^= (k >>> 16) & 0xff;
      state[c * 4 + 2] ^= (k >>> 8) & 0xff;
      state[c * 4 + 3] ^= k & 0xff;
    }
  }

  function invShiftRows() {
    const s = new Uint8Array(16);
    s[0]=state[0];  s[1]=state[13]; s[2]=state[10]; s[3]=state[7];
    s[4]=state[4];  s[5]=state[1];  s[6]=state[14]; s[7]=state[11];
    s[8]=state[8];  s[9]=state[5];  s[10]=state[2]; s[11]=state[15];
    s[12]=state[12]; s[13]=state[9]; s[14]=state[6]; s[15]=state[3];
    state.set(s);
  }

  function invSubBytes() {
    for (let i = 0; i < 16; i++) state[i] = AES_INV_SBOX[state[i]];
  }

  function invMixColumns() {
    const s = new Uint8Array(16);
    for (let c = 0; c < 4; c++) {
      const i = c * 4;
      s[i]   = aesGmul(state[i],14) ^ aesGmul(state[i+1],11) ^ aesGmul(state[i+2],13) ^ aesGmul(state[i+3],9);
      s[i+1] = aesGmul(state[i],9)  ^ aesGmul(state[i+1],14) ^ aesGmul(state[i+2],11) ^ aesGmul(state[i+3],13);
      s[i+2] = aesGmul(state[i],13) ^ aesGmul(state[i+1],9)  ^ aesGmul(state[i+2],14) ^ aesGmul(state[i+3],11);
      s[i+3] = aesGmul(state[i],11) ^ aesGmul(state[i+1],13) ^ aesGmul(state[i+2],9)  ^ aesGmul(state[i+3],14);
    }
    state.set(s);
  }

  addRoundKey(Nr);
  for (let r = Nr - 1; r >= 1; r--) {
    invShiftRows();
    invSubBytes();
    addRoundKey(r);
    invMixColumns();
  }
  invShiftRows();
  invSubBytes();
  addRoundKey(0);

  return state;
}

function aesEcbDecrypt(keyBytes, data) {
  const w = aesKeyExpansion(keyBytes);
  const n = data.length / 16;
  if (n !== Math.floor(n)) throw new Error('AES data length not multiple of 16');
  const out = new Uint8Array(data.length);
  for (let i = 0; i < n; i++) {
    const dec = aesDecryptBlock(data.slice(i*16, i*16+16), w);
    out.set(dec, i*16);
  }
  return out;
}

function aesEncryptBlock(block, w) {
  const state = new Uint8Array(block);
  const Nb = 4, Nr = 10;
  function subBytes(s) { for (let i = 0; i < 16; i++) s[i] = AES_SBOX[s[i]]; }
  function shiftRows(s) {
    const t = [s[0],s[5],s[10],s[15],s[4],s[9],s[14],s[3],s[8],s[13],s[2],s[7],s[12],s[1],s[6],s[11]];
    for (let i = 0; i < 16; i++) s[i] = t[i];
  }
  function mixCols(s) {
    for (let c = 0; c < 4; c++) {
      const i = c * 4, a = s[i], b = s[i+1], c2 = s[i+2], d = s[i+3];
      s[i]   = aesGmul(a,2)^aesGmul(b,3)^c2^d;
      s[i+1] = a^aesGmul(b,2)^aesGmul(c2,3)^d;
      s[i+2] = a^b^aesGmul(c2,2)^aesGmul(d,3);
      s[i+3] = aesGmul(a,3)^b^c2^aesGmul(d,2);
    }
  }
  function addKey(s, rk) {
    for (let c = 0; c < Nb; c++) {
      const k = rk[c];
      s[c*4]   ^= (k>>>24)&0xff;
      s[c*4+1] ^= (k>>>16)&0xff;
      s[c*4+2] ^= (k>>>8)&0xff;
      s[c*4+3] ^= k&0xff;
    }
  }
  addKey(state, w.slice(0, 4));
  for (let r = 1; r < Nr; r++) { subBytes(state); shiftRows(state); mixCols(state); addKey(state, w.slice(r*4, (r+1)*4)); }
  subBytes(state); shiftRows(state); addKey(state, w.slice(Nr*4, (Nr+1)*4));
  return state;
}

function aesEcbEncrypt(keyBytes, data) {
  const w = aesKeyExpansion(keyBytes);
  const n = data.length / 16;
  const out = new Uint8Array(data.length);
  for (let i = 0; i < n; i++) {
    const enc = aesEncryptBlock(data.slice(i*16, i*16+16), w);
    out.set(enc, i*16);
  }
  return out;
}

function writeU32(d, o, v) {
  d[o] = v & 0xff; d[o+1] = (v>>>8)&0xff; d[o+2] = (v>>>16)&0xff; d[o+3] = (v>>>24)&0xff;
}

function concatBytes(arrays) {
  let len = 0;
  for (const a of arrays) len += a.length;
  const r = new Uint8Array(len);
  let off = 0;
  for (const a of arrays) { r.set(a, off); off += a.length; }
  return r;
}

function pkcs7Pad(data, bs) {
  bs = bs || 16;
  const padLen = bs - (data.length % bs);
  const r = new Uint8Array(data.length + padLen);
  r.set(data);
  r.fill(padLen, data.length);
  return r;
}

function unpadPkcs7(d) {
  if (!d || d.length === 0) return d;
  const last = d[d.length - 1];
  if (last >= 1 && last <= 16 && last <= d.length) return d.slice(0, d.length - last);
  return d;
}

function generateRC4Key() {
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let s = '';
  for (let i = 0; i < 98; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return new TextEncoder().encode(s);
}

function ncmEncrypt(audioData, coverData, metaObj) {
  const rc4Key = generateRC4Key();
  const prefix = new TextEncoder().encode('neteasecloudmusic');
  const keyMat = concatBytes([prefix, rc4Key]);
  const keyPadded = pkcs7Pad(keyMat);
  const keyEnc = aesEcbEncrypt(CORE_KEY, keyPadded);
  const keyXored = xorBytes(keyEnc, 0x64);

  const metaJson = 'music:' + JSON.stringify(metaObj);
  const metaBytes = new TextEncoder().encode(metaJson);
  const metaPadded = pkcs7Pad(metaBytes);
  const metaEnc = aesEcbEncrypt(META_KEY, metaPadded);
  const metaB64 = btoa(String.fromCharCode(...metaEnc));
  const metaLine = '163 key(Don\'t modify):' + metaB64;
  const metaLineBytes = new TextEncoder().encode(metaLine);
  const metaXored = xorBytes(metaLineBytes, 0x63);

  const S = rc4KSA(rc4Key);
  const keyBox = ncmKeyBox(S);
  const audioEnc = new Uint8Array(audioData.length);
  for (let i = 0; i < audioData.length; i++) audioEnc[i] = audioData[i] ^ keyBox[i & 0xff];

  const coverSize = coverData ? coverData.length : 0;
  const crcHeader = new Uint8Array(13);
  writeU32(crcHeader, 5, coverSize);
  writeU32(crcHeader, 9, coverSize);

  const keyLenBytes = new Uint8Array(4); writeU32(keyLenBytes, 0, keyXored.length);
  const metaLenBytes = new Uint8Array(4); writeU32(metaLenBytes, 0, metaXored.length);
  const parts = [MAGIC, new Uint8Array([0x00, 0x00])];
  parts.push(keyLenBytes, keyXored);
  parts.push(metaLenBytes, metaXored);
  if (metaXored.length % 2 === 1) parts.push(new Uint8Array([0x00]));
  parts.push(crcHeader);
  if (coverData) parts.push(coverData);
  parts.push(audioEnc);

  return concatBytes(parts);
}

function extractMetaFromAudio(data, fileName) {
  const ext = fileName.split('.').pop().toLowerCase();
  let meta = {};
  if (ext === 'mp3') { meta = parseID3v2(data) || {}; }
  else if (ext === 'flac' || ext === 'ogg') { meta = parseVorbisMeta(data) || {}; }
  meta.title = meta.title || fileName.replace(/\.[^.]+$/, '');
  meta.artist = meta.artist || '';
  meta.album = meta.album || '';
  meta.format = ext;
  return meta;
}

function parseID3v2(data) {
  if (data[0] !== 0x49 || data[1] !== 0x44 || data[2] !== 0x33) return null;
  const v24 = data[3] === 4;
  const size = ((data[6] & 0x7f) << 21) | ((data[7] & 0x7f) << 14) | ((data[8] & 0x7f) << 7) | (data[9] & 0x7f);
  let off = 10, end = off + size;
  const meta = {};
  while (off + 10 <= end) {
    const id = String.fromCharCode(data[off], data[off+1], data[off+2], data[off+3]);
    let frameSize = v24
      ? ((data[off+4] & 0x7f) << 21) | ((data[off+5] & 0x7f) << 14) | ((data[off+6] & 0x7f) << 7) | (data[off+7] & 0x7f)
      : ((data[off+4] << 24) | (data[off+5] << 16) | (data[off+6] << 8) | data[off+7]) >>> 0;
    if (frameSize < 1) { off += 10; continue; }
    if (off + 10 + frameSize > end) break;
    const flags = (data[off+8] << 8) | data[off+9];
    off += 10;
    const enc = data[off];
    let raw;
    if (enc === 0 || enc === 3) {
      raw = new TextDecoder('latin1').decode(data.slice(off+1, off+frameSize));
    } else if (enc === 1) {
      const bom = (data[off+1] << 8) | data[off+2];
      raw = new TextDecoder(bom === 0xfffe ? 'utf-16le' : 'utf-16be').decode(data.slice(off+1, off+frameSize));
    } else if (enc === 2) {
      raw = new TextDecoder('utf-16be').decode(data.slice(off+1, off+frameSize));
    } else { raw = new TextDecoder().decode(data.slice(off+1, off+frameSize)); }
    raw = raw.replace(/\0.*$/, '').replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '').trim();
    if (id === 'TIT2') meta.title = raw;
    else if (id === 'TPE1') meta.artist = raw;
    else if (id === 'TALB') meta.album = raw;
    off += frameSize;
  }
  return meta.title ? meta : null;
}

function parseVorbisMeta(data) {
  if (data[0] === 0x66 && data[1] === 0x4C && data[2] === 0x61 && data[3] === 0x43) {
    let off = 4;
    while (off + 4 < data.length) {
      const last = (data[off] & 0x80) !== 0;
      const type = data[off] & 0x7f;
      const len = (data[off+1] << 16) | (data[off+2] << 8) | data[off+3];
      off += 4;
      if (type === 4 && len > 4) {
        let pos = off;
        const vL = (data[pos]|data[pos+1]<<8|data[pos+2]<<16|data[pos+3]<<24)>>>0;
        pos += 4 + vL;
        const n = (data[pos]|data[pos+1]<<8|data[pos+2]<<16|data[pos+3]<<24)>>>0;
        pos += 4;
        const meta = {};
        for (let i = 0; i < n && pos + 4 <= off + len; i++) {
          const fL = (data[pos]|data[pos+1]<<8|data[pos+2]<<16|data[pos+3]<<24)>>>0;
          pos += 4;
          if (pos + fL > off + len) break;
          const field = new TextDecoder().decode(data.slice(pos, pos+fL));
          pos += fL;
          const eq = field.indexOf('=');
          if (eq > 0) {
            const k = field.substring(0, eq).toUpperCase();
            const v = field.substring(eq + 1);
            if (k === 'TITLE') meta.title = v;
            else if (k === 'ARTIST') meta.artist = v;
            else if (k === 'ALBUM') meta.album = v;
          }
        }
        if (meta.title) return meta;
      }
      off += len;
      if (last) break;
    }
  }
  return null;
}

function rc4KSA(key) {
  const S = new Uint8Array(256);
  for (let i = 0; i < 256; i++) S[i] = i;
  for (let i = 0, j = 0; i < 256; i++) {
    j = (j + S[i] + key[i % key.length]) & 0xff;
    [S[i], S[j]] = [S[j], S[i]];
  }
  return S;
}

function ncmKeyBox(S) {
  const kb = new Uint8Array(256);
  for (let idx = 0; idx < 256; idx++) {
    const i = (idx + 1) & 0xff;
    const si = S[i];
    const sj = S[(i + si) & 0xff];
    kb[idx] = S[(si + sj) & 0xff];
  }
  return kb;
}

function parseNCM(data) {
  if (data.length < 16) throw new Error('File too small');
  for (let i = 0; i < 8; i++) {
    if (data[i] !== MAGIC[i]) throw new Error('Invalid NCM file: bad magic');
  }

  let off = 10;
  const keyLen = readU32(data, off); off += 4;
  if (off + keyLen > data.length) throw new Error('Invalid NCM: key section truncated');
  const keyData = data.slice(off, off + keyLen); off += keyLen;
  const keyXor = xorBytes(keyData, 0x64);
  const coreDec = aesEcbDecrypt(CORE_KEY, keyXor);
  const keyPlain = unpadPkcs7(coreDec);
  const rc4Key = keyPlain.slice(17);

  const metaLen = readU32(data, off); off += 4;
  let metaObj = null;
  if (metaLen > 0) {
    if (off + metaLen > data.length) throw new Error('Invalid NCM: meta section truncated');
    const metaData = data.slice(off, off + metaLen); off += metaLen;
    const metaXor = xorBytes(metaData, 0x63);
    const metaStr = new TextDecoder().decode(metaXor);
    const colonIdx = metaStr.indexOf(':');
    const metaB64 = colonIdx >= 0 ? metaStr.substring(colonIdx + 1) : metaStr.slice(6, -1);
    let metaRaw;
    try {
      metaRaw = atob(metaB64);
    } catch (e) {
      throw new Error('Meta base64 decode failed');
    }
    const metaBytes = new Uint8Array(metaRaw.length);
    for (let i = 0; i < metaRaw.length; i++) metaBytes[i] = metaRaw.charCodeAt(i);
    const metaDec = aesEcbDecrypt(META_KEY, metaBytes);
    const metaPad = unpadPkcs7(metaDec);
    const metaDecoded = new TextDecoder().decode(metaPad);
    try {
      const firstBrace = metaDecoded.indexOf('{');
      const lastBrace = metaDecoded.lastIndexOf('}');
      const jsonPart = (firstBrace >= 0 && lastBrace > firstBrace)
        ? metaDecoded.substring(firstBrace, lastBrace + 1)
        : metaDecoded;
      metaObj = JSON.parse(jsonPart);
    } catch (e) {
      throw new Error('Meta parse failed: ' + e.message);
    }
  }

  const crcPos = (off % 2 === 1) ? off + 1 : off;
  if (crcPos + 13 > data.length) throw new Error('Invalid NCM: no cover/audio data');
  const valAt5 = readU32(data, crcPos + 5);
  const valAt9 = readU32(data, crcPos + 9);

  let coverData = null, audioOff = 0;
  if (valAt5 !== 0 && valAt5 >= valAt9) {
    const totalLen = readU32(data, crcPos + 5);
    const dataLen = readU32(data, crcPos + 9);
    coverData = data.slice(crcPos + 13, crcPos + 13 + dataLen);
    audioOff = crcPos + 13 + totalLen;
  } else if (valAt9 !== 0) {
    coverData = data.slice(crcPos + 9, crcPos + 9 + valAt9);
    audioOff = crcPos + 13 + valAt9;
  } else {
    coverData = null;
    audioOff = crcPos + 13;
  }

  if (audioOff >= data.length) throw new Error('Invalid NCM: no audio data');

  const S = rc4KSA(rc4Key);
  const keyBox = ncmKeyBox(S);
  const audioLen = data.length - audioOff;
  const audioData = new Uint8Array(audioLen);
  for (let i = 0; i < audioLen; i++) {
    audioData[i] = data[audioOff + i] ^ keyBox[i & 0xff];
  }

  let format = detectFormat(audioData);
  let ext = '';
  switch (format) {
    case 'mp3': ext = 'mp3'; break;
    case 'flac': ext = 'flac'; break;
    case 'ogg': ext = 'ogg'; break;
    case 'wav': ext = 'wav'; break;
    case 'm4a': ext = 'm4a'; break;
    default: ext = 'mp3'; format = 'mp3'; break;
  }

  return { meta: metaObj, cover: coverData, audio: audioData, format: format, ext: ext };
}

function detectFormat(audio) {
  if (audio[0] === 0xFF && (audio[1] & 0xE0) === 0xE0) return 'mp3';
  if (audio[0] === 0x66 && audio[1] === 0x4C && audio[2] === 0x61 && audio[3] === 0x43) return 'flac';
  if (audio[0] === 0x4F && audio[1] === 0x67 && audio[2] === 0x67 && audio[3] === 0x53) return 'ogg';
  if (audio[0] === 0x52 && audio[1] === 0x49 && audio[2] === 0x46 && audio[3] === 0x46) return 'wav';
  if (audio[4] === 0x66 && audio[5] === 0x74 && audio[6] === 0x79 && audio[7] === 0x70) return 'm4a';
  if (audio[0] === 0x00 && audio[1] === 0x00 && audio[2] === 0x00 && audio[3] === 0x1C) return 'm4a';
  return 'unknown';
}

function detectCoverFormat(d) {
  if (!d || d.length < 4) return { mime: 'application/octet-stream', ext: 'bin' };
  if (d[0] === 0xFF && d[1] === 0xD8) return { mime: 'image/jpeg', ext: 'jpg' };
  if (d[0] === 0x89 && d[1] === 0x50 && d[2] === 0x4E && d[3] === 0x47) return { mime: 'image/png', ext: 'png' };
  if (d[0] === 0x47 && d[1] === 0x49 && d[2] === 0x46) return { mime: 'image/gif', ext: 'gif' };
  if (d[0] === 0x42 && d[1] === 0x4D) return { mime: 'image/bmp', ext: 'bmp' };
  return { mime: 'application/octet-stream', ext: 'bin' };
}

function getMetaValue(meta, key) {
  if (!meta) return '';
  return (meta[key] || meta['music.' + key] || meta['dj.' + key] || '').toString();
}

let allFiles = [];
let activePreview = null;

function formatSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function formatDuration(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}

function renderFileCard(f, index) {
  const isEncrypt = f.type === 'encrypt';
  const div = document.createElement('div');
  div.className = 'card';
  div.id = 'card-' + index;

  const header = document.createElement('div');
  header.className = 'card-header';

  const cw = document.createElement('div');
  cw.className = 'cover-wrap';
  const coverImg = document.createElement('img');
  const coverPl = document.createElement('span');
  coverPl.className = 'placeholder';
  coverPl.innerHTML = svgIcon(ICO.image, 30);
  if (f.cover) {
    if (f._coverUrl) URL.revokeObjectURL(f._coverUrl);
    const blob = new Blob([f.cover], { type: detectCoverFormat(f.cover).mime });
    f._coverUrl = URL.createObjectURL(blob);
    coverImg.src = f._coverUrl;
    cw.appendChild(coverImg);
  } else {
    cw.appendChild(coverPl);
  }
  if (isEncrypt) {
    cw.style.cursor = 'pointer';
    cw.title = '点击选择封面';
    const coverInput = document.createElement('input');
    coverInput.type = 'file';
    coverInput.accept = 'image/*';
    coverInput.style.display = 'none';
    function setCover(data) {
      if (f._coverUrl) URL.revokeObjectURL(f._coverUrl);
      f.cover = data;
      const blob = new Blob([f.cover], { type: detectCoverFormat(f.cover).mime });
      f._coverUrl = URL.createObjectURL(blob);
      coverImg.src = f._coverUrl;
      cw.innerHTML = '';
      cw.appendChild(coverImg);
      cw.appendChild(coverInput);
    }
    coverInput.addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = function(e) { setCover(new Uint8Array(e.target.result)); };
      r.readAsArrayBuffer(file);
    });
    cw.appendChild(coverInput);
    cw.addEventListener('click', function() { coverInput.click(); });
    cw.addEventListener('dragover', function(e) { e.preventDefault(); cw.style.borderColor = 'rgba(167,139,250,0.5)'; });
    cw.addEventListener('dragleave', function() { cw.style.borderColor = ''; });
    cw.addEventListener('drop', function(e) {
      e.preventDefault();
      e.stopPropagation();
      cw.style.borderColor = '';
      const file = e.dataTransfer.files[0];
      if (!file || !file.type.startsWith('image/')) return;
      const r = new FileReader();
      r.onload = function(ev) { setCover(new Uint8Array(ev.target.result)); };
      r.readAsArrayBuffer(file);
    });
  }
  header.appendChild(cw);

  const mi = document.createElement('div');
  mi.className = 'meta-info';

  if (isEncrypt) {
    const t = document.createElement('input');
    t.className = 'form-input enc-title';
    t.value = getMetaValue(f.meta, 'title') || f.name.replace(/\.(mp3|flac|ogg|wav)$/i, '');
    t.placeholder = '歌曲';
    mi.appendChild(t);
    const a = document.createElement('input');
    a.className = 'form-input enc-artist';
    a.value = getMetaValue(f.meta, 'artist') || '';
    a.placeholder = '艺术家';
    mi.appendChild(a);
    const al = document.createElement('input');
    al.className = 'form-input enc-album';
    al.value = getMetaValue(f.meta, 'album') || '';
    al.placeholder = '专辑';
    mi.appendChild(al);
  } else {
    const t = document.createElement('div'); t.className = 'title';
    t.textContent = getMetaValue(f.meta, 'title') || f.name.replace(/\.ncm$/i, '');
    mi.appendChild(t);
    const a = document.createElement('div'); a.className = 'artist';
    a.textContent = getMetaValue(f.meta, 'artist') || '';
    mi.appendChild(a);
    const al = document.createElement('div'); al.className = 'album';
    al.textContent = getMetaValue(f.meta, 'album') || '';
    mi.appendChild(al);
  }
  header.appendChild(mi);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'card-close';
  closeBtn.innerHTML = svgIcon(ICO.x, 13);
  closeBtn.title = '移除';
  closeBtn.addEventListener('click', function() { removeCard(index); });
  header.appendChild(closeBtn);
  div.appendChild(header);

  const dg = document.createElement('div');
  dg.className = 'detail-grid';
  const addRow = function(lbl, val) {
    const l = document.createElement('div'); l.className = 'label'; l.textContent = lbl;
    const v = document.createElement('div'); v.className = 'value'; v.textContent = val;
    dg.appendChild(l); dg.appendChild(v);
  };
  if (isEncrypt) {
    addRow('格式', f.format.toUpperCase());
    addRow('大小', formatSize(f.data ? f.data.length : 0));
  } else {
    addRow('格式', f.format.toUpperCase());
    addRow('大小', formatSize(f.audio.length));
    if (f.cover) addRow('封面', formatSize(f.cover.length));
    if (f.meta) {
      if (Number(f.meta.duration) > 0) addRow('时长', formatDuration(Number(f.meta.duration)));
      if (Number(f.meta.bitrate) > 0) addRow('码率', Math.round(Number(f.meta.bitrate) / 1000) + ' kbps');
      if (f.meta.musicId !== undefined && f.meta.musicId !== null && String(f.meta.musicId) !== '' && String(f.meta.musicId) !== '0') {
        addRow('音乐ID', String(f.meta.musicId));
      }
    }
  }
  div.appendChild(dg);

  const act = document.createElement('div');
  act.className = 'actions';
  if (isEncrypt) {
    const encBtn = document.createElement('button');
    encBtn.className = 'btn btn-primary';
    encBtn.innerHTML = svgIcon(ICO.lock, 14) + ' 加密';
    encBtn.addEventListener('click', function() { encryptSingle(index); });
    act.appendChild(encBtn);
  } else {
    const pr = document.createElement('div');
    pr.className = 'preview-row';
    pr.style.display = 'none';
    const pbar = document.createElement('div');
    pbar.className = 'preview-bar';
    const pfill = document.createElement('div');
    pfill.className = 'preview-bar-fill';
    const pthumb = document.createElement('div');
    pthumb.className = 'preview-bar-thumb';
    let preview = null;
    var dragging = false;
    function seekToEvent(e) {
      if (!preview || preview.readyState < 2) return;
      var rect = pbar.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var percent = Math.min(Math.max(x / rect.width, 0), 1);
      pfill.style.width = percent * 100 + '%';
      pthumb.style.left = percent * 100 + '%';
      preview.currentTime = percent * preview.duration;
      updatePreview();
    }
    pbar.addEventListener('mousedown', function(e) {
      e.preventDefault();
      if (!preview) { /* create audio if needed */
        var mime = (f.ext === 'mp3') ? 'audio/mpeg' : (f.ext === 'm4a' ? 'audio/mp4' : 'audio/' + f.ext);
        preview = new Audio(URL.createObjectURL(new Blob([f.audio], { type: mime })));
        preview.addEventListener('timeupdate', updatePreview);
        preview.addEventListener('ended', function() { playLabel(); updatePreview(); });
        preview.addEventListener('pause', function() { playLabel(); updatePreview(); });
        pr.style.display = 'flex';
      }
      dragging = true;
      pfill.style.transition = 'none';
      pthumb.style.transition = 'none';
      seekToEvent(e);
    });
    document.addEventListener('mousemove', function(e) {
      if (dragging) seekToEvent(e);
    });
    document.addEventListener('mouseup', function() {
      if (dragging) {
        dragging = false;
        pfill.style.transition = '';
        pthumb.style.transition = '';
      }
    });
    const ptime = document.createElement('span');
    ptime.className = 'preview-time';
    ptime.textContent = '0:00 / 0:00';
    pbar.appendChild(pfill);
    pbar.appendChild(pthumb);
    pr.appendChild(pbar);
    pr.appendChild(ptime);
    div.appendChild(pr);

    const playBtn = document.createElement('button');
    playBtn.className = 'btn btn-secondary';
    playBtn.innerHTML = svgIcon(ICO.play, 14) + ' 试听';
    const playLabel = function() { playBtn.innerHTML = svgIcon(ICO.play, 14) + ' 试听'; };
    const stopLabel = function() { playBtn.innerHTML = svgIcon(ICO.pause, 14) + ' 停止'; };
const pfmt = function(t) {
  if (!isFinite(t) || isNaN(t)) return '0:00';
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
};
const updatePreview = function() {
  const cur = preview && isFinite(preview.currentTime) ? preview.currentTime : 0;
  const dur = (preview && isFinite(preview.duration) && preview.duration > 0) ? preview.duration : 0;
  const pct = dur > 0 && cur > 0 ? (cur / dur) * 100 : 0;
  pfill.style.width = pct + '%';
  pthumb.style.left = pct + '%';
  ptime.textContent = pfmt(cur) + ' / ' + pfmt(dur);
};
    playBtn.addEventListener('click', function() {
      if (preview && !preview.paused) {
        preview.pause();
        preview.currentTime = 0;
        playLabel();
        updatePreview();
        activePreview = null;
        return;
      }
      if (!preview) {
        const mime = (f.ext === 'mp3') ? 'audio/mpeg' : (f.ext === 'm4a' ? 'audio/mp4' : 'audio/' + f.ext);
        const blob = new Blob([f.audio], { type: mime });
        const url = URL.createObjectURL(blob);
        preview = new Audio(url);
        preview.addEventListener('loadedmetadata', function() { pr.style.display = 'flex'; updatePreview(); });
        preview.addEventListener('timeupdate', updatePreview);
        preview.addEventListener('ended', function() { playLabel(); updatePreview(); activePreview = null; });
        preview.addEventListener('pause', function() { playLabel(); updatePreview(); });
      }
      activePreview = { audio: preview, index: index, playLabel: playLabel, updatePreview: updatePreview, pr: pr, pfill: pfill, pthumb: pthumb, ptime: ptime };
      pr.style.display = 'flex';
      stopLabel();
      const p = preview.play();
      if (p && p.catch) p.catch(function() { playLabel(); });
    });
    act.appendChild(playBtn);
    const dlBtn = document.createElement('button');
    dlBtn.className = 'btn btn-primary';
    dlBtn.innerHTML = svgIcon(ICO.download, 14) + ' 下载 ' + f.ext.toUpperCase();
    dlBtn.addEventListener('click', function() { downloadFile(f, false); });
    act.appendChild(dlBtn);
    const coverBtn = document.createElement('button');
    coverBtn.className = 'btn btn-secondary';
    coverBtn.innerHTML = svgIcon(ICO.image, 14) + ' 保存封面';
    if (f.cover) {
      coverBtn.addEventListener('click', function() { downloadCover(f, true); });
    } else {
      coverBtn.disabled = true;
    }
    act.appendChild(coverBtn);
  }
  div.appendChild(act);

  return div;
}

function downloadFile(f, batch) {
  const name = getMetaValue(f.meta, 'title') || f.name.replace(/\.ncm$/i, '');
  const sanitized = name.replace(/[<>:"/\\|?*]/g, '_');
  const fileName = sanitized + '.' + f.ext;
  const blob = new Blob([f.audio], { type: 'audio/' + f.ext });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadCover(f) {
  if (!f.cover) return;
  const name = getMetaValue(f.meta, 'title') || f.name.replace(/\.ncm$/i, '');
  const sanitized = name.replace(/[<>:"/\\|?*]/g, '_');
  const blob = new Blob([f.cover]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = sanitized + '.' + detectCoverFormat(f.cover).ext;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function processFile(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const result = parseNCM(data);
      result.name = file.name;
      allFiles.push(result);
      document.getElementById('batchActions').style.display = 'block';
      renderAllCards();
    } catch (err) {
      showStatus('error', '解析失败: ' + file.name + ' - ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function hasDecryptFiles() {
  return allFiles.some(function(f) { return f.type !== 'encrypt'; });
}

function processAll() {
  const decryptFiles = allFiles.filter(function(f) { return f.type !== 'encrypt'; });
  if (decryptFiles.length === 0) return;
  const progress = document.getElementById('fullProgress');
  progress.style.display = 'block';
  const fill = document.getElementById('fullProgressFill');
  const text = document.getElementById('fullProgressText');

  let completed = 0;
  for (let i = 0; i < decryptFiles.length; i++) {
    setTimeout(function(idx) {
      try {
        downloadFile(decryptFiles[idx], true);
        completed++;
        const pct = Math.round((completed / decryptFiles.length) * 100);
        fill.style.width = pct + '%';
        text.textContent = '正在下载... ' + completed + '/' + decryptFiles.length;
        if (completed === decryptFiles.length) {
          text.textContent = '全部下载完成!';
        }
      } catch (e) {
        text.textContent = '下载失败: ' + decryptFiles[idx].name;
      }
    }, i * 500, i);
  }
}

function clearAll() {
  for (var i = 0; i < allFiles.length; i++) { if (allFiles[i]._coverUrl) URL.revokeObjectURL(allFiles[i]._coverUrl); }
  allFiles = [];
  renderAllCards();
  document.getElementById('fullProgress').style.display = 'none';
}

function removeCard(index) {
  if (allFiles[index]._coverUrl) URL.revokeObjectURL(allFiles[index]._coverUrl);
  allFiles.splice(index, 1);
  renderAllCards();
}

function updateBatchInfo() {
  document.getElementById('batchInfo').textContent = '共 ' + allFiles.length + ' 个文件';
  var total = 0;
  for (var i = 0; i < allFiles.length; i++) {
    total += (allFiles[i].type === 'encrypt')
      ? (allFiles[i].data ? allFiles[i].data.length : 0)
      : allFiles[i].audio.length;
  }
  var t = document.getElementById('toolbarStats');
  if (allFiles.length === 0) {
    t.textContent = '\u62D6\u62FD\u6587\u4EF6\u5F00\u59CB';
  } else {
    t.innerHTML = '<b>' + allFiles.length + '</b> \u4E2A\u6587\u4EF6 \u00B7 ' + formatSize(total);
  }
}

function showStatus(type, msg) {
  const box = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'error' ? ICO.error : type === 'success' ? ICO.check : ICO.info;
  el.innerHTML = '<span class="toast-ico">' + svgIcon(icon, 15) + '</span><span class="toast-msg"></span>';
  el.querySelector('.toast-msg').textContent = msg;
  box.appendChild(el);
  setTimeout(function() {
    el.classList.add('hide');
    setTimeout(function() { el.remove(); }, 300);
  }, 4500);
}

function handleFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.ncm')) {
    processFile(file);
  } else if (name.endsWith('.mp3') || name.endsWith('.flac') || name.endsWith('.ogg') || name.endsWith('.wav')) {
    addEncryptFile(file);
  }
}

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const folderInput = document.getElementById('folderInput');
folderInput.setAttribute('webkitdirectory', '');
folderInput.webkitdirectory = true;
const OK_EXT = /\.(ncm|mp3|flac|ogg|wav)$/i;

let lastDropTime = 0;

function handleDrop(e) {
  const now = Date.now();
  if (now - lastDropTime < 300) return;
  lastDropTime = now;
  if (e.preventDefault) e.preventDefault();
  if (e.stopPropagation) e.stopPropagation();
  dropZone.classList.remove('dragover');

  let accepted = 0;
  const files = e.dataTransfer && e.dataTransfer.files;

  if (files && files.length) {
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      if (OK_EXT.test(f.name || '')) accepted++;
      handleFile(f);
    }
  }

  if (accepted > 0) {
    showStatus('success', '正在处理 ' + accepted + ' 个文件');
  } else if (files && files.length) {
    showStatus('info', '未找到支持的音频文件（.ncm/.mp3/.flac/.ogg/.wav）');
  } else {
    showStatus('info', '未检测到文件');
  }
}

window.addEventListener('dragover', function(e) { if (e.preventDefault) e.preventDefault(); }, false);
window.addEventListener('drop', handleDrop, false);

dropZone.addEventListener('dragover', function(e) {
  if (e.preventDefault) e.preventDefault();
  dropZone.classList.add('dragover');
}, false);

dropZone.addEventListener('dragleave', function() {
  dropZone.classList.remove('dragover');
}, false);

dropZone.addEventListener('click', function() { fileInput.click(); });

document.getElementById('pickFileBtn').addEventListener('click', function() { fileInput.click(); });

folderInput.setAttribute('webkitdirectory', '');
folderInput.webkitdirectory = true;

document.getElementById('pickFolderBtn').addEventListener('click', function() {
  if (folderInput.webkitdirectory) {
    folderInput.click();
  } else {
    showStatus('error', '当前浏览器不支持选择文件夹，请直接拖入文件夹');
  }
});

fileInput.addEventListener('change', function() {
  for (let i = 0; i < fileInput.files.length; i++) handleFile(fileInput.files[i]);
  fileInput.value = '';
});

folderInput.addEventListener('change', function() {
  for (let i = 0; i < folderInput.files.length; i++) handleFile(folderInput.files[i]);
  folderInput.value = '';
});

window.addEventListener('error', function(ev) {
  var msg = (ev && ev.message) ? String(ev.message) : '未知脚本错误';
  try { showStatus('error', '脚本错误: ' + msg); } catch (err2) {}
}, false);

document.getElementById('convertAllBtn').addEventListener('click', processAll);
document.getElementById('clearAllBtn').addEventListener('click', clearAll);

// --- Unified card management ---

function snapshotEncryptInputs() {
  var container = document.getElementById('filesContainer');
  for (var i = 0; i < allFiles.length; i++) {
    if (allFiles[i].type !== 'encrypt') continue;
    var card = container.querySelector('#card-' + i);
    if (!card) continue;
    var ti = card.querySelector('.enc-title');
    var ai = card.querySelector('.enc-artist');
    var ali = card.querySelector('.enc-album');
    if (ti) allFiles[i].meta.title = ti.value || allFiles[i].meta.title;
    if (ai) allFiles[i].meta.artist = ai.value || allFiles[i].meta.artist;
    if (ali) allFiles[i].meta.album = ali.value || allFiles[i].meta.album;
  }
}

function renderAllCards() {
  snapshotEncryptInputs();
  if (activePreview && activePreview.audio) {
    activePreview.audio.pause();
    activePreview = null;
  }
  var container = document.getElementById('filesContainer');
  container.innerHTML = '';
  if (allFiles.length === 0) {
    var es = document.createElement('div');
    es.className = 'empty-state';
    es.innerHTML = '<div class="empty-icon">' + svgIcon(ICO.music, 36) + '</div>' +
      '<p class="empty-title">&#x6682;&#x65E0;&#x6587;&#x4EF6;</p>' +
      '<p class="empty-hint">&#x62D6;&#x62FD; .ncm &#x6216;&#x97F3;&#x9891;&#x6587;&#x4EF6;&#x5230;&#x4E0A;&#x65B9;&#x533A;&#x57DF;&#xFF0C;&#x6216;&#x70B9;&#x51FB;&#x4E0A;&#x4F20;&#x5F00;&#x59CB;&#x5904;&#x7406;</p>';
    container.appendChild(es);
  }
  for (var i = 0; i < allFiles.length; i++) container.appendChild(renderFileCard(allFiles[i], i));
  if (hasDecryptFiles()) {
    document.getElementById('batchActions').style.display = 'block';
  } else {
    document.getElementById('batchActions').style.display = 'none';
  }
  updateBatchInfo();
}

function addEncryptFile(file) {
  allFiles.push({ type: 'encrypt', name: file.name, file: file, data: null, meta: { title: file.name.replace(/\.[^.]+$/, ''), artist: '', album: '' }, format: file.name.split('.').pop().toLowerCase(), cover: null });
  renderAllCards();

  var idx = allFiles.length - 1;
  var reader = new FileReader();
  reader.onload = function(e) {
    var data = new Uint8Array(e.target.result);
    var meta = extractMetaFromAudio(data, file.name);
    snapshotEncryptInputs();
    allFiles[idx].meta = meta;
    allFiles[idx].data = data;
    renderAllCards();
  };
  reader.readAsArrayBuffer(file);
}

function encryptSingle(index) {
  var f = allFiles[index];
  if (!f || f.type !== 'encrypt') return;
  if (!f.data) { showStatus('error', f.name + ' 尚未读取完成'); return; }

  var card = document.getElementById('card-' + index);
  if (!card) return;
  var btn = card.querySelector('.actions .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = '加密中…'; }

  var titleInp = card.querySelector('.enc-title');
  var artistInp = card.querySelector('.enc-artist');
  var albumInp = card.querySelector('.enc-album');
  var metaTitle = titleInp ? titleInp.value.trim() || f.meta.title : f.meta.title;
  var metaArtist = artistInp ? artistInp.value.trim() || (f.meta.artist || 'Unknown') : (f.meta.artist || 'Unknown');
  var metaAlbum = albumInp ? albumInp.value.trim() || (f.meta.album || 'Unknown') : (f.meta.album || 'Unknown');
  var metaObj = { musicName: metaTitle, artist: [[metaArtist, '0']], album: metaAlbum, format: f.format || 'mp3', bitrate: 0, duration: 0, musicId: String(Date.now()) };

  try {
    var ncmData = ncmEncrypt(f.data, f.cover || null, metaObj);
    var blob = new Blob([ncmData]);
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = metaTitle.replace(/[<>:"/\\|?*]/g, '_') + '.ncm';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    allFiles.splice(index, 1);
    renderAllCards();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '加密'; }
    showStatus('error', '加密失败: ' + e.message);
  }
}

  renderAllCards();
})();</script>
