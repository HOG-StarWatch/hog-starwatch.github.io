<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件编码</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/file-encoding.css">
</head>
<body>
    <div class="workspace" style="flex-direction: column;">
        <div class="sub-tab-group">
            <div class="sub-tab active" data-action="fileEncTool.switchSubTab" data-mode="b64enc">文件转 Base64/JSON</div>
            <div class="sub-tab" data-action="fileEncTool.switchSubTab" data-mode="b64dec">Base64 还原下载</div>
        </div>

        <div class="workspace" id="inline-workspace">
            <div class="panel">
                
                <!-- Base64 Encode SubTab -->
                <div id="file-b64enc-view">
                     <div class="panel-header">
                        <div class="panel-title">
                            文件转 Base64/JSON
                            <div id="module-badges" style="display:inline-flex; margin-left: 10px;">
                                <span id="badge-brotli" class="status-badge" title="Wasm Brotli Compression Module">Brotli: Idle</span>
                                <span id="badge-zstd" class="status-badge" title="Wasm Zstd Compression Module">Zstd: Idle</span>
                            </div>
                        </div>
                        <div class="panel-actions">
                            <button class="btn btn-icon" data-action="fileEncTool.clearAllFiles" title="清空文件列表">清空</button>
                        </div>
                    </div>
                    
                    <div style="padding:1.5rem; display:flex; flex-direction:column; gap:1.5rem; overflow-y:auto" class="flex-1">
                        
                        <!-- Drop Zone -->
                        <div class="drop-zone" id="drop-zone" data-action="file-click" data-file-target="file-input-hidden">
                            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;"><span class="ic" data-ic="file"></span></div>
                            <div style="font-weight: 600; font-size: 1.1rem;">点击选择或拖拽文件到此处</div>
                            <div style="font-size:0.9rem" class="text-dim">支持多文件批量处理</div>
                            <input type="file" id="file-input-hidden" multiple style="display:none;" data-action="fileEncTool.handleB64Files">
                        </div>

                        <!-- File List Widget -->
                        <div id="file-list-widget" class="file-list-widget">
                            <!-- Items injected by JS -->
                        </div>

                        <!-- Controls -->
                        <div class="control-grid">
                            <div style="display:flex; flex-direction:column; gap:0.5rem;">
                                <label style="font-size:0.9rem" class="text-dim">压缩算法 (Compression):</label>
                                <select id="b64-compress" style="padding:8px; border-radius:6px" class="w-100">
                                    <option value="none">无压缩 (None)</option>
                                    <option value="gzip">Gzip (Native Stream)</option>
                                    <option value="deflate">Deflate (Native Stream)</option>
                                    <option value="brotli">Brotli (Wasm)</option>
                                    <option value="zstd">Zstd (Wasm)</option>
                                </select>
                            </div>
                            <button class="btn btn-primary" data-action="fileEncTool.encodeB64" style="height: 100%; padding: 0 2rem; font-weight: 800; text-shadow: none;">
                                <span style="font-size:1.1rem;"><span class="ic" data-ic="rocket"></span> 生成 JSON</span>
                            </button>
                        </div>
                        
                        <!-- Output Area -->
                        <div style="display:flex; flex-direction:column; gap:0.5rem; min-height:200px" class="flex-1">
                            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                                <label style="font-size:0.9rem;">输出结果 (Output):</label>
                                <div class="toolbar" style="width:auto; height:auto; padding:0; background:none; border:none; gap:10px;">
                                     <button class="btn btn-sm btn-secondary" data-action="copy" data-copy-target="b64-out" style="min-width:80px;"><span class="ic" data-ic="copy"></span> 复制</button>
                                     <button class="btn btn-sm btn-secondary" data-action="fileEncTool.downloadB64Json" style="min-width:100px; color:var(--primary); border-color:var(--primary);"><span class="ic" data-ic="save"></span> 下载 .json</button>
                                </div>
                            </div>
                            <textarea id="b64-out" placeholder="生成的 JSON 结果将显示在这里..." style="padding:1rem; font-family:monospace; font-size:0.85rem" class="flex-1"></textarea>
                        </div>

                    </div>
                </div>

                <!-- Base64 Decode SubTab -->
                <div id="file-b64dec-view" style="display:none; height:100%; flex-direction:column;">
                    <div class="panel-header">
                        <div class="panel-title">Base64 / JSON 还原文件</div>
                        <div class="panel-actions">
                             <button class="btn btn-icon" data-action="fileEncTool.clearRestore">清空</button>
                        </div>
                    </div>
                    <div style="padding:1.5rem; display:flex; flex-direction:column; gap:1.5rem; overflow:hidden" class="flex-1">
                        <!-- Drop Zone for JSON Restore -->
                        <div class="upload-area" id="restore-drop-zone" data-action="file-click" data-file-target="file-restore-input">
                            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;"><span class="ic" data-ic="folder-open"></span></div>
                            <div style="font-weight: 600; font-size: 1.1rem;">点击或拖拽 JSON 文件到此处</div>
                            <div style="font-size:0.9rem" class="text-dim">支持 .json, .txt 文件</div>
                            <input type="file" id="file-restore-input" accept=".json,.txt" style="display:none;" data-action="fileEncTool.loadJsonFile">
                        </div>
                        
                         <textarea id="b64-in" placeholder="在此粘贴 Base64 字符串 或 之前生成的 JSON..." style="min-height:150px;    padding:1rem;"></textarea>
                         
                         <!-- Manual Base64 Restore Options -->
                         <div id="manual-b64-opts" style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; border-top:1px solid var(--border); padding-top:1rem;">
                            <span style="font-size:0.8rem; color:var(--secondary); font-weight:600;">单文件手动还原:</span>
                            <input type="text" id="manual-name" placeholder="文件名 (e.g. test.png)" style="padding:6px;">
                            <select id="manual-mime" style="padding:6px;">
                                <option value="application/octet-stream">Auto/Bin</option>
                                <option value="image/png">PNG</option>
                                <option value="image/jpeg">JPG</option>
                                <option value="application/pdf">PDF</option>
                                <option value="text/plain">TXT</option>
                            </select>
                            <button class="btn btn-sm" data-action="fileEncTool.downloadManual">下载</button>
                            <div style="text-align:right" class="flex-1">
                                <button class="btn btn-primary btn-sm" data-action="fileEncTool.restoreB64"><span class="ic" data-ic="rocket"></span> 解析并还原</button>
                            </div>
                         </div>

                         <div style="overflow-y:auto; border:1px solid var(--border); border-radius:8px; padding:10px; background:rgba(0,0,0,0.1)" class="flex-1">
                             <div id="b64-restore-list" class="flex-col"></div>
                         </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/ui/worker-rpc.js"></script>
    <script src="../js/tools/file-encoding.js"></script>
</body>
</html>
