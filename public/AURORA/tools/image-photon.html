<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通用图片滤镜</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/perf-monitor.js"></script>
    <link rel="stylesheet" href="../css/tools/image-photon.css">
</head>
<body>
    <div class="panel-header">
        <div class="panel-title">
            通用图片滤镜 (General Filters)
            <div id="engine-status">
                <span id="badge" class="stat-badge" style="background:#3b82f6;">Engine: Pure JS</span>
                <span id="perf-time" style="margin-left:10px;"></span>
            </div>
        </div>
        <div class="panel-actions">
            <button class="btn btn-icon" data-action="photon.download"><span class="ic" data-ic="save"></span> 保存</button>
        </div>
    </div>

    <div class="workspace">
        <div class="controls">
            <div class="control-group">
                <label><i class="fas fa-cloud-upload-alt"></i> 图片上传</label>
                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <div style="font-size: 0.8rem;">点击或拖放图片</div>
                    <input type="file" id="imageUpload" accept="image/*" hidden data-action="photon.handle-file">
                </div>
            </div>

            <!-- Tabs -->
            <div class="sub-tab-group">
                <div class="sub-tab active" data-tab="filters" data-action="photon.switch-tab">滤镜</div>
                <div class="sub-tab" data-tab="adjust" data-action="photon.switch-tab">色彩</div>
                <div class="sub-tab" data-tab="transform" data-action="photon.switch-tab">变换</div>
                <div class="sub-tab" data-tab="export" data-action="photon.switch-tab">导出</div>
            </div>

            <!-- Tab: Filters -->
            <div id="tab-filters" class="tab-content">
                <div class="control-group">
                    <div class="filter-title">基础 (Basic)</div>
                    <div class="btn-grid">
                        <button class="btn" data-action="photon.toggle" data-filter="grayscale" id="btn-grayscale">灰度</button>
                        <button class="btn" data-action="photon.toggle" data-filter="invert" id="btn-invert">反色</button>
                        <button class="btn" data-action="photon.toggle" data-filter="sepia" id="btn-sepia">复古</button>
                        <button class="btn" data-action="photon.toggle" data-filter="solarize" id="btn-solarize">过曝</button>
                        <button class="btn" data-action="photon.toggle" data-filter="posterize" id="btn-posterize">色调分离</button>
                        <button class="btn" data-action="photon.toggle" data-filter="threshold" id="btn-threshold">二值化</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="filter-title">风格化 (Stylize)</div>
                    <div class="btn-grid">
                        <button class="btn" data-action="photon.toggle" data-filter="emboss" id="btn-emboss">浮雕</button>
                        <button class="btn" data-action="photon.toggle" data-filter="edge_detection" id="btn-edge_detection">边缘</button>
                        <button class="btn" data-action="photon.toggle" data-filter="sharpen" id="btn-sharpen">锐化</button>
                        <button class="btn" data-action="photon.toggle" data-filter="noise_reduction" id="btn-noise_reduction">降噪</button>
                        <button class="btn" data-action="photon.toggle" data-filter="blur" id="btn-blur">模糊</button>
                        <button class="btn" data-action="photon.toggle" data-filter="mosaic" id="btn-mosaic">马赛克</button>
                    </div>
                </div>

                <div class="control-group">
                    <div class="filter-title">艺术效果 (Artistic)</div>
                    <div class="btn-grid">
                        <button class="btn" data-action="photon.toggle" data-filter="vignette" id="btn-vignette">暗角</button>
                        <button class="btn" data-action="photon.toggle" data-filter="duotone" id="btn-duotone">双色</button>
                        <button class="btn" data-action="photon.toggle" data-filter="colorize" id="btn-colorize">着色</button>
                        <button class="btn" data-action="photon.toggle" data-filter="vintage" id="btn-vintage">老照片</button>
                        <button class="btn" data-action="photon.toggle" data-filter="rgb_split" id="btn-rgb_split">RGB分离</button>
                        <button class="btn" data-action="photon.toggle" data-filter="scanlines" id="btn-scanlines">扫描线</button>
                    </div>
                </div>
            </div>

            <!-- Tab: Adjust -->
            <div id="tab-adjust" class="tab-content" hidden>
                <div class="control-group">
                    <div class="filter-title">色彩调整</div>
                    <div class="input-row" style="flex-direction:column; align-items:flex-start;">
                        <label>亮度 (Brightness) <span id="val-brightness">0</span></label>
                        <input type="range" min="-100" max="100" value="0" class="w-100" data-action="photon.update-value" data-key="brightness">
                    </div>
                    <div class="input-row" style="flex-direction:column; align-items:flex-start;">
                        <label>对比度 (Contrast) <span id="val-contrast">0</span></label>
                        <input type="range" min="-100" max="100" value="0" class="w-100" data-action="photon.update-value" data-key="contrast">
                    </div>
                    <div class="input-row" style="flex-direction:column; align-items:flex-start;">
                        <label>饱和度 (Saturation) <span id="val-saturation">0</span></label>
                        <input type="range" min="-100" max="100" value="0" class="w-100" data-action="photon.update-value" data-key="saturation">
                    </div>
                    <div class="input-row" style="flex-direction:column; align-items:flex-start;">
                        <label>色相旋转 (Hue) <span id="val-hue">0</span></label>
                        <input type="range" min="-180" max="180" value="0" class="w-100" data-action="photon.update-value" data-key="hue">
                    </div>
                </div>
                <div class="control-group">
                    <div class="filter-title">色温 (Temp)</div>
                    <div class="btn-grid">
                        <button class="btn" data-action="photon.toggle" data-filter="warm" id="btn-warm">暖色调</button>
                        <button class="btn" data-action="photon.toggle" data-filter="cool" id="btn-cool">冷色调</button>
                    </div>
                </div>
            </div>

            <!-- Tab: Transform -->
            <div id="tab-transform" class="tab-content" hidden>
                <div class="control-group">
                    <div class="filter-title">镜像 (Mirror)</div>
                    <div class="btn-grid">
                        <button class="btn" data-action="photon.toggle" data-filter="mirror_h" id="btn-mirror_h">水平镜像</button>
                        <button class="btn" data-action="photon.toggle" data-filter="mirror_v" id="btn-mirror_v">垂直镜像</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="filter-title">缩放 (Scale)</div>
                    <div class="input-row">
                        <label style="width:80px">百分比 %</label>
                        <input type="number" id="scale-percent" value="100" min="1" max="500" data-action="photon.update-scale" data-type="percent">
                    </div>
                    <div class="input-row">
                        <label style="width:80px">宽 px</label>
                        <input type="number" id="scale-width" data-action="photon.update-scale" data-type="width">
                    </div>
                    <div class="input-row">
                        <label style="width:80px">高 px</label>
                        <input type="number" id="scale-height" data-action="photon.update-scale" data-type="height">
                    </div>
                    <div style="font-size:0.8rem; margin-top:5px" class="text-dim">
                        原始尺寸: <span id="original-size">- x -</span>
                    </div>
                </div>

                <div class="control-group">
                    <div class="filter-title">
                        裁剪 (Crop) 
                        <label style="margin-left:auto; font-size:0.8rem;"><input type="checkbox" id="crop-enabled" data-action="photon.toggle-crop"> 启用</label>
                    </div>
                    <div id="crop-controls" style="opacity:0.5; pointer-events:none; display:flex; flex-direction:column; gap:5px;">
                        <div class="input-row"><label style="width:30px">X</label><input type="number" id="crop-x" value="0" data-action="photon.update-crop"></div>
                        <div class="input-row"><label style="width:30px">Y</label><input type="number" id="crop-y" value="0" data-action="photon.update-crop"></div>
                        <div class="input-row"><label style="width:30px">W</label><input type="number" id="crop-w" data-action="photon.update-crop"></div>
                        <div class="input-row"><label style="width:30px">H</label><input type="number" id="crop-h" data-action="photon.update-crop"></div>
                    </div>
                </div>
            </div>

            <!-- Tab: Export -->
            <div id="tab-export" class="tab-content" hidden>
                <div class="control-group">
                    <div class="filter-title">导出设置</div>
                    <div class="input-row">
                        <label>格式</label>
                        <select id="export-format">
                            <option value="image/png">PNG (无损)</option>
                            <option value="image/jpeg">JPEG (压缩)</option>
                            <option value="image/webp">WebP (高效)</option>
                        </select>
                    </div>
                    <div class="input-row">
                        <label>质量 (0-1)</label>
                        <input type="number" id="export-quality" value="0.9" step="0.1" min="0.1" max="1.0">
                    </div>
                    <div class="input-row" style="margin-top:10px;">
                        <button class="btn btn-primary w-100" data-action="photon.download">下载图片</button>
                    </div>
                </div>
            </div>

            <button class="btn btn-secondary" data-action="photon.reset" style="margin-top:auto;"><span class="ic" data-ic="rotate-ccw"></span> 重置所有</button>
        </div>

        <div class="preview-area">
            <canvas id="canvas" class="canvas-responsive"></canvas>
            <div id="placeholder" style="position:absolute; pointer-events:none" class="text-dim">请先上传图片</div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/tools/image-photon.js"></script>
</body>
</html>
