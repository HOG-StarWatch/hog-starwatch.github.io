<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间工具箱</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <script src="../js/app.js"></script>
    <link rel="stylesheet" href="../css/tools/datetime.css">
</head>
<body>
    <div class="workspace time-container">
        
        <div class="tool-tabs">
            <div class="tool-tab active" data-action="dt.switch-tab" data-tab="calc">时间计算</div>
            <div class="tool-tab" data-action="dt.switch-tab" data-tab="cron">Cron 表达式</div>
        </div>

        <!-- Tab 1: Time Calculator -->
        <div id="tab-calc" class="tab-content active">
            <div class="calc-grid">
                <!-- Timestamp Converter -->
                <div class="panel" style="height: auto;">
                    <div class="panel-header">
                        <div class="panel-title">Unix 时间戳转换</div>
                        <div class="panel-actions">
                            <button class="btn btn-sm" data-action="ts.now">获取当前</button>
                        </div>
                    </div>
                    
                    <div style="padding: 1.5rem;">
                            <div class="ts-display" id="current-ts" data-action="copy" data-copy-target="current-ts" title="点击复制">
                            加载中...
                        </div>

                        <div class="time-row">
                            <div class="time-label">时间戳 (s)</div>
                            <input type="number" id="ts-in-sec" class="time-input" placeholder="10位时间戳" data-action="ts.convert" data-type="sec">
                        </div>
                        <div class="time-row">
                            <div class="time-label">时间戳 (ms)</div>
                            <input type="number" id="ts-in-ms" class="time-input" placeholder="13位时间戳" data-action="ts.convert" data-type="ms">
                        </div>
                        <div class="time-row">
                            <div class="time-label">日期时间</div>
                            <input type="text" id="ts-date-out" class="time-input" readonly placeholder="YYYY-MM-DD HH:mm:ss">
                        </div>
                        
                        <hr style="border:0; border-top:1px dashed var(--border); margin: 20px 0;">

                        <div class="time-row">
                            <div class="time-label">日期输入</div>
                            <input type="datetime-local" id="date-in" class="time-input" step="1" data-action="ts.convert" data-type="date">
                        </div>
                        <div class="time-row">
                            <div class="time-label">结果 (s)</div>
                            <input type="text" id="date-out-ts" class="time-input" readonly>
                            <button class="btn btn-sm btn-icon" style="margin-left: 10px;" data-action="copy" data-copy-target="date-out-ts"><span class="ic" data-ic="copy"></span></button>
                        </div>
                    </div>
                </div>

                <!-- Date Diff -->
                <div class="panel" style="height: auto;">
                    <div class="panel-header">
                        <div class="panel-title">日期差值计算</div>
                    </div>
                    <div style="padding: 1.5rem;">
                        <div class="time-row">
                            <div class="time-label">开始时间</div>
                            <input type="datetime-local" id="diff-start" class="time-input" step="1">
                        </div>
                        <div class="time-row">
                            <div class="time-label">结束时间</div>
                            <input type="datetime-local" id="diff-end" class="time-input" step="1">
                        </div>
                        
                        <div style="display:flex; gap:10px; margin-bottom:20px;">
                            <button class="btn btn-primary flex-1" data-action="ts.calc-diff">计算差值</button>
                            <button class="btn" data-action="ts.clear-diff">清空</button>
                        </div>

                        <div id="diff-result" style="display:none;">
                            <div class="diff-result-item">
                                <span>总天数</span>
                                <span class="diff-val" id="diff-days">0</span>
                            </div>
                            <div class="diff-result-item">
                                <span>总小时</span>
                                <span class="diff-val" id="diff-hours">0</span>
                            </div>
                            <div class="diff-result-item">
                                <span>总分钟</span>
                                <span class="diff-val" id="diff-mins">0</span>
                            </div>
                            <div class="diff-result-item">
                                <span>总秒数</span>
                                <span class="diff-val" id="diff-secs">0</span>
                            </div>
                            <div class="diff-result-item" style="background:rgba(192, 132, 252, 0.1); margin-top: 15px;">
                                <span>详细</span>
                                <span class="diff-val" id="diff-detail" style="font-size:0.9rem;">0天 0小时 0分 0秒</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 2: Cron Generator -->
        <div id="tab-cron" class="tab-content">
            <div class="panel" style="height: auto;">
                <div class="panel-header">
                    <div class="panel-title">Cron 表达式生成器</div>
                </div>
                <div style="padding: 2rem;">
                    <div class="cron-display">
                        <div class="cron-expression" id="cron-text" data-action="copy" data-copy-target="cron-text" title="点击复制">* * * * *</div>
                        <div class="cron-desc" id="cron-human">每分钟</div>
                    </div>

                    <div class="quick-presets">
                        <button class="preset-btn" data-action="cron.set" data-cron="* * * * *">每分钟</button>
                        <button class="preset-btn" data-action="cron.set" data-cron="0 * * * *">每小时</button>
                        <button class="preset-btn" data-action="cron.set" data-cron="0 0 * * *">每天午夜</button>
                        <button class="preset-btn" data-action="cron.set" data-cron="0 9 * * 1">每周一 9:00</button>
                        <button class="preset-btn" data-action="cron.set" data-cron="0 0 1 * *">每月1号</button>
                        <button class="preset-btn" data-action="cron.set" data-cron="*/5 * * * *">每5分钟</button>
                    </div>

                    <div class="cron-options-grid">
                        <div class="option-group">
                            <label>分钟 (Minute)</label>
                            <select id="cron-min" data-action="cron.update">
                                <option value="*">* (每分)</option>
                                <option value="*/5">*/5 (每5分)</option>
                                <option value="*/15">*/15 (每15分)</option>
                                <option value="*/30">*/30 (每30分)</option>
                                <option value="0">0 (整点)</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label>小时 (Hour)</label>
                            <select id="cron-hour" data-action="cron.update">
                                <option value="*">* (每时)</option>
                                <option value="*/2">*/2 (每2时)</option>
                                <option value="*/6">*/6 (每6时)</option>
                                <option value="0">0 (午夜)</option>
                                <option value="9">9 (上午9点)</option>
                                <option value="12">12 (中午)</option>
                                <option value="18">18 (下午6点)</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label>日期 (Day)</label>
                            <select id="cron-day" data-action="cron.update">
                                <option value="*">* (每日)</option>
                                <option value="1">1 (每月1号)</option>
                                <option value="15">15 (每月15号)</option>
                                <option value="L">L (最后一天)</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label>月份 (Month)</label>
                            <select id="cron-month" data-action="cron.update">
                                <option value="*">* (每月)</option>
                                <option value="*/3">*/3 (每季度)</option>
                                <option value="1">1 (一月)</option>
                                <option value="6">6 (六月)</option>
                                <option value="12">12 (十二月)</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label>星期 (Week)</label>
                            <select id="cron-week" data-action="cron.update">
                                <option value="*">* (每日)</option>
                                <option value="1-5">1-5 (工作日)</option>
                                <option value="0,6">0,6 (周末)</option>
                                <option value="1">1 (周一)</option>
                                <option value="5">5 (周五)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div id="toast" class="toast">操作成功</div>
    
    <script src="../js/tools/datetime.js"></script>
</body>
</html>
