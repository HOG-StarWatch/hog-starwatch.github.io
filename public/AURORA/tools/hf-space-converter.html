<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HF Space App Converter</title>
<link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
<link rel="stylesheet" href="../css/tools/hf-space-converter.css">
</head>
<body>
<iframe id="mainFrame"></iframe>
<div class="empty" id="empty">
    <h2>请输入 Space 链接</h2>
    <p>支持自动提取文本中的链接</p>
    <div class="tip"><span class="ic" data-ic="bulb"></span> 技巧：网址后加 <code>?url=链接</code> 可直接加载</div>
</div>
<div id="icon" class="icon tr" data-action="togMin"><span class="ic" data-ic="heart"></span></div>
<div id="panel" class="panel tr" data-action="panelFocus" tabindex="0">
    <div class="head">
        <span>HF Space App Converter</span>
        <div class="btns">
            <!-- Theme toggle removed as it syncs with AURORA -->
            <button class="ibtn" data-action="togMin">_</button>
        </div>
    </div>
    <input type="text" id="inp" placeholder="粘贴链接或包含链接的文本...">
    <div class="act-btns"><button class="btn btn-p" id="goBtn" data-action="act">转换并加载</button><button class="btn btn-s" id="cpBtn" data-action="cp" disabled>复制</button></div>
    <div id="st" class="status"></div>
    <div class="pos-bar">
        <div class="p-btn" data-action="setPos" data-pos="tl"></div><div class="p-btn" data-action="setPos" data-pos="tr"></div>
        <div class="p-btn" data-action="setPos" data-pos="bl"></div><div class="p-btn" data-action="setPos" data-pos="br"></div>
    </div>
</div>
<script src="../js/app.js"></script>
<script src="../js/loader.js"></script>
<script src="../js/tools/hf-space-converter.js"></script>
</body>
</html>
