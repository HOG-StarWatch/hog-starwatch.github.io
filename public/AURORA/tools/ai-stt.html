<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音转文本 (STT)</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/ai-stt.css">
</head>
<body class="scroll-content">
    <div class="workspace stt-container">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">语音转文本 (STT)</div>
                <div class="panel-actions">
                    <button class="btn btn-icon" data-action="stt.clear">清空</button>
                </div>
            </div>
            <div class="stt-grid">
                <div class="input-group">
                    <label for="stt-source">识别来源</label>
                    <select id="stt-source">
                        <option value="mic">麦克风实时</option>
                        <option value="upload">上传音频</option>
                        <option value="playback">回放识别</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="stt-lang">识别语言</label>
                    <select id="stt-lang">
                        <option value="zh-CN">中文（普通话）</option>
                        <option value="zh-HK">中文（粤语）</option>
                        <option value="en-US">English (US)</option>
                        <option value="en-GB">English (UK)</option>
                        <option value="ja-JP">日本語</option>
                        <option value="ko-KR">한국어</option>
                        <option value="fr-FR">Français</option>
                        <option value="de-DE">Deutsch</option>
                        <option value="es-ES">Español</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="stt-mode">识别模式</label>
                    <select id="stt-mode">
                        <option value="continuous">连续</option>
                        <option value="single">单次</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>显示实时结果</label>
                    <label><input type="checkbox" id="stt-interim"> 启用</label>
                </div>
                <div class="input-group upload-config" id="stt-api-group">
                    <label for="stt-api">上传识别 API</label>
                    <input type="text" id="stt-api" placeholder="https://example.com/stt">
                </div>
                <div class="input-group upload-config" id="stt-header-group">
                    <label for="stt-header-name">请求头</label>
                    <input type="text" id="stt-header-name" placeholder="Authorization">
                </div>
                <div class="input-group upload-config">
                    <label for="stt-header-value">请求头值</label>
                    <input type="text" id="stt-header-value" placeholder="Bearer ...">
                </div>
            </div>
            <div class="stt-actions">
                <button class="btn btn-primary" data-action="stt.start">开始识别</button>
                <button class="btn" data-action="stt.stop">停止</button>
                <button class="btn btn-primary" id="stt-upload-btn" data-action="stt.recognize-upload" disabled>识别上传音频</button>
                <button class="btn btn-primary" id="stt-playback-btn" data-action="stt.playback-recognize" disabled>播放并识别</button>
                <button class="btn btn-secondary" data-action="copy" data-copy-target="stt-output">复制文本</button>
            </div>
            <div class="upload-block" id="stt-upload-block">
                <div class="upload-area" data-action="file-click" data-file-target="stt-file-input">
                    <i class="fas fa-file-audio text-dim"></i>
                    <p style="margin:0" class="text-dim">点击或拖拽音频文件到此处</p>
                    <input type="file" id="stt-file-input" accept="audio/*" data-action="stt.handle-file" style="display:none;">
                </div>
                <div id="stt-file-info" class="file-info">
                    <span id="stt-file-text"></span>
                    <button class="btn btn-secondary btn-sm" data-action="stt.clear-file">移除文件</button>
                </div>
                <audio id="stt-audio" controls></audio>
            </div>
            <textarea id="stt-output" placeholder="识别结果将显示在这里..." readonly></textarea>
            <div class="status-row" id="stt-status">状态：就绪</div>
        </div>

        <div class="panel" id="stt-support" style="display:none;">
            <div class="support-warning">当前浏览器不支持实时语音识别，可使用上传识别。</div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/tools/ai-stt.js"></script>
</body>
</html>
