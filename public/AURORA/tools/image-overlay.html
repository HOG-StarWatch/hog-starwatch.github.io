<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片重叠合成工具</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/image-overlay.css">
</head>
<body>
    <div class="layout-sidebar">
        <!-- Controls Panel -->
        <div class="controls panel">
            <h2 style="margin:0 0 10px 0; color:var(--primary); font-size:1.5rem;">图片合成</h2>
            <p style="font-size:0.85rem; margin-bottom:15px" class="text-dim">
                选择两张图片，调整透明度和混合模式。
            </p>
            
            <!-- Upload 1 -->
            <div class="control-group">
                <label>1. 底层图片 (Base)</label>
                <div class="upload-area" id="uploadArea1" data-action="file-click" data-file-target="image1">
                    <i class="fas fa-image text-dim"></i>
                    <div class="upload-text text-dim">点击上传</div>
                    <img id="preview1" class="preview-thumb">
                    <input type="file" id="image1" accept="image/*" hidden>
                </div>
            </div>

            <!-- Upload 2 -->
            <div class="control-group">
                <label>2. 上层图片 (Overlay)</label>
                <div class="upload-area" id="uploadArea2" data-action="file-click" data-file-target="image2">
                    <i class="fas fa-layer-group text-dim"></i>
                    <div class="upload-text text-dim">点击上传</div>
                    <img id="preview2" class="preview-thumb">
                    <input type="file" id="image2" accept="image/*" hidden>
                </div>
            </div>

            <!-- Settings -->
            <div class="control-group">
                <label>上层透明度: <span id="opacityValue" style="color: var(--primary); margin-left: auto;">50%</span></label>
                <input type="range" id="opacity" min="0" max="100" value="50" class="w-100">
            </div>
            
            <div class="control-group">
                <label>混合模式</label>
                <select id="blendMode" class="w-100">
                    <option value="normal">正常 (Normal)</option>
                    <option value="difference">差值 (Difference)</option>
                    <option value="multiply">正片叠底 (Multiply)</option>
                    <option value="screen">滤色 (Screen)</option>
                </select>
                <div id="modeInfo" style="font-size:0.8rem; margin-top:5px; padding:5px; background:rgba(255,255,255,0.05); border-radius:4px" class="text-dim">
                    正常模式：上层图片按透明度叠加在底层图片上
                </div>
            </div>
            
            <!-- Actions -->
            <div style="display: flex; gap: 10px; margin-top: auto; flex-direction: column;">
                <button id="combine" class="btn btn-primary" disabled><span class="ic" data-ic="zap"></span> 合成图片</button>
                <button id="download" class="btn btn-success" disabled><span class="ic" data-ic="save"></span> 下载结果</button>
                <button id="reset" class="btn btn-secondary"><span class="ic" data-ic="refresh"></span> 重置</button>
            </div>
        </div>

        <!-- Result Area -->
        <div class="preview-area">
            <div id="placeholder" style="text-align:center" class="text-dim">
                <i class="fas fa-magic" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                <div>请上传两张图片并点击合成</div>
            </div>
            <canvas id="resultCanvas" class="canvas-responsive" style="display:none; border-radius: var(--radius-md); box-shadow: var(--shadow);"></canvas>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/tools/image-overlay.js"></script>
</body>
</html>
