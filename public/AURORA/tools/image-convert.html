<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片格式转换</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/image-convert.css">
</head>
<body class="scroll-content">
    <div class="sub-tab-group">
        <div class="sub-tab active" data-action="switchSubTab" data-mode="format">格式转换</div>
        <div class="sub-tab" data-action="switchSubTab" data-mode="resize">尺寸调整</div>
        <div class="sub-tab" data-action="switchSubTab" data-mode="base64">Base64 转换</div>
    </div>

    <div class="workspace">
        <!-- Format Converter -->
        <div id="tab-format" class="panel" style="padding: 1.5rem;">
            <div class="converter-container">
                <div class="panel-title">图片格式转换器</div>
                
                <!-- Controls -->
                <div class="input-row" style="flex-wrap: wrap; gap: 1rem;">
                    <div style="min-width:200px" class="flex-1">
                        <label>目标格式</label>
                        <select id="target-format" class="w-100">
                            <option value="image/png">PNG</option>
                            <option value="image/jpeg">JPEG</option>
                            <option value="image/webp">WEBP</option>
                            <option value="image/bmp">BMP</option>
                            <option value="image/gif">GIF (仅首帧)</option>
                        </select>
                    </div>
                    <div style="min-width:200px" class="flex-1">
                        <label>质量 (JPEG/WEBP)</label>
                        <input type="range" id="target-quality" min="0.1" max="1.0" step="0.1" value="0.9" data-action="convert.updateQualityLabel">
                        <span id="quality-val" style="font-size: 0.8rem; color: var(--primary);">90%</span>
                    </div>
                </div>

                <!-- Upload -->
                <div class="upload-area" id="drop-zone">
                    <div style="font-size: 2rem; margin-bottom: 0.5rem;"><span class="ic" data-ic="folder-open"></span></div>
                    <div>点击或拖拽图片到此处</div>
                    <div style="font-size:0.8rem; margin-top:0.5rem" class="text-dim">支持 PNG, JPG, WEBP, BMP, GIF 等</div>
                    <input type="file" id="file-input" accept="image/*" multiple style="display: none;">
                </div>

                <!-- Actions -->
                <div style="display: flex; gap: 1rem;">
                    <button class="btn btn-primary" data-action="imgConverter.convertAll">全部转换</button>
                    <button class="btn btn-secondary" data-action="imgConverter.clearAll">清空列表</button>
                </div>

                <!-- Preview List -->
                <div class="preview-grid" id="preview-list">
                    <!-- Items will be injected here -->
                </div>
            </div>
        </div>

        <!-- Resize Tool -->
        <div id="tab-resize" class="panel" style="padding: 1.5rem; display: none;">
            <div class="panel-title">图片尺寸调整</div>
            
            <!-- Upload Area -->
            <div class="upload-area" id="resize-drop-zone" style="margin-bottom: 1.5rem;">
                <div style="font-size: 2rem; margin-bottom: 0.5rem;"><span class="ic" data-ic="ruler"></span></div>
                <div>点击或拖拽图片到此处</div>
                <input type="file" id="resize-file-input" accept="image/*" style="display: none;">
            </div>

            <!-- Workspace (Hidden until file loaded) -->
            <div id="resize-workspace" style="display: none;">
                <div style="display: flex; flex-wrap: wrap; gap: 2rem;">
                    <!-- Controls -->
                    <div style="min-width:300px" class="flex-1">
                        <div class="input-row">
                            <label>原始尺寸</label>
                            <div id="original-size" style="padding:0.5rem 0" class="text-dim">- x -</div>
                        </div>

                        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                            <div class="flex-1">
                                <label>宽度 (px)</label>
                                <input type="number" id="resize-width" min="1" class="input-box w-100">
                            </div>
                            <div class="flex-1">
                                <label>高度 (px)</label>
                                <input type="number" id="resize-height" min="1" class="input-box w-100">
                            </div>
                        </div>

                        <div class="input-row" style="margin-bottom: 1.5rem;">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" id="resize-lock" checked style="width: auto;">
                                锁定长宽比
                            </label>
                        </div>

                        <div class="input-row">
                            <label>输出格式</label>
                            <select id="resize-format" style="margin-bottom:1rem" class="w-100">
                                <option value="image/png">PNG</option>
                                <option value="image/jpeg">JPEG</option>
                                <option value="image/webp">WEBP</option>
                            </select>
                        </div>

                        <div class="input-row" id="resize-quality-wrapper" style="display: none;">
                            <label>质量 (<span id="resize-quality-val">0.9</span>)</label>
                            <input type="range" id="resize-quality" min="0.1" max="1.0" step="0.05" value="0.9" class="w-100">
                        </div>

                        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                            <button class="btn btn-primary flex-1" data-action="resizeTool.process">应用并预览</button>
                            <button class="btn btn-secondary flex-1" id="resize-download-btn" disabled data-action="resizeTool.download">下载图片</button>
                        </div>
                    </div>

                    <!-- Preview -->
                    <div style="min-width:300px; background:rgba(0,0,0,0.2); border-radius:var(--radius-md); padding:1rem; display:flex; align-items:center; min-height:300px; border:1px dashed var(--border)" class="flex-1 btn-center">
                        <div id="resize-preview-container" style="max-width: 100%; max-height: 400px; overflow: auto;">
                            <span class="text-dim">预览区域</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Base64 Converter -->
        <div id="tab-base64" class="panel" style="padding: 1.5rem; display:none;">
            <div class="panel-title">Base64 图片转换</div>
            
            <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                <button class="mode-btn active" id="mode-to-base64" data-action="base64Tool.switchMode" data-mode="toBase64">图片转 Base64</button>
                <button class="mode-btn" id="mode-to-image" data-action="base64Tool.switchMode" data-mode="toImage">Base64 转图片</button>
            </div>

            <!-- Image to Base64 -->
            <div id="view-to-base64" class="tab-content">
                <div class="upload-area" id="b64-drop-zone">
                    <div style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.8;"><span class="ic" data-ic="image"></span></div>
                    <div style="font-size: 1.1rem; font-weight: 500; margin-bottom: 0.5rem;">点击或拖拽图片到此处</div>
                    <div style="font-size:0.85rem; opacity:0.7" class="text-dim">支持 PNG, JPG, WEBP, GIF (自动转换为 Base64)</div>
                    <input type="file" id="b64-file-input" accept="image/*" style="display: none;">
                </div>
                
                <div id="b64-result-area" style="display:none; margin-top:1.5rem;">
                    <div class="input-row">
                        <label>Base64 结果</label>
                        <textarea id="b64-output" style="min-height:150px" class="w-100" readonly></textarea>
                    </div>
                    <div style="display:flex; gap:1rem; margin-top:1rem;">
                        <button class="btn btn-primary" data-action="copy" data-copy-target="b64-output">复制结果</button>
                        <button class="btn btn-secondary" data-action="base64Tool.copyAsCSS">复制为 CSS</button>
                        <button class="btn btn-secondary" data-action="base64Tool.copyAsHTML">复制为 HTML img</button>
                    </div>
                    <div style="margin-top:1rem; text-align:center;">
                        <img id="b64-preview-img" style="max-width:100%; max-height:200px; border-radius:var(--radius-md); box-shadow:0 4px 10px rgba(0,0,0,0.3);">
                        <div id="b64-file-info" style="font-size:0.8rem; margin-top:0.5rem" class="text-dim"></div>
                    </div>
                </div>
            </div>

            <!-- Base64 to Image -->
            <div id="view-to-image" class="tab-content hidden">
                <div class="input-row">
                    <label>Base64 字符串</label>
                    <textarea id="b64-input" spellcheck="false" placeholder="粘贴 Base64 字符串..." style="min-height:150px" class="w-100"></textarea>
                </div>
                <button class="btn btn-primary" data-action="base64Tool.decode" style="margin-top:1rem;">解码并预览</button>
                
                <div id="decode-result-area" style="display:none; margin-top:1.5rem; text-align:center;">
                    <img id="decode-preview-img" style="max-width:100%; max-height:300px; border-radius:var(--radius-md); box-shadow:0 4px 10px rgba(0,0,0,0.3);">
                    <div style="margin-top:1rem;">
                        <button class="btn btn-secondary" data-action="base64Tool.download">下载图片</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/ui/file-drop.js"></script>
    <script src="../js/tools/image-convert.js"></script>
</body>
</html>
