<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Master</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/tools/network-ping.css">
</head>
<body>
<div class="pink-overlay"></div>

<div class="container">
    <header>
        <h1>Network Tester</h1>
        <p>极简 · 快速 · 准确</p>
    </header>

    <div class="main-grid">
        <div class="panel">
            <div class="tabs">
                <div class="tab active" data-action="switchRegion" data-mode="domestic">国内节点</div>
                <div class="tab" data-action="switchRegion" data-mode="international">国际节点</div>
                <div class="tab" data-action="switchRegion" data-mode="adult" style="display:none; color:#ff80ab;">成人内容</div>
            </div>
            
            <div style="position:relative; margin-bottom:20px;">
                <i class="fas fa-search text-dim"></i>
                <input type="text" id="siteSearch" placeholder="搜索网站..." data-action="filterSites" 
                       style="padding:12px 12px 12px 45px; outline:none; font-size:0.95rem; transition:0.3s" class="w-100">
            </div>

            <button class="btn-main w-100" data-action="pingAll">
                <i class="fas fa-satellite-dish"></i> 扫描当前列表所有连通性
            </button>
            
            <div id="adultDashboard" style="display:none; margin-bottom: 20px; padding: 15px; background: rgba(255, 0, 102, 0.1); border-radius: 16px; border: 1px solid #ff0066;">
                <h3 style="color: #ff0066; margin-bottom: 15px;"><i class="fas fa-fire"></i> 热门推荐 (Hot)</h3>
                <div class="category-grid" id="adultQuickAccess"></div>
            </div>
            
            <div class="test-list" id="siteList"></div>
        </div>

        <div class="side">
            <!-- Custom Ping Panel -->
            <div class="panel">
                <h2><i class="fas fa-terminal"></i> 连通性测试</h2>
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="text" id="customTarget" placeholder="输入 IP 或域名" 
                           style="padding:12px; background:var(--bg-input); outline:none; font-family:'JetBrains Mono', monospace; font-size:0.9rem" class="flex-1">
                    <button class="btn-main" id="customPingBtn" style="padding:12px 20px;"><i class="fas fa-paper-plane"></i></button>
                </div>
                <div id="customResult" style="min-height:40px; font-size:0.9rem; padding:10px; border-radius:var(--radius-sm); background:var(--bg-deep);">
                    <span class="text-dim">输入地址并点击发送以测试</span>
                </div>
            </div>

            <div class="panel speed-dashboard">
                <h2 id="currentStatus"><i class="fas fa-tachometer-alt"></i> 实时测速</h2>

                <div class="unit-switch">
                    <div class="u-btn active" id="u-mbps" data-action="changeUnit" data-mode="Mbps">Mbps</div>
                    <div class="u-btn" id="u-mbps-s" data-action="changeUnit" data-mode="MBps">MB/s</div>
                </div>

                <div class="engine-container">
                    <label class="engine-label">测速引擎</label>
                    <div class="engine-box" id="engineBox">
                        <div class="engine-icon-box">
                            <i class="fas fa-server"></i>
                        </div>
                        <div class="w-100">
                            <select id="engineSelect" class="engine-select" data-action="updateEngineInfo">
                                <!-- Populated by JS -->
                            </select>
                        </div>
                    </div>
                </div>

                <div class="gauge-group">
                    <div class="gauge-card" id="cardDown">
                        <div class="gauge-val" id="dispDown">0.0</div>
                        <div class="gauge-unit">DOWNLOAD</div>
                    </div>
                    <div class="gauge-card" id="cardUp">
                        <div class="gauge-val" id="dispUp">0.0</div>
                        <div class="gauge-unit">UPLOAD</div>
                    </div>
                </div>

                <div style="font-size: 0.9rem; padding: 15px; background: rgba(0,0,0,0.2); border-radius: var(--radius-sm); margin-bottom:20px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                    <span class="text-dim">实时延迟:</span>
                    <span><span id="dispPing" style="color:var(--primary); font-family: 'JetBrains Mono', monospace; font-weight: 800;">0</span> <small class="text-dim">ms</small></span>
                </div>

                <div class="btn-group">
                    <button class="btn-main" id="singleBtn" data-action="runSingle">开始测速</button>
                    <button class="btn-all" id="seqBtn" data-action="openCloudflareSpeedtest">内置测速页</button>
                </div>
            </div>

            <div class="panel">
                <h2><i class="fas fa-history"></i> 测速历史</h2>
                <div id="historyList" class="history-container">
                    <div style="text-align:center; padding:40px; font-size:0.9rem" class="text-dim">
                        <i class="fas fa-inbox" style="display: block; font-size: 2rem; margin-bottom: 10px; opacity: 0.5;"></i>
                        暂无测试数据
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="speedtestModal" data-action="closeCloudflareSpeedtest">
    <div class="modal-close" data-action="closeCloudflareSpeedtest"><i class="fas fa-times"></i></div>
    <div class="modal-content">
        <div class="modal-loader" id="modalLoader">
            <div class="spinner"></div>
            <p style="font-weight: 700; letter-spacing: 1px;">正在建立加密连接...</p>
        </div>
        <iframe src="about:blank" id="speedtestIframe"></iframe>
    </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/tools/network-ping.js"></script>
</body>
</html>
