<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互式画板</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/image-drawing.css">
</head>
<body>
    <div class="container">
        <div class="flex-1">
            <header>
                <h1>交互式画板</h1>
                <p class="subtitle">集成颜色工具、橡皮擦预览和钢笔功能的创作工具</p>
            </header>
            
            <div class="card">
                <div class="card-header">
                    <h2>开始创作</h2>
                </div>
                <div class="card-body">
                    <!-- 绘图工具选择 -->
                    <div class="drawing-tools">
                        <button class="tool-btn active" id="brushTool" data-tool="brush"><span class="ic" data-ic="brush"></span> 画笔</button>
                        <button class="tool-btn" id="eraserTool" data-tool="eraser"><span class="ic" data-ic="eraser"></span> 橡皮</button>
                        <button class="tool-btn" id="penTool" data-tool="pen"><span class="ic" data-ic="pen"></span> 钢笔</button>
                    </div>
                    
                    <div class="canvas-container" id="canvasContainer">
                        <canvas id="drawingCanvas"></canvas>
                        <canvas id="eraserPreview" class="eraser-preview"></canvas>
                    </div>
                    
                    <div class="tools">
                        <div class="tool-section">
                            <h3>颜色选择</h3>
                            <div class="color-picker">
                                <div class="color-option active" style="background-color: #000000;" data-color="#000000"></div>
                                <div class="color-option" style="background-color: #ffffff;" data-color="#ffffff"></div>
                                <div class="color-option" style="background-color: #c084fc;" data-color="#c084fc"></div>
                                <div class="color-option" style="background-color: #2dd4bf;" data-color="#2dd4bf"></div>
                                <div class="color-option" style="background-color: #f472b6;" data-color="#f472b6"></div>
                                <div class="color-option" style="background-color: #ef4444;" data-color="#ef4444"></div>
                                <div class="color-option" style="background-color: #eab308;" data-color="#eab308"></div>
                                <div class="color-option" style="background-color: #3b82f6;" data-color="#3b82f6"></div>
                            </div>
                        </div>
                        
                        <div class="tool-section">
                            <h3>笔刷设置</h3>
                            <div class="brush-size">
                                <span>大小:</span>
                                <input type="range" id="brushSize" min="1" max="50" value="5">
                                <span id="brushSizeValue">5px</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="tool-buttons">
                        <button id="clearCanvas" class="btn btn-danger">清空画布</button>
                        <button id="saveCanvas" class="btn btn-success">保存图像</button>
                        <button id="fillBackground" class="btn">填充背景</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="color-tools">
            <div class="card">
                <div class="card-header">
                    <h2>颜色转换器</h2>
                </div>
                <div class="card-body">
                    <div class="color-section">
                        <div class="color-input-group">
                            <label>HEX 颜色代码</label>
                            <input type="text" id="hexInput" placeholder="#000000" value="#000000">
                        </div>
                        <div class="color-input-group">
                            <label>RGB 颜色代码</label>
                            <input type="text" id="rgbInput" placeholder="rgb(0, 0, 0)">
                        </div>
                        <div class="color-display" id="colorDisplay" style="background-color: #000000;"></div>
                        <div class="color-result" id="colorResult"></div>
                    </div>
                </div>
            </div>

            <!-- 基于图片的色卡生成 (新增) -->
            <div class="card">
                <div class="card-header">
                    <h2>基于图片的色卡生成</h2>
                </div>
                <div class="card-body">
                    <div class="color-section">
                        <div class="image-upload">
                            <div class="file-input-wrapper">
                                <label class="file-input-label" for="fileInput">选择图片</label>
                                <input type="file" id="fileInput" accept="image/*">
                            </div>
                            <img id="imagePreview" class="image-preview" alt="图片预览">
                            <button class="btn w-100" id="generatePaletteBtn">生成色卡</button>
                        </div>
                        <div class="color-palette" id="imageColorPalette"></div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2>历史颜色</h2>
                </div>
                <div class="card-body">
                    <div class="color-history" id="colorHistory">
                        <!-- 历史颜色将在这里生成 -->
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2>随机色板</h2>
                </div>
                <div class="card-body">
                    <button class="btn w-100" id="randomPaletteBtn">生成随机色板</button>
                    <div class="color-palette" id="colorPalette">
                        <!-- 随机色板将在这里生成 -->
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2>更多功能</h2>
                </div>
                <div class="card-body">
                    <button class="btn w-100" data-action="drawing.goto-svg-painter">SVG 矢量画板</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/tools/image-drawing.js"></script>
</body>
</html>
