<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 探索者</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/network-github.css">
</head>
<body class="scroll-content">
    <div class="layout-container">
        <!-- Sidebar: Filters -->
        <div class="sidebar">
            <div class="panel-title"><span class="ic" data-ic="search"></span> 筛选与搜索</div>
            
            <div class="tab-group">
                <div class="tab-btn active" data-action="switchMode" data-mode="search" id="tab-search">关键词搜索</div>
                <div class="tab-btn" data-action="switchMode" data-mode="trending" id="tab-trending"><span class="ic" data-ic="flame"></span> 趋势榜单</div>
            </div>

            <div id="search-controls">
                <div class="tool-group">
                    <div class="group-label">关键词</div>
                    <input type="text" id="searchInput" placeholder="React, Vue, AI..." class="w-100">
                </div>
            </div>

            <div class="tool-group">
                <div class="group-label">编程语言</div>
                <select id="langSelect" class="w-100">
                    <option value="">全部语言</option>
                    <option value="javascript">JavaScript</option>
                    <option value="typescript">TypeScript</option>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="go">Go</option>
                    <option value="rust">Rust</option>
                    <option value="c++">C++</option>
                    <option value="c">C</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="vue">Vue</option>
                    <option value="swift">Swift</option>
                    <option value="kotlin">Kotlin</option>
                    <option value="dart">Dart</option>
                </select>
            </div>

            <div class="tool-group">
                <div class="group-label">排序方式</div>
                <select id="sortSelect" class="w-100">
                    <option value="stars">按 Stars 数</option>
                    <option value="forks">按 Forks 数</option>
                    <option value="updated">按更新时间</option>
                </select>
            </div>

            <div class="tool-group">
                <div class="group-label">最低 Stars</div>
                <input type="number" id="minStars" placeholder="例如: 1000" min="0" class="w-100">
            </div>

            <div class="tool-group">
                <div class="group-label">时间范围 (趋势)</div>
                <select id="dateRange" class="w-100" disabled>
                    <option value="daily">今日热门</option>
                    <option value="weekly" selected>本周热门</option>
                    <option value="monthly">本月热门</option>
                </select>
            </div>

            <button class="btn btn-primary" id="actionBtn" style="margin-top: 10px;"><span class="ic" data-ic="search"></span> 开始搜索</button>
            <div style="font-size:0.8rem; text-align:center; margin-top:5px" class="text-dim">
                点击卡片预览 README
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="panel-header">
                <div class="panel-title" id="list-title">搜索结果</div>
                <div class="panel-actions">
                    <span class="stat-badge" id="result-count">0 个项目</span>
                </div>
            </div>

            <div id="repo-list" class="repo-list">
                <!-- Repos injected here -->
                <div style="grid-column:1/-1; text-align:center; padding:50px" class="text-dim">
                    <span class="ic" data-ic="arrow-left"></span> 在左侧输入关键词或选择趋势榜单
                </div>
            </div>

            <!-- Preview Sidebar -->
            <div id="preview-panel" class="preview-panel">
                <div class="preview-header">
                    <div style="font-weight: bold;" id="preview-title">项目预览</div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-secondary" id="toggle-view-btn" data-action="toggleView" style="font-size: 0.8rem; padding: 4px 8px;"><span class="ic" data-ic="file"></span> 源码</button>
                        <button class="btn btn-secondary" data-action="closePreview"><span class="ic" data-ic="close"></span></button>
                    </div>
                </div>
                <div class="preview-content markdown-body" id="preview-content">
                    <div style="text-align: center; margin-top: 50px;">
                        <div class="spinner"></div>
                        <p>正在加载 README...</p>
                    </div>
                </div>
                <div class="preview-header" style="border-top: 1px solid var(--border); border-bottom: none; flex-direction: column; gap: 10px;">
                    <a href="#" target="_blank" id="preview-link" class="btn btn-primary w-100">在 GitHub 上查看</a>
                    <div style="display:flex; gap:10px" class="w-100">
                        <a href="#" target="_blank" id="repo-explorer-link" class="btn btn-secondary flex-1"><span class="ic" data-ic="package"></span> Repo Explorer</a>
                        <a href="#" target="_blank" id="github1s-link" class="btn btn-secondary flex-1"><span class="ic" data-ic="link"></span> Github1s</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/tools/network-github.js"></script>
</body>
</html>
