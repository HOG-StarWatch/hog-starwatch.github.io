<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视觉混合图生成器</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/image-hybrid.css">
</head>
<body>
    <div class="layout-sidebar">
        <div class="controls panel">
            <h2 style="margin:0 0 15px 0; color:var(--primary); font-size:1.5rem;">视觉混合图</h2>

            <div class="control-group">
                <span class="zone-label">1. 近看图 (细节/High Freq)</span>
                <input type="file" id="input-near" accept="image/*" style="display: none;">
                <div class="upload-area upload-zone-preview" data-action="file-click" data-file-target="input-near">
                    <div id="preview1-placeholder" class="upload-placeholder">点击上传近看图</div>
                    <img id="img-near">
                </div>
                <div style="margin-top: 10px;">
                    <label style="font-size:0.8rem" class="text-dim">保留细节量 (High Pass): <span id="val-hp">15</span></label>
                    <input type="range" id="range-hp" min="1" max="50" value="15" class="w-100" data-action="hybrid.updateHp">
                </div>
            </div>

            <div class="control-group">
                <span class="zone-label">2. 远看图 (轮廓/Low Freq)</span>
                <input type="file" id="input-far" accept="image/*" style="display: none;">
                <div class="upload-area upload-zone-preview" data-action="file-click" data-file-target="input-far">
                    <div id="preview2-placeholder" class="upload-placeholder">点击上传远看图</div>
                    <img id="img-far">
                </div>
                <div style="margin-top: 10px;">
                    <label style="font-size:0.8rem" class="text-dim">模糊程度 (Low Pass): <span id="val-lp">10</span></label>
                    <input type="range" id="range-lp" min="1" max="50" value="10" class="w-100" data-action="hybrid.updateLp">
                </div>
            </div>

            <div class="control-group">
                <label><span>混合平衡 (0=远, 1=近)</span> <span id="val-bal">0.5</span></label>
                <input type="range" id="range-bal" min="0" max="1" step="0.1" value="0.5" class="w-100" data-action="hybrid.updateBal">
            </div>

            <div class="control-group">
                <label>图像预处理</label>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                        <input type="checkbox" id="chk-gray" checked> 转黑白
                    </label>
                    <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                        <input type="checkbox" id="chk-edge"> 边缘提取
                    </label>
                </div>
            </div>

            <div style="margin-top:auto; display:flex; flex-direction:column; gap:10px;">
                <button class="btn btn-primary btn-center" data-action="generateHybrid">
                    <i class="fas fa-magic"></i> 生成混合图
                </button>
                <button class="btn btn-success btn-center" data-action="downloadImage" id="dlBtn" disabled>
                    <i class="fas fa-download"></i> 下载图片
                </button>
            </div>
        </div>

        <div class="preview-area">
            <div class="sub-tab-group w-100 btn-center">
                <div class="sub-tab active" data-action="setViewSize" data-mode="1">100% (近看)</div>
                <div class="sub-tab" data-action="setViewSize" data-mode="0.25">25% (模拟远看)</div>
                <div class="sub-tab" data-action="setViewSize" data-mode="0.1">10% (很远)</div>
            </div>

            <div style="display:flex; align-items:center; overflow:hidden" class="flex-1 btn-center w-100">
                <div id="resultPlaceholder" style="text-align:center" class="text-dim">
                    <i class="fas fa-image" style="font-size:3rem; margin-bottom:15px; opacity:0.5;"></i>
                    <div>生成结果将显示在这里</div>
                    <div style="font-size:0.8rem; margin-top:5px;">请在左侧上传两张图片</div>
                </div>
                <canvas id="result-cvs" class="canvas-responsive" style="display:none; box-shadow: var(--shadow); transition: width 0.3s ease;"></canvas>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/ui/worker-rpc.js"></script>
    <script src="../js/tools/image-hybrid.js"></script>
</body>
</html>
