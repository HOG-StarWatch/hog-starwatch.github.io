<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加密解密</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
</head>
<body style="padding: 1rem;">
    <div class="sub-tab-group">
        <div class="sub-tab active" data-action="crypto.switch-subtab" data-tab="std">标准加密 (AES/DES)</div>
        <div class="sub-tab" data-action="crypto.switch-subtab" data-tab="custom">自定义加密 (Custom)</div>
        <div class="sub-tab" data-action="crypto.switch-subtab" data-tab="zerowidth">零宽隐写 (ZeroWidth)</div>
    </div>
    
    <div class="workspace">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">加密配置 & 输入</div>
                <div class="panel-actions">
                     <button class="btn btn-icon" data-action="clear" data-clear-prefix="crypto">清空</button>
                </div>
            </div>
            <div style="padding:1rem; display:flex; flex-direction:column; gap:1rem" class="flex-1">
                
                <!-- Standard Crypto Config -->
                <div id="crypto-std-config" class="crypto-config">
                    <div class="input-row">
                        <label>算法:</label>
                        <select id="std-algo">
                            <option value="AES">AES</option>
                            <option value="DES">DES</option>
                            <option value="TripleDES">TripleDES</option>
                            <option value="Rabbit">Rabbit</option>
                            <option value="RC4">RC4</option>
                        </select>
                    </div>
                    <div class="input-row">
                        <label>密钥:</label>
                        <input type="text" id="std-key" placeholder="在此输入密钥...">
                    </div>
                </div>
                
                <!-- Custom Crypto Config -->
                <div id="crypto-custom-config" class="crypto-config" style="display:none;">
                    <div class="input-row">
                        <label>模式:</label>
                        <select id="custom-mode" data-action="crypto.update-custom-ui">
                            <option value="16char">16字符映射 (字节级 - 压缩优化)</option>
                            <option value="4char">4字符映射 (位流级 - 压缩优化)</option>
                        </select>
                    </div>
                    
                    <!-- 16 Char Settings -->
                    <div id="custom-16-settings">
                        <div class="input-row">
                            <label>预设:</label>
                            <select id="custom-16-preset" data-action="crypto.apply-16-preset">
                                <option value="default">默认</option>
                                <option value="orgasm">木珠</option>
                                <option value="sound">拟声词</option>
                                <option value="symbol">符号</option>
                                <option value="custom">自定义...</option>
                            </select>
                        </div>
                        <div class="input-row">
                            <label>映射表:</label>
                            <input type="text" id="custom-16-chars" maxlength="16" placeholder="输入16个不重复字符" value="0123456789abcdef">
                        </div>
                    </div>

                    <!-- 4 Char Settings -->
                    <div id="custom-4-settings" style="display:none;">
                        <div class="input-row">
                            <label>预设:</label>
                            <select id="custom-4-preset" data-action="crypto.apply-4-preset">
                                <option value="default">默认 (HOG<span class="ic" data-ic="heart"></span>)</option>
                                <option value="orgasm">木珠</option>
                                <option value="letters">字母 (ABCD)</option>
                                <option value="symbol">符号 (!@#$)</option>
                                <option value="custom">自定义...</option>
                            </select>
                        </div>
                        <div class="input-row">
                            <label>密钥:</label>
                            <input type="text" id="custom-4-chars" maxlength="4" placeholder="输入4个不重复字符" value="ABCD">
                        </div>
                    </div>
                    
                    <div class="preview-chars" id="custom-preview">当前字符集: 0123456789abcdef</div>
                </div>

                <!-- Zero Width Config -->
                <div id="crypto-zerowidth-config" class="crypto-config" style="display:none;">
                    <div style="font-size:0.8rem; margin-bottom:10px" class="text-dim">
                        将隐秘信息隐藏在普通文本中，肉眼不可见。
                    </div>
                    <div class="input-row">
                        <label>伪装文本:</label>
                        <input type="text" id="zw-cover" placeholder="在此输入用于伪装的公开文本...">
                    </div>
                </div>
                
                <textarea id="crypto-input" placeholder="输入需要加密/解密的内容..."></textarea>
            </div>
        </div>

        <div class="toolbar">
            <div class="tool-group">
                <div class="group-label">操作</div>
                <button class="btn btn-primary" data-action="crypto.run" data-mode="encrypt">加密 (Encrypt) <span class="ic" data-ic="arrow-right"></span></button>
                <button class="btn btn-primary" data-action="crypto.run" data-mode="decrypt">解密 (Decrypt) <span class="ic" data-ic="arrow-left"></span></button>
            </div>
            <div class="tool-group">
                <div class="group-label">信息</div>
                <div style="font-size:0.8rem; padding:0.5rem; line-height:1.4" class="text-dim">
                    标准加密使用 Crypto-JS 库。<br>
                    自定义加密已启用 LZString 压缩优化。<br>
                    零宽隐写解密时只需输入含隐写内容的文本。
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">结果</div>
                <div class="panel-actions">
                    <button class="btn btn-icon btn-secondary" data-action="copy" data-copy-target="crypto-output">复制</button>
                </div>
            </div>
            <textarea id="crypto-output" readonly placeholder="结果..."></textarea>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/tools/encrypt.js"></script>
</body>
</html>
