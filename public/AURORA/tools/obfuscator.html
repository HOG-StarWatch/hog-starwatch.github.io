<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML混淆</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
</head>
<body>
    <div class="workspace">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">HTML 隐形加密器 (HTML Obfuscator)</div>
                <div class="panel-actions">
                     <button class="btn btn-icon" data-action="clear" data-clear-prefix="obf">清空</button>
                </div>
            </div>
            <div style="padding:1rem; display:flex; flex-direction:column; gap:1rem" class="flex-1">
                <textarea id="obf-input" placeholder="请在此粘贴您的 HTML 源代码..." class="flex-1"></textarea>
                
                <div class="toolbar w-100">
                    <button class="btn btn-primary" data-action="obf.encrypt" data-algo="base64"><span class="ic" data-ic="zap"></span> Base64 加密</button>
                    <button class="btn btn-primary" data-action="obf.encrypt" data-algo="hex"><span class="ic" data-ic="hash"></span> Hex 编码</button>
                    <button class="btn btn-primary" data-action="obf.encrypt" data-algo="unicode"><span class="ic" data-ic="symbols"></span> Unicode 混淆</button>
                    <button class="btn btn-primary" data-action="obf.encrypt" data-algo="ascii"><span class="ic" data-ic="bot"></span> ASCII 数组</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">加密结果 (可直接保存为 .html 运行)</div>
                <div class="panel-actions">
                    <button class="btn btn-icon btn-secondary" data-action="copy" data-copy-target="obf-output">复制</button>
                </div>
            </div>
            <textarea id="obf-output" readonly placeholder="加密后的代码将显示在这里，肉眼无法识别内容..." style="padding: 1rem;"></textarea>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/tools/obfuscator.js"></script>
</body>
</html>
