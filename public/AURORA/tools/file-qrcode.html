<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件转二维码 (File to QR)</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <!-- Dependencies -->
    <script src="../js/app.js"></script>
    <script src="../js/loader.js"></script>
    <link rel="stylesheet" href="../css/tools/file-qrcode.css">
</head>
<body>

    <div class="container">
        <div class="header-section">
            <h2 style="color: var(--primary); margin: 0;">文件 <span class="ic" data-ic="swap"></span> 二维码</h2>
        </div>
        
        <div class="sub-tab-group">
            <div class="sub-tab active" data-action="switchTab" data-mode="embed"><span class="ic" data-ic="lock"></span> 文件嵌入 (Embed)</div>
            <div class="sub-tab" data-action="switchTab" data-mode="extract"><span class="ic" data-ic="inbox"></span> 文件提取 (Extract)</div>
        </div>

        <!-- EMBED SECTION -->
        <div id="section-embed" class="panel">
            <div class="split-layout">
                <!-- Left Column: Inputs -->
                <div class="left-col">
                    <div class="control-group">
                        <label>1. 选择文件 (可多选)</label>
                        <input type="file" id="filesInput" multiple style="display: none;">
                        <div class="upload-box" id="drop-zone" data-action="file-click" data-file-target="filesInput">
                            <i class="fas fa-file-import text-dim"></i>
                            <div style="font-size: 1rem;">点击选择或拖拽文件</div>
                            <div style="font-size:0.8rem; margin-top:5px" class="text-dim">支持多文件批量处理</div>
                        </div>
                        <!-- File List Widget -->
                        <div id="file-list-widget" class="file-list-widget"></div>
                    </div>

                    <div class="control-group">
                        <label>2. 嵌入策略</label>
                        <select id="embedMode">
                            <option value="anticomp" selected>超抗压缩 (B站/视频推荐, 2bit/px)</option>
                            <option value="pair41">最小体积 (微信/QQ推荐, 2B/px)</option>
                            <option value="byte7">最隐蔽 (体积较大, 1B/px)</option>
                        </select>
                        <p class="info-note">"超抗压缩"模式可以抵抗视频二压，但体积利用率较低。</p>
                    </div>

                    <div class="control-group">
                        <label>3. 扫码跳转链接</label>
                        <select id="qrLinkSelect" data-action="toggleCustomLink">
                            <option value="https://hog-starwatch.github.io/File2QRcode" selected>Github 解密页 (默认)</option>
                            <option value="custom">自定义链接</option>
                        </select>
                        <input type="text" id="customLinkInput" placeholder="输入链接 (http://...)" style="display:none; margin-top:10px;">
                    </div>

                    <div class="control-group">
                        <label style="display: flex; align-items: center; cursor: pointer;">
                            <input type="checkbox" id="convertToJpg" style="margin-right: 8px;"> 
                            将图片转为 JPG (减小体积)
                        </label>
                        <div id="jpgQualityContainer" style="display:none; margin-top:5px; margin-left: 20px;">
                            <label>质量: <select id="jpgQuality" style="width:auto; display:inline-block;">
                                <option value="0.7">0.7 (小)</option>
                                <option value="0.85" selected>0.85 (推荐)</option>
                                <option value="1.0">1.0 (原画)</option>
                            </select></label>
                        </div>
                    </div>

                    <div class="control-group">
                        <label style="display: flex; align-items: center; cursor: pointer;">
                            <input type="checkbox" id="extraInfoToggle" data-action="toggleExtraInfo" style="margin-right: 8px;"> 
                            附加可视描述 (图片/文字)
                        </label>
                        <div id="extraInfoContainer" style="display: none; margin-top: 10px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 8px;">
                            <label>描述图片:</label>
                            <input type="file" id="previewImageInput" accept="image/*" style="margin-bottom:10px" class="w-100">
                            <label>描述文字:</label>
                            <input type="text" id="descriptionInput" placeholder="显示在二维码下方的文字">
                        </div>
                    </div>
                </div>

                <!-- Right Column: Action & Preview -->
                <div class="right-col">
                    <button class="btn btn-primary" id="generateButton"><span class="ic" data-ic="zap"></span> 生成二维码图像</button>
                    
                    <div id="encodeProgressWrap" class="progress-wrap">
                        <div id="encodeProgressText" class="progress-text">准备中...</div>
                        <div class="progress-bar"><div id="encodeProgressBar" class="progress-fill"></div></div>
                    </div>

                    <div id="qrPreviewContainer" style="text-align:center; min-height:200px; display:flex; align-items:center" class="btn-center flex-1">
                        <div class="text-dim">
                            <i class="fas fa-qrcode" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                            <div>预览区域</div>
                        </div>
                    </div>
                    <a id="downloadLink" class="btn btn-primary" style="background: var(--secondary); display: none; margin-top: 15px;"><span class="ic" data-ic="save"></span> 下载图片</a>
                </div>
            </div>
        </div>

        <!-- EXTRACT SECTION -->
        <div id="section-extract" class="panel" style="display: none;">
            <div class="split-layout">
                <div class="left-col">
                    <div class="control-group">
                        <label>选择包含数据的二维码图片</label>
                        <input type="file" id="imageInput" accept="image/*" style="display: none;">
                        <div class="upload-box" data-action="file-click" data-file-target="imageInput">
                            <i class="fas fa-image text-dim"></i>
                            <span id="imageInputName">点击上传图片...</span>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="decodeButton"><span class="ic" data-ic="unlock"></span> 提取文件</button>
                </div>
                
                <div class="right-col">
                    <div id="decodeProgressWrap" class="progress-wrap">
                        <div id="decodeProgressText" class="progress-text">准备中...</div>
                        <div class="progress-bar"><div id="decodeProgressBar" class="progress-fill"></div></div>
                    </div>
                    <div id="fileList" style="margin-top:20px; text-align:center" class="text-dim">
                        (提取结果将显示在这里)
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="../js/tools/file-qrcode.js"></script>
</body>
</html>
