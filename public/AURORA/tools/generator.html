<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成器</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
</head>
<body>
    <div class="workspace">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">强密码生成器</div>
            </div>
            <div style="padding:1.5rem; display:flex; flex-direction:column; gap:1rem; min-height:0; overflow-y:auto" class="flex-1">
                <div class="input-row">
                    <label>长度: <span id="pwd-len-val" style="color:var(--primary); font-weight:bold;">16</span></label>
                    <input type="range" id="pwd-len" min="4" max="64" value="16" data-action="gen.show-length">
                </div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="pwd-upper" checked> A-Z</label>
                    <label><input type="checkbox" id="pwd-lower" checked> a-z</label>
                    <label><input type="checkbox" id="pwd-num" checked> 0-9</label>
                    <label><input type="checkbox" id="pwd-sym" checked> !@#</label>
                </div>
                <button class="btn btn-primary btn-center" data-action="gen.password">生成密码</button>
                <div class="result-box">
                    <input type="text" id="pwd-result" readonly placeholder="生成的密码...">
                    <button class="btn btn-icon" data-action="copy" data-copy-target="pwd-result">复制</button>
                </div>
                <textarea id="pwd-batch" readonly placeholder="批量生成结果 (10个)..." style="min-height: 150px;   margin-top:10px;"></textarea>
                <button class="btn btn-secondary btn-center" data-action="gen.password-batch">批量生成 (10个)</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">UUID 生成器</div>
            </div>
            <div style="padding:1.5rem; display:flex; flex-direction:column; gap:1rem; min-height:0; overflow-y:auto" class="flex-1">
                <div class="input-row">
                    <label>版本:</label>
                    <select id="uuid-version" data-action="gen.uuid-ui">
                        <option value="v4">v4 (随机)</option>
                        <option value="v1">v1 (时间戳)</option>
                        <option value="v3">v3 (MD5 命名空间)</option>
                        <option value="v5">v5 (SHA-1 命名空间)</option>
                    </select>
                </div>
                
                <div id="uuid-ns-group" style="display:none">
                    <div class="input-row">
                        <label>空间:</label>
                        <select id="uuid-ns-type" data-action="gen.ns-ui">
                            <option value="url">URL</option>
                            <option value="dns">DNS</option>
                            <option value="oid">OID</option>
                            <option value="x500">X500</option>
                            <option value="custom">自定义UUID</option>
                        </select>
                    </div>
                     <div class="input-row" id="uuid-ns-custom-row" style="display:none">
                        <label>NS UUID:</label>
                        <input type="text" id="uuid-ns-custom" placeholder="输入合法的 UUID...">
                    </div>
                    <div class="input-row">
                        <label>名字:</label>
                        <input type="text" id="uuid-name" placeholder="输入用于哈希的名字...">
                    </div>
                </div>

                <button class="btn btn-primary btn-center" data-action="gen.uuid">生成 UUID</button>
                <div class="result-box">
                    <input type="text" id="uuid-result" readonly placeholder="生成的 UUID...">
                    <button class="btn btn-icon" data-action="copy" data-copy-target="uuid-result">复制</button>
                </div>
                <textarea id="uuid-batch" readonly placeholder="批量生成结果 (10个)..." style="min-height:150px; margin-top:10px" class="flex-1"></textarea>
                <button class="btn btn-secondary btn-center" data-action="gen.uuid-batch">批量生成 (10个)</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/tools/generator.js"></script>
</body>
</html>
