<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缁堟瀬鍥剧墖鍔犲瘑宸ュ叿绠?/title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/image-crypto.css">
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">
        <span><span class="ic" data-ic="shield"></span></span> 鍥剧墖鍔犲瘑宸ュ叿绠?
    </div>
    <div style="display:flex; gap:10px; overflow-x:auto;">
        <button class="nav-btn active" data-action="showTool" data-mode="gilbert">
            <span><span class="ic" data-ic="shuffle"></span></span> 鍚夊皵浼壒娣锋穯
        </button>
        <button class="nav-btn" data-action="showTool" data-mode="visual">
            <span><span class="ic" data-ic="lock"></span></span> 瑙嗚鍔犲瘑
        </button>
        <button class="nav-btn" data-action="showTool" data-mode="diff">
            <span><span class="ic" data-ic="moon"></span></span> 宸€煎垎绂?
        </button>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">

    <!-- ========================= -->
    <!-- Gilbert Tool -->
    <!-- ========================= -->
    <div id="tool-gilbert" class="tool-section active">
        <h1>鍚夊皵浼壒鍍忕礌娣锋穯 (Gilbert Shuffle)</h1>
        <p class="subtitle">鍩轰簬 <strong>Chaos Theory (娣锋矊鐞嗚)</strong> 涓?<strong>Space-Filling Curves (绌洪棿濉厖鏇茬嚎)</strong> 鐨勬棤鎹熷儚绱犵疆涔辩畻娉曘€?/p>
        
        <div class="card">
            <div class="control-group">
                <label>鍔犲瘑瀵嗛挜 (Seed Key)</label>
                <input type="number" id="gb-key" value="123456" placeholder="璇疯緭鍏ユ暟瀛楀瘑閽?(Enter numeric seed)...">
            </div>
            
            <div class="grid-2">
                <button class="btn btn-primary" id="gb-btn-enc"><span class="ic" data-ic="lock"></span> 鍔犲瘑鍥剧墖 (Encrypt)</button>
                <button class="btn btn-outline" id="gb-btn-dec"><span class="ic" data-ic="unlock"></span> 瑙ｅ瘑鍥剧墖 (Decrypt)</button>
            </div>
        </div>

        <div class="card">
            <input type="file" id="gb-input" accept="image/*" style="display: none;">
            <div id="gb-dropzone" class="file-upload">
                <p>鐐瑰嚮涓婁紶鍥剧墖 鎴?鎷栨嫿鑷虫 (Upload Image)</p>
            </div>
            
            <div class="preview-container">
                <img id="gb-img-preview" class="preview-img" style="display: none;">
                <div id="gb-loading" style="display:none; color: var(--primary);">Processing...</div>
                <a id="gb-download" class="btn btn-success" style="display: none;"><span class="ic" data-ic="save"></span> 淇濆瓨鍥剧墖 (Save Image)</a>
            </div>
        </div>
    </div>

    <!-- ========================= -->
    <!-- Visual Encryption Tool -->
    <!-- ========================= -->
    <div id="tool-visual" class="tool-section">
        <h1>瑙嗚鍔犲瘑 & 妯＄硦闅愬啓 (Visual Crypto & Stego)</h1>
        <p class="subtitle">鍩轰簬 <strong>Visual Secret Sharing (瑙嗚绉樺瘑鍏变韩)</strong> 鏂规銆?/p>

        <div class="tabs">
            <div class="tab active" data-action="switchTab" data-tool="visual" data-mode="enc">鍔犲瘑 (Encryption / Split)</div>
            <div class="tab" data-action="switchTab" data-tool="visual" data-mode="dec">瑙ｅ瘑 (Decryption / Merge)</div>
        </div>

        <!-- Encrypt Tab -->
        <div id="visual-enc" class="visual-tab-content">
            <div id="vs-desc" class="desc-box"></div>

            <div class="card grid-2">
                <div>
                    <div class="control-group">
                        <label>鏍稿績绠楁硶 (Core Algorithm)</label>
                        <select id="vs-algo">
                            <option value="arithmetic">鏍囧噯瑙嗚鍔犲瘑 (Arithmetic - 鏃犳崯)</option>
                            <option value="xor">寮傛垨瑙嗚鍔犲瘑 (XOR - 鏃犳崯)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>瑙嗚灞傛牱寮?(Mask Style)</label>
                        <select id="vs-style">
                            <option value="mosaic">椹禌鍏?(Mosaic / Pixelation)</option>
                            <option value="blur">楂樻柉妯＄硦 (Gaussian Blur)</option>
                            <option value="dot">鍗婅皟鐐归樀 (Halftone Dot)</option>
                            <option value="stripe">绾挎€ф潯绾?(Linear Stripe)</option>
                            <option value="cross">缃戞牸绾圭悊 (Crosshatching)</option>
                            <option value="edge">杈圭紭妫€娴?(Sobel Edge Detection)</option>
                            <option value="invert">鍙嶈壊 (Negative Inversion)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <div class="control-group">
                        <label>鏍峰紡寮哄害 (Kernel Size / Radius): <span id="vs-val-1">10</span></label>
                        <input type="range" id="vs-param-1" min="1" max="50" value="10">
                    </div>
                    <div class="control-group">
                        <label>鍔犲瘑/鍣偣寮哄害 (Noise Intensity): <span id="vs-val-2">30</span></label>
                        <input type="range" id="vs-param-2" min="0" max="100" value="30">
                    </div>
                </div>
            </div>

            <div class="card">
                <input type="file" id="vs-input-a" accept="image/*" style="display: none;">
                <div id="vs-dropzone-a" class="file-upload" style="margin-bottom: 20px;">
                    <p><span class="ic" data-ic="camera"></span> 涓婁紶婧愬浘 (Source Image)</p>
                </div>

                <div id="vs-progress-enc" style="display: none; margin-bottom: 20px;">
                    <label>鍔犲瘑杩涘害 (Encrypting...)</label>
                    <progress id="vs-bar-enc" value="0" max="100"></progress>
                </div>

                <div class="grid-2">
                    <div class="preview-container">
                        <h3>瑙嗚鎺╃爜 (Visual Mask / Surface)</h3>
                        <img id="vs-img-b" class="preview-img" style="display: none;">
                        <a id="vs-dl-b" class="btn btn-success" style="display: none;">涓嬭浇鎺╃爜 (Download Mask)</a>
                    </div>
                    <div class="preview-container">
                        <h3>鍔犲瘑绉橀挜 (Hidden Key / Latent)</h3>
                        <img id="vs-img-c" class="preview-img" style="display: none;">
                        <a id="vs-dl-c" class="btn btn-success" style="display: none;">涓嬭浇绉橀挜 (Download Key)</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Decrypt Tab -->
        <div id="visual-dec" class="visual-tab-content" style="display: none;">
            <div class="card">
                <div class="control-group">
                    <label>瑙ｅ瘑绠楁硶 (Decryption Algorithm)</label>
                    <select id="vs-algo-dec">
                        <option value="arithmetic">鏍囧噯瑙嗚鍔犲瘑 (Arithmetic)</option>
                        <option value="xor">寮傛垨瑙嗚鍔犲瘑 (XOR)</option>
                    </select>
                </div>
                
                <div class="grid-2">
                    <div id="vs-dropzone-b" class="file-upload">
                        <p>1. 涓婁紶瑙嗚鎺╃爜 (Upload Mask)</p>
                        <input type="file" id="vs-input-b" accept="image/*" style="display: none;">
                    </div>
                    <div id="vs-dropzone-c" class="file-upload">
                        <p>2. 涓婁紶鍔犲瘑绉橀挜 (Upload Key)</p>
                        <input type="file" id="vs-input-c" accept="image/*" style="display: none;">
                    </div>
                </div>
                
                <div style="text-align: center; margin: 20px 0;">
                    <button id="vs-btn-dec" class="btn btn-primary btn-center" disabled><span class="ic" data-ic="refresh"></span> 寮€濮嬪悎骞惰В瀵?(Merge & Decrypt)</button>
                    <p id="vs-err" style="color: #ef4444; margin-top: 10px; display: none;"><span class="ic" data-ic="close"></span> 鍥剧墖灏哄涓嶄竴鑷?(Image Dimensions Mismatch)</p>
                </div>

                <div id="vs-progress-dec" style="display: none; margin-bottom: 20px;">
                    <label>瑙ｅ瘑杩涘害 (Decrypting...)</label>
                    <progress id="vs-bar-dec" value="0" max="100"></progress>
                </div>

                <div class="preview-container">
                    <h3>杩樺師缁撴灉 A (Restored Result)</h3>
                    <img id="vs-img-result" class="preview-img" style="display: none;">
                    <a id="vs-dl-result" class="btn btn-success" style="display: none;">涓嬭浇杩樺師鍥?(Download Result)</a>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================= -->
    <!-- Difference Separation Tool -->
    <!-- ========================= -->
    <div id="tool-diff" class="tool-section">
        <h1>宸€煎垎绂诲浘鍍忓姞瀵?(Difference Separation)</h1>
        <p class="subtitle">灏嗗浘鐗囨媶鍒嗕负涓や釜灞傦紝閫氳繃<strong>宸€兼贩鍚堟ā寮?/strong>杩樺師銆傛敮鎸?strong>灞€閮ㄦ秱鎶瑰姞瀵?/strong>涓?strong>鍙傝€冨浘璇卞</strong>鍔熻兘銆?/p>

        <div class="tabs">
            <div class="tab active" data-action="switchTab" data-tool="diff" data-mode="enc">鍔犲瘑 (Encrypt / Split)</div>
            <div class="tab" data-action="switchTab" data-tool="diff" data-mode="dec">瑙ｅ瘑 (Decrypt / Restore)</div>
        </div>

        <!-- Diff Encrypt -->
        <div id="diff-enc" class="diff-tab-content">
            <div class="card">
                <div class="grid-2">
                    <!-- Target Image Area -->
                    <div>
                        <h3>1. 鐩爣鍥?(Target Image)</h3>
                        <p class="helper-text">杩欐槸浣犺闅愯棌鐨勭湡瀹炲浘鐗囥€傛敮鎸佸湪涓婃柟娑傛姽浠ユ寚瀹氶珮寮哄害鍔犲瘑鍖哄煙銆?/p>
                        <div class="canvas-stack" id="diff-stack-container">
                            <canvas id="diff-preview-enc"></canvas>
                            <canvas id="diff-overlay" style="position:absolute; left:0; top:0; pointer-events:auto; cursor: crosshair; display:none;"></canvas>
                        </div>
                        <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap" class="btn-center">
                            <input type="file" id="diff-file-enc" accept="image/*" style="display:none;">
                            <button class="btn btn-outline" data-action="file-click" data-file-target="diff-file-enc"><span class="ic" data-ic="folder"></span> 閫夋嫨鍥剧墖</button>
                            <button class="btn btn-outline" id="diff-undo-btn"><span class="ic" data-ic="corner-up-left"></span> 鎾ゅ洖娑傛姽</button>
                            <button class="btn btn-outline" id="diff-clear-btn"><span class="ic" data-ic="trash"></span> 娓呯┖娑傛姽</button>
                        </div>
                        <div style="margin-top:10px; display:flex; gap:15px; align-items:center" class="btn-center">
                            <label style="margin:0;"><span class="ic" data-ic="brush"></span> 澶у皬: <input id="diff-brush-size" type="range" min="2" max="100" value="30" style="width: 100px;"></label>
                            <label style="margin:0;"><span class="ic" data-ic="palette"></span> 棰滆壊: <input id="diff-brush-color" type="color" value="#000000"></label>
                        </div>
                    </div>

                    <!-- Reference Image Area -->
                    <div>
                        <h3>2. 鍙傝€冨浘 (Reference Image) - 鍙€?/h3>
                        <p class="helper-text">鍔犲瘑鍚庣殑鍥剧墖灏嗕吉瑁呮垚杩欏紶鍥剧殑鏍峰瓙锛堝彲閫夛級銆?/p>
                        <div class="preview-container" style="background: rgba(0,0,0,0.3);">
                            <canvas id="diff-preview-ref"></canvas>
                        </div>
                        <div style="margin-top:10px; display:flex; gap:10px; flex-direction:column" class="btn-center">
                            <input type="file" id="diff-file-ref" accept="image/*" style="display:none;">
                            <button class="btn btn-outline" data-action="file-click" data-file-target="diff-file-ref"><span class="ic" data-ic="folder"></span> 閫夋嫨鍙傝€冨浘 (Optional)</button>
                            <label style="display:flex; align-items:center; gap:8px; color:var(--text-main)" class="btn-center">
                                <input type="checkbox" id="diff-use-guided"> 鍚敤鍙傝€冨浘璇卞 (Enable Guided Mode)
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="control-group">
                    <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                        <div class="flex-1">
                            <label>杈撳嚭鏍煎紡 (Format)</label>
                            <select id="diff-format-enc">
                                <option value="png" selected>PNG (鎺ㄨ崘)</option>
                                <option value="jpeg">JPG</option>
                            </select>
                        </div>
                        <div style="padding-top:24px" class="flex-1">
                            <label style="display:flex; align-items:center; gap:8px; color: var(--text-main); cursor: pointer;">
                                <input type="checkbox" id="diff-merge-side"> 宸﹀彸鎷兼帴涓哄崟鍥?(Merge Side-by-Side)
                            </label>
                        </div>
                    </div>
                </div>

                <button class="btn btn-primary w-100 btn-center" id="diff-start-enc"><span class="ic" data-ic="rocket"></span> 寮€濮嬪姞瀵?(Start Encryption)</button>
            </div>

            <!-- Result Preview Area -->
            <div class="card" id="diff-result-card" style="display:none;">
                <h3>鍔犲瘑缁撴灉棰勮 (Encryption Result)</h3>
                
                <!-- Split Mode -->
                <div id="diff-result-split" class="grid-2" style="display:none;">
                    <div class="preview-container">
                        <h4>灞?A (Layer A)</h4>
                        <img id="diff-img-res-a" class="preview-img">
                        <a id="diff-dl-a" class="btn btn-success"><span class="ic" data-ic="download"></span> 涓嬭浇灞?A</a>
                    </div>
                    <div class="preview-container">
                        <h4>灞?B (Layer B)</h4>
                        <img id="diff-img-res-b" class="preview-img">
                        <a id="diff-dl-b" class="btn btn-success"><span class="ic" data-ic="download"></span> 涓嬭浇灞?B</a>
                    </div>
                </div>

                <!-- Merged Mode -->
                <div id="diff-result-merged" class="preview-container" style="display:none;">
                    <h4>鍚堝苟缁撴灉 (Merged Result)</h4>
                    <img id="diff-img-res-merged" class="preview-img">
                    <a id="diff-dl-merged" class="btn btn-success"><span class="ic" data-ic="download"></span> 涓嬭浇鍚堝苟鍥?/a>
                </div>
            </div>
        </div>

        <!-- Diff Decrypt -->
        <div id="diff-dec" class="diff-tab-content" style="display: none;">
            <div class="card">
                <div class="grid-2">
                    <div class="preview-container">
                        <h3>绗竴寮犲浘鐗?/ 宸﹀崐閮ㄥ垎</h3>
                        <canvas id="diff-preview-dec-a"></canvas>
                        <input type="file" id="diff-file-dec-a" accept="image/*" style="display:none;">
                        <button class="btn btn-outline" data-action="file-click" data-file-target="diff-file-dec-a"><span class="ic" data-ic="folder"></span> 閫夋嫨鍥剧墖 A</button>
                    </div>
                    <div class="preview-container">
                        <h3>绗簩寮犲浘鐗?/ 鍙冲崐閮ㄥ垎</h3>
                        <canvas id="diff-preview-dec-b"></canvas>
                        <input type="file" id="diff-file-dec-b" accept="image/*" style="display:none;">
                        <button class="btn btn-outline" data-action="file-click" data-file-target="diff-file-dec-b"><span class="ic" data-ic="folder"></span> 閫夋嫨鍥剧墖 B</button>
                    </div>
                </div>
                <p class="helper-text" style="text-align: center; margin: 10px 0;">鎻愮ず锛氬鏋滃彧涓婁紶涓€寮犲浘鐗囷紝宸ュ叿灏嗗皾璇曞皢鍏跺乏鍙虫媶鍒嗕负涓ら儴鍒嗚繘琛岃В瀵嗐€?/p>
            </div>

            <div class="card">
                <div class="control-group">
                    <div style="display: flex; gap: 20px;">
                        <div class="flex-1">
                            <label>杈撳嚭鏍煎紡 (Format)</label>
                            <select id="diff-format-dec">
                                <option value="png" selected>PNG</option>
                                <option value="jpeg">JPG</option>
                            </select>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary w-100 btn-center" id="diff-start-dec"><span class="ic" data-ic="unlock"></span> 寮€濮嬭В瀵?(Start Decryption)</button>
            </div>
        </div>
    </div>

</div>

<script src="../js/utils/canvas-utils.js"></script>
<script src="../js/app.js"></script>
<script src="../js/ui/worker-rpc.js"></script>
<script src="../js/tools/image-crypto.js"></script>
</body>
</html>
