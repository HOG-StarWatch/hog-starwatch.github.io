<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故障艺术生成器</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/loader.js"></script>
    <link rel="stylesheet" href="../css/tools/image-glitch.css">
</head>
<body>
    <div class="layout-sidebar">
        <!-- Controls -->
        <div class="controls panel">
            <h2 style="margin:0 0 15px 0; color:var(--primary); font-size:1.5rem;">故障艺术</h2>
            
            <div class="control-group">
                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-cloud-upload-alt text-dim"></i>
                    <div style="font-size: 0.8rem;">点击 or 拖放图片</div>
                    <input type="file" id="input-file" accept="image/*" hidden>
                </div>
            </div>

            <div class="sub-tab-group">
                <div class="sub-tab active" data-action="setMode" data-mode="layer">图层故障</div>
                <div class="sub-tab" data-action="setMode" data-mode="data">数据破坏</div>
                <div class="sub-tab" data-action="setMode" data-mode="gif">GIF 动图</div>
            </div>

            <!-- MODE: Layer Glitch (Canvas) -->
            <div id="controls-layer">
                <div class="control-group">
                    <div class="control-title">
                        <span>RGB 通道偏移</span>
                        <input type="checkbox" id="chk-rgb" checked>
                    </div>
                    <div class="slider-row">
                        <label>水平偏移 X</label>
                        <input type="range" id="rgb-amount" min="-50" max="50" value="10">
                        <span id="val-rgb">10</span>
                    </div>
                    <div class="slider-row">
                        <label>垂直偏移 Y</label>
                        <input type="range" id="rgb-angle" min="-50" max="50" value="0">
                        <span id="val-rgb-y">0</span>
                    </div>
                </div>

                <div class="control-group">
                    <div class="control-title">
                        <span>切片与错位</span>
                        <input type="checkbox" id="chk-slice" checked>
                    </div>
                    <div class="slider-row">
                        <label>切片数量</label>
                        <input type="range" id="slice-amount" min="0" max="20" value="5">
                        <span id="val-slice">5</span>
                    </div>
                    <div class="slider-row">
                        <label>切片高度</label>
                        <input type="range" id="slice-height" min="1" max="50" value="5">
                        <span id="val-slice-h">5</span>
                    </div>
                    <div class="slider-row">
                        <label>最大偏移</label>
                        <input type="range" id="slice-offset" min="0" max="100" value="20">
                        <span id="val-slice-o">20</span>
                    </div>
                </div>

                <div class="control-group">
                    <div class="control-title">
                        <span>扫描线纹理</span>
                        <input type="checkbox" id="chk-scan">
                    </div>
                    <div class="slider-row">
                        <label>线条密度</label>
                        <input type="range" id="scan-density" min="2" max="10" value="3">
                        <span id="val-scan">3</span>
                    </div>
                    <div class="slider-row">
                        <label>透明度</label>
                        <input type="range" id="scan-opacity" min="0" max="100" value="50">
                        <span id="val-scan-o">50</span>
                    </div>
                </div>
                
                <button class="btn btn-primary w-100" id="btn-render"><span class="ic" data-ic="zap"></span> 重新渲染</button>
                <button class="btn btn-secondary w-100" id="btn-random"><span class="ic" data-ic="dice"></span> 随机参数</button>
            </div>

            <!-- MODE: Data Glitch (Binary) -->
            <div id="controls-data" style="display: none;">
                <p style="font-size:0.85rem; margin-bottom:15px; padding:10px; background:rgba(244, 63, 94, 0.1); border-radius:4px; border:1px solid rgba(244, 63, 94, 0.2)" class="text-dim">
                    <span class="ic" data-ic="alert"></span> 警告：这是对 JPEG 二进制数据的破坏性编辑，结果不可预测且可能导致图片无法显示。
                </p>
                
                <div class="control-group">
                    <div class="control-title">二进制数据腐蚀</div>
                    <div class="slider-row">
                        <label>随机种子</label>
                        <input type="range" id="data-seed" min="0" max="100" value="50">
                        <span id="val-data-seed">50</span>
                    </div>
                    <div class="slider-row">
                        <label>破坏数量</label>
                        <input type="range" id="data-amount" min="1" max="100" value="10">
                        <span id="val-data-amt">10</span>
                    </div>
                    <div class="slider-row">
                        <label>迭代次数</label>
                        <input type="range" id="data-iter" min="1" max="20" value="5">
                        <span id="val-data-iter">5</span>
                    </div>
                </div>

                <button class="btn btn-danger w-100" id="btn-mosh"><span class="ic" data-ic="skull"></span> 破坏数据 (MOSH)</button>
            </div>
            
            <!-- MODE: GIF Glitch -->
            <div id="controls-gif" style="display: none;">
                 <p style="font-size:0.85rem; margin-bottom:15px" class="text-dim">
                    生成包含多个随机破坏效果帧的 GIF 动画。
                </p>
                <div class="control-group">
                    <div class="control-title">动画设置</div>
                    <div class="slider-row">
                        <label>帧数 (Frames)</label>
                        <input type="range" id="gif-frames" min="2" max="50" value="10">
                        <span id="val-gif-frames">10</span>
                    </div>
                    <div class="slider-row">
                        <label>帧间隔 (ms)</label>
                        <input type="range" id="gif-delay" min="20" max="500" value="100" step="10">
                        <span id="val-gif-delay">100</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="control-title">数据破坏参数</div>
                    <div class="slider-row">
                        <label>破坏数量</label>
                        <input type="range" id="gif-amount" min="1" max="100" value="10">
                        <span id="val-gif-amt">10</span>
                    </div>
                    <div class="slider-row">
                        <label>迭代次数</label>
                        <input type="range" id="gif-iter" min="1" max="20" value="5">
                        <span id="val-gif-iter">5</span>
                    </div>
                    <div class="slider-row">
                        <label>随机种子变化</label>
                        <input type="checkbox" id="gif-seed-random" checked>
                    </div>
                </div>

                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <button class="btn btn-primary flex-1" id="btn-gen-frames"><span class="ic" data-ic="camera"></span> 生成帧序列</button>
                    <button class="btn btn-success flex-1" id="btn-render-gif" disabled><span class="ic" data-ic="film"></span> 导出 GIF</button>
                </div>

                <!-- Frame Editor -->
                <div id="frame-editor" style="display:none; margin-bottom:15px;">
                    <div class="control-title">
                        <span>帧编辑 (<span id="frame-count-display">0</span>)</span>
                        <button class="btn btn-sm btn-secondary" data-action="clearFrames" style="font-size:0.7rem; padding:2px 6px;">清空</button>
                    </div>
                    <div id="frame-list" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap:8px; max-height:300px; overflow-y:auto; padding:5px; background:rgba(0,0,0,0.2); border-radius:4px; overscroll-behavior: contain;">
                        <!-- Frames injected here -->
                    </div>
                </div>
                
                <!-- Progress Bar -->
                <div id="gif-progress-container" style="display:none; margin-top:10px;">
                    <div style="height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden;">
                        <div id="gif-progress-bar" style="width:0%; height:100%; background:var(--primary); transition:width 0.2s;"></div>
                    </div>
                    <div id="gif-progress-text" style="font-size:0.8rem; text-align:center; margin-top:4px" class="text-dim">0%</div>
                </div>

                <div id="gif-status" style="font-size:0.8rem; text-align:center; margin-top:5px" class="text-dim"></div>
            </div>

            <a id="btn-download" class="btn btn-success btn-center"><span class="ic" data-ic="save"></span> 保存图片</a>
        </div>

        <!-- Preview -->
        <div class="preview-area">
            <div id="placeholder-text" class="text-dim">请先上传图片</div>
            <canvas id="cvs-main" class="canvas-responsive" style="display:none; border-radius: var(--radius-md); box-shadow: var(--shadow);"></canvas>
            <img id="img-mosh" class="canvas-responsive" style="display: none; border-radius: var(--radius-md); box-shadow: var(--shadow);">
            <img id="img-gif" class="canvas-responsive" style="display: none; border-radius: var(--radius-md); box-shadow: var(--shadow);">
        </div>

    </div>

    <script src="../js/ui/worker-rpc.js"></script>
    <script src="../js/tools/image-glitch.js"></script>
</body>
</html>
