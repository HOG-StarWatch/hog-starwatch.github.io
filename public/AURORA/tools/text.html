<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本处理</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
</head>
<body class="scroll-content">
    <div id="workspace-basic" class="workspace">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">输入</div>
                <div class="panel-actions">
                    <button class="btn btn-icon" data-action="text.clear">清空</button>
                </div>
            </div>
            <textarea id="text-input" placeholder="在此输入文本..." style="min-height: 220px;"></textarea>
            <div class="stats-row">
                <span>字符: <b id="stat-total">0</b></span>
                <span>非空: <b id="stat-nospace">0</b></span>
                <span>单词: <b id="stat-words">0</b></span>
                <span>汉字: <b id="stat-cn">0</b></span>
                <span>行数: <b id="stat-lines">0</b></span>
            </div>
        </div>

        <div class="toolbar">
            <div class="tool-group">
                <div class="group-label">基础</div>
                <button class="btn" data-action="text.process" data-mode="upper">全大写 <span>AA</span></button>
                <button class="btn" data-action="text.process" data-mode="lower">全小写 <span>aa</span></button>
                <button class="btn" data-action="text.process" data-mode="title">首字母大写 <span>Aa</span></button>
            </div>
            <div class="tool-group">
                <div class="group-label">格式</div>
                <button class="btn" data-action="text.process" data-mode="trim">去首尾空 <span>|__|</span></button>
                <button class="btn" data-action="text.process" data-mode="nospace">去所有空格 <span>><</span></button>
                <button class="btn" data-action="text.process" data-mode="oneline">合并为一行 <span>—</span></button>
            </div>
            <div class="tool-group">
                <div class="group-label">高级</div>
                <button class="btn" data-action="text.process" data-mode="snake">Snake Case</button>
                <button class="btn" data-action="text.process" data-mode="camel">Camel Case</button>
                <button class="btn" data-action="text.process" data-mode="dedupe">去重行</button>
                <button class="btn" data-action="text.process" data-mode="sort">排序</button>
            </div>
            <div class="tool-group">
                <div class="group-label">中文</div>
                <button class="btn" data-action="text.process" data-mode="sc2tc">转繁体</button>
                <button class="btn" data-action="text.process" data-mode="tc2sc">转简体</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">结果 <span class="stat-badge" id="text-out-stat">0 字符</span></div>
                <div class="panel-actions">
                    <button class="btn btn-icon btn-secondary" data-action="copy" data-copy-target="text-output">复制</button>
                </div>
            </div>
            <textarea id="text-output" readonly placeholder="处理结果..." style="min-height: 220px;"></textarea>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/tools/text.js"></script>
</body>
</html>
