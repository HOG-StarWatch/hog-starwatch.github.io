<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片像素化</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
</head>
<body class="scroll-content">
    <div class="layout-sidebar">
        <!-- Controls -->
        <div class="controls panel">
            <h2 style="margin:0 0 15px 0; color:var(--primary); font-size:1.5rem;">像素化工具</h2>
            
            <div class="control-group">
                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-cloud-upload-alt text-dim"></i>
                    <div style="font-size: 0.8rem;">点击或拖放图片</div>
                    <input type="file" id="imageUpload" accept="image/*" hidden>
                </div>
            </div>
            
            <div class="control-group">
                <label style="display:flex; justify-content:space-between; margin-bottom:8px;">
                    <span><i class="fas fa-th-large" style="margin-right:5px; color:var(--primary);"></i> 像素块大小</span>
                    <span id="pixelValue" class="text-secondary">8px</span>
                </label>
                <input type="range" id="pixelSize" min="2" max="50" value="8" class="w-100">
            </div>
            
            <div style="margin-top:auto; display:flex; flex-direction:column; gap:10px;">
                <button id="processBtn" class="btn btn-primary btn-center" disabled>
                    <i class="fas fa-magic"></i> 处理图片
                </button>
                <button id="downloadBtn" class="btn btn-success btn-center" disabled>
                    <i class="fas fa-download"></i> 下载图片
                </button>
                <button id="resetBtn" class="btn btn-secondary btn-center">
                    <i class="fas fa-redo"></i> 重置
                </button>
            </div>
        </div>
        
        <!-- Preview -->
        <div class="preview-area">
            <div id="previewPlaceholder" style="text-align:center" class="text-dim">
                <i class="fas fa-image" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                <div>请上传图片并点击处理</div>
            </div>
            <canvas id="originalCanvas" class="canvas-responsive" style="display:none; border-radius: var(--radius-md); box-shadow: var(--shadow);"></canvas>
            <canvas id="pixelatedCanvas" class="canvas-responsive" style="display:none; border-radius: var(--radius-md); box-shadow: var(--shadow);"></canvas>
        </div>
    </div>

    <script src="../js/loader.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/tools/image-pixel.js"></script>
</body>
</html>
