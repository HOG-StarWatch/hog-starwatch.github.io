<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正则实验室</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/regex.css">
</head>
<body>
    <div class="regex-page">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">正则实验室</div>
                <div class="panel-actions">
                    <button class="btn btn-icon" data-action="regex.clear-all">清空</button>
                </div>
            </div>
            <div class="regex-controls">
                <div class="regex-bar regex-row">
                    <div class="regex-input-group">
                        <span>/</span>
                        <input type="text" id="regex-input" class="regex-input" placeholder="expression" value="\b\w+\b">
                        <span>/</span>
                    </div>
                    <div class="flags-group">
                        <label><input type="checkbox" id="flag-g" checked> global (g)</label>
                        <label><input type="checkbox" id="flag-m" checked> multiline (m)</label>
                        <label><input type="checkbox" id="flag-i"> insensitive (i)</label>
                    </div>
                </div>
                <div class="quick-ref">
                    <button class="ref-chip" type="button" data-action="regex.insert" data-value="\d+">数字 \\d</button>
                    <button class="ref-chip" type="button" data-action="regex.insert" data-value="\w+">单词 \\w</button>
                    <button class="ref-chip" type="button" data-action="regex.insert" data-value="[a-z]">小写 [a-z]</button>
                    <button class="ref-chip" type="button" data-action="regex.insert" data-value="^...$">整行 ^$</button>
                    <button class="ref-chip" type="button" data-action="regex.insert" data-value="(...)">分组 ()</button>
                    <button class="ref-chip" type="button" data-action="regex.insert" data-value="[\\u4e00-\\u9fa5]">中文</button>
                    <button class="ref-chip" type="button" data-action="regex.insert" data-value="((?=.*\\d)(?=.*[a-z]).{8,})">强密码</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">测试与结果</div>
                <div class="panel-actions match-toolbar">
                    <div class="toolbar-split">
                        <input id="match-filter" class="mini-input" placeholder="筛选匹配">
                        <label class="mini-toggle"><input type="checkbox" id="only-groups">仅含分组</label>
                        <button class="btn btn-icon" data-action="regex.copy-matches">复制</button>
                        <span id="match-count" class="text-secondary">0 matches</span>
                    </div>
                    <div class="toolbar-split">
                        <label class="mini-toggle"><input type="checkbox" id="auto-height-toggle" checked>自动高度</label>
                        <label class="mini-toggle"><input type="checkbox" id="highlight-toggle" checked>高亮</label>
                    </div>
                </div>
            </div>
            <div class="editor-grid">
                <div class="editor-box">
                    <div class="box-header">
                        测试文本
                        <button class="btn btn-sm btn-icon" data-action="regex.clear-input">×</button>
                    </div>
                    <div style="position:relative; overflow:hidden" class="flex-1">
                        <div id="regex-highlight" class="text-layer highlight-layer"></div>
                        <textarea id="regex-test-input" class="text-layer" spellcheck="false">
English test: Hello World
中文测试：你好世界</textarea>
                    </div>
                </div>

                <div class="editor-box">
                    <div class="box-header">
                        匹配结果
                    </div>
                    <div id="match-list" class="text-layer match-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/tools/regex.js"></script>
</body>
</html>
