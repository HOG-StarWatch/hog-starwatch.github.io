<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL 解析工具</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <script src="../js/app.js"></script>
    <link rel="stylesheet" href="../css/tools/url.css">
</head>
<body>
    <div class="workspace url-container">
        
        <div class="panel" style="height: auto;">
            <div class="panel-header">
                <div class="panel-title">URL 解析器</div>
            </div>
            <div style="padding: 2rem;">
                <div class="input-group" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
                    <input type="text" id="url-input" placeholder="输入 URL (例如 https://example.com/path?query=1)" style="min-width:300px" class="flex-1">
                    <div style="display:flex; align-items:center; gap:5px; white-space:nowrap;">
                        <input type="checkbox" id="auto-protocol" checked>
                        <label for="auto-protocol" style="font-size:0.9rem" class="text-dim">自动补全协议</label>
                    </div>
                    <button class="btn btn-primary" data-action="parseUrl">解析</button>
                    <button class="btn" data-action="url.reparse">清空</button>
                </div>

                <div id="result-area" style="display:none;">
                    <div class="result-grid" id="result-grid">
                        <!-- Items injected here -->
                    </div>

                    <div id="query-section" style="display:none; margin-top:30px;">
                        <h4 style="margin-bottom:10px; color:var(--primary);">查询参数 (Query Params)</h4>
                        <table class="query-table">
                            <thead>
                                <tr>
                                    <th width="30%">参数名</th>
                                    <th>参数值</th>
                                </tr>
                            </thead>
                            <tbody id="query-body"></tbody>
                        </table>
                    </div>
                </div>

                <div class="status-msg" id="status">输入 URL 并点击解析</div>
            </div>
        </div>

    </div>

    <div id="toast" class="toast">操作成功</div>

    <script src="../js/tools/url.js"></script>
</body>
</html>
