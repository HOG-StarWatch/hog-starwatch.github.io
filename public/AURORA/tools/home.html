<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎使用极光工具箱</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
</head>
<body>
    <div class="home-container">
        <div class="hero-title">AURORA<span class="ic" data-ic="heart"></span>极光</div>
        <div class="hero-desc">
            极光工具箱<br>
        </div>

        <div class="action-buttons">
            <button class="btn-action btn-outline" id="expand-nav-btn">
                <span><span class="ic" data-ic="folder-open"></span> 展开导航</span>
            </button>
            <button class="btn-action btn-purple" id="coming-soon-btn">
                <span><span class="ic" data-ic="heart"></span></span>
            </button>
        </div>
        
        <!-- Text Tools -->
        
        <div class="features-grid">
            <div class="feature-card" data-target="tools/home.html">
                <span class="feature-icon"></span>
                <div class="feature-title"></div>
                <div class="feature-text"></div>
            </div>

        </div>
    </div>
    <script src="../js/app.js"></script>
    <script src="../js/tools/home.js"></script>
</body>
</html>
