<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单位换算</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <script src="../js/app.js"></script>
    <link rel="stylesheet" href="../css/tools/unit.css">
</head>
<body>
    <div class="workspace unit-container">
        <div class="type-selector" id="type-selector">
            <!-- Injected by JS -->
        </div>

        <div class="converter-box">
            <div class="input-group">
                <select id="unit-from" class="unit-select" data-action="convert" data-mode="from"></select>
                <input type="number" id="val-from" class="value-input" placeholder="0" data-action="convert" data-mode="from">
            </div>

            <div class="equal-sign">=</div>

            <div class="input-group">
                <select id="unit-to" class="unit-select" data-action="convert" data-mode="from"></select>
                <input type="number" id="val-to" class="value-input" placeholder="0" data-action="convert" data-mode="to">
            </div>
        </div>

        <div style="margin-top:20px; text-align:center; font-size:0.9rem" class="text-dim">
            支持实时双向换算
        </div>
    </div>

    <script src="../js/tools/unit.js"></script>
</body>
</html>
