<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图标制作</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/image-appicon.css">
</head>
<body class="scroll-content">
    <div class="workspace layout-sidebar">
        <!-- Left Panel - Controls -->
        <div class="panel controls">
            <div class="panel-header">
                <div class="panel-title">图标设置</div>
                <div class="panel-actions">
                    <span class="stat-badge">Lite</span>
                    <button class="btn btn-icon btn-secondary" data-action="resetDefaults" title="重置"><span class="ic" data-ic="rotate-ccw"></span></button>
                </div>
            </div>

            <div style="overflow-y:auto; padding-right:5px" class="flex-1">
                
                <!-- Basic Settings -->
                <div class="control-group">
                    <label>基础设置</label>
                    <div class="input-row">
                        <label>尺寸 (px)</label>
                        <input type="number" id="sizeInput" value="1024" min="64" max="2048">
                    </div>
                    <div class="input-row">
                        <label>背景颜色</label>
                        <div class="color-input-wrapper">
                            <input type="color" id="bgColor" value="#3b82f6">
                            <span id="bgColorVal">#3b82f6</span>
                        </div>
                    </div>
                    <div class="input-row">
                        <label>圆角 (%) <span id="borderRadiusVal" style="font-size:0.8rem; margin-left:5px;">22%</span></label>
                        <input type="range" id="borderRadius" min="0" max="50" value="22">
                    </div>
                </div>

                <!-- Content Settings -->
                <div class="control-group">
                    <label>内容设置</label>
                    <div class="sub-tab-group">
                        <button class="sub-tab active" data-action="switchTab" data-mode="text" id="tab-text">文字</button>
                        <button class="sub-tab" data-action="switchTab" data-mode="image" id="tab-image">图片</button>
                    </div>

                    <!-- Text Mode -->
                    <div id="textContent">
                        <div style="margin-bottom: 10px;">
                            <input type="text" id="textInput" value="A" class="full-width" placeholder="输入文字">
                        </div>
                        <div style="margin-bottom: 10px;">
                            <select id="fontFamily" class="full-width">
                                <option value="Arial">Arial</option>
                                <option value="Times New Roman">Times New Roman</option>
                                <option value="Courier New">Courier New</option>
                                <option value="Verdana">Verdana</option>
                                <option value="Georgia">Georgia</option>
                                <option value="Impact">Impact</option>
                                <option value="Comic Sans MS">Comic Sans MS</option>
                                <option value="'Microsoft YaHei', sans-serif">微软雅黑</option>
                                <option value="'SimHei', sans-serif">黑体</option>
                            </select>
                        </div>
                        <div class="input-row">
                            <label>大小</label>
                            <input type="range" id="textSize" min="10" max="800" value="600">
                        </div>
                        <div class="input-row">
                            <label>颜色</label>
                            <div class="color-input-wrapper">
                                <input type="color" id="textColor" value="#ffffff">
                                <span id="textColorVal">#ffffff</span>
                            </div>
                        </div>
                    </div>

                    <!-- Image Mode -->
                    <div id="imageContent" style="display: none;">
                        <div class="upload-area" id="uploadArea" style="padding: 1rem; margin-bottom: 10px;">
                            <i style="font-size: 1.5rem;"><span class="ic" data-ic="folder"></span></i>
                            <div style="font-size:0.8rem" class="text-dim">点击或拖拽上传图片</div>
                            <input type="file" id="imageInput" accept="image/*" style="position:absolute; height:100%; opacity:0; top:0; left:0; cursor:pointer" class="w-100">
                        </div>
                        <div class="input-row">
                            <label>缩放 (%)</label>
                            <input type="range" id="imageScale" min="10" max="200" value="80">
                        </div>
                    </div>
                    
                    <div class="input-row">
                        <label>垂直偏移</label>
                        <input type="range" id="offsetY" min="-200" max="200" value="0">
                    </div>
                </div>

                <!-- Shadow & Border -->
                <div class="control-group">
                    <label>阴影与边框</label>
                    <div class="input-row">
                        <label>阴影颜色</label>
                        <div class="color-input-wrapper">
                            <input type="color" id="shadowColor" value="#000000">
                            <span id="shadowColorVal">#000000</span>
                        </div>
                    </div>
                    <div class="input-row">
                        <label>模糊度</label>
                        <input type="range" id="shadowBlur" min="0" max="50" value="0">
                    </div>
                    <div class="input-row">
                        <label>X 偏移</label>
                        <input type="range" id="shadowOffsetX" min="-50" max="50" value="0">
                    </div>
                    <div class="input-row">
                        <label>Y 偏移</label>
                        <input type="range" id="shadowOffsetY" min="-50" max="50" value="0">
                    </div>
                    
                    <div class="dropdown-divider"></div>
                    
                    <div class="input-row" style="margin-top: 10px;">
                        <label>边框宽度</label>
                        <input type="range" id="borderWidth" min="0" max="100" value="0">
                    </div>
                    <div class="input-row">
                        <label>边框颜色</label>
                        <div class="color-input-wrapper">
                            <input type="color" id="borderColor" value="#000000">
                            <span id="borderColorVal">#000000</span>
                        </div>
                    </div>
                </div>

            </div>

            <div style="padding-top: 15px; border-top: 1px solid var(--border);">
                <button class="btn btn-primary w-100 btn-center" id="downloadBtn">
                    <span><span class="ic" data-ic="download"></span></span> 下载图标 (PNG)
                </button>
            </div>
        </div>

        <!-- Right Panel - Preview -->
        <div class="panel preview-area">
            <div class="canvas-container">
                <canvas id="canvas" width="1024" height="1024"></canvas>
            </div>
            <div style="margin-top:15px; font-size:0.8rem; text-align:center" class="text-dim">
                实际输出: <span id="outputSizeDisplay" class="text-secondary">1024x1024</span>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/tools/image-appicon.js"></script>
</body>
</html>
