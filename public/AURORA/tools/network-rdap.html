<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>RDAP / WHOIS 查询</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/network-rdap.css">
</head>
<body class="scroll-content">

<div class="container">
    <h2>RDAP / WHOIS 查询 <span class="ver">v2.0</span></h2>
    
    <div class="section">
        <div class="row">
            <select id="nodeSelect">
                <option value="https://rdap.org/domain/">rdap.org (默认递归查询)</option>
                <option value="https://rdap.cnnic.cn/domain/">rdap.cnnic.cn (中国 .CN)</option>
                <option value="https://rdap.verisign.com/com/v1/domain/">rdap.verisign.com (.COM)</option>
                <option value="https://rdap.verisign.com/net/v1/domain/">rdap.verisign.com (.NET)</option>
                <option value="https://rdap.publicinterestregistry.org/rdap/domain/">pir.org (.ORG)</option>
                <option value="https://rdap.nic.ad.jp/domain/">nic.ad.jp (.JP)</option>
            </select>
            <button class="btn-sec" data-action="openNodeRoot">访问节点根目录</button>
        </div>
        <div class="row">
            <input type="text" id="domainInput" placeholder="输入域名 (例如: 123.com 或 apple.net)">
            <button data-action="doSearch">在线获取并解析</button>
        </div>
        <div id="status" class="status"></div>
    </div>

    <div class="section">
        <p style="font-size:13px; margin-bottom:8px; display:flex; justify-content:space-between" class="text-dim">
            <span>JSON 数据交互区 (获取到的数据会自动填入此处)：</span>
            <span id="dataInfo" style="color:var(--success)"></span>
        </p>
        <textarea id="jsonInput" placeholder='等待获取数据或在此粘贴 JSON 代码...'></textarea>
        
        <div style="display: flex; gap: 10px;">
            <button class="btn-parse" data-action="parseManualJson">解析文本框中的 JSON</button>
            <button id="exportBtn" class="btn-export btn-parse hidden" data-action="exportJsonFile">导出为 .json 文件</button>
        </div>
    </div>

    <div id="toolBar" class="hidden" style="margin-bottom:15px; border-top: 1px solid var(--border); padding-top: 15px;">
        <button class="btn-sec" id="apiUrlBtn" data-action="rdap.open-current-url"><span class="ic" data-ic="globe"></span> 打开原始 API 页面</button>
        <button class="btn-sec" data-action="clearAll">清空全部</button>
    </div>

    <div id="parseResult"></div>
</div>

<script src="../js/app.js"></script>
<script src="../js/tools/network-rdap.js"></script>

</body>
</html>
