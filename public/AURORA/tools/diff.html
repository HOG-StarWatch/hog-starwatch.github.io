<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能对比工具</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
</head>
<body>
    <div class="workspace layout-vertical">
        
        <div class="sub-tab-group">
            <div class="sub-tab active" data-action="diff.set-mode" data-mode="text" id="tab-text">文本对比 (Text)</div>
            <div class="sub-tab" data-action="diff.set-mode" data-mode="json" id="tab-json">JSON 结构化对比</div>
        </div>

        <div class="layout-split">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">原文 (Old)</div>
                    <div class="panel-actions">
                        <button class="btn btn-icon" data-action="file-click" data-file-target="file-old" title="加载文件"><span class="ic" data-ic="folder-open"></span></button>
                        <input type="file" id="file-old" style="display:none" data-action="diff.load-file" data-target="diff-old">
                        <button class="btn btn-icon" data-action="diff.format-json" data-target="diff-old" title="格式化 JSON" id="btn-fmt-old" style="display:none;">{}</button>
                        <button class="btn btn-icon" data-action="diff.clear-area" data-target="diff-old">清空</button>
                    </div>
                </div>
                <textarea id="diff-old" placeholder="输入原始内容..."></textarea>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">新文 (New)</div>
                    <div class="panel-actions">
                        <button class="btn btn-icon" data-action="file-click" data-file-target="file-new" title="加载文件"><span class="ic" data-ic="folder-open"></span></button>
                        <input type="file" id="file-new" style="display:none" data-action="diff.load-file" data-target="diff-new">
                        <button class="btn btn-icon" data-action="diff.format-json" data-target="diff-new" title="格式化 JSON" id="btn-fmt-new" style="display:none;">{}</button>
                        <button class="btn btn-icon" data-action="diff.clear-area" data-target="diff-new">清空</button>
                    </div>
                </div>
                <textarea id="diff-new" placeholder="输入修改后的内容..."></textarea>
            </div>
        </div>
        
        <div style="display: flex; gap: 1rem; align-items: center; padding: 0.5rem 0;">
            <button class="btn btn-primary" data-action="diff.compare">开始对比 (Compare)</button>
            <div style="font-size:0.8rem" class="text-dim" id="legend-text">
                <span class="legend-badge ins">新增</span>
                <span class="legend-badge del">删除</span>
            </div>
        </div>

        <div class="panel flex-1">
             <div class="panel-header">
                <div class="panel-title">对比结果</div>
            </div>
            <div id="diff-output" style="padding:1rem; overflow:auto; font-family:monospace; white-space:pre-wrap; color:var(--text-main)" class="flex-1"></div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/loader.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/tools/diff.js"></script>
</body>
</html>
