<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幻影坦克生成器</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/image-phantom.css">
</head>
<body class="scroll-content">
    <div class="layout-sidebar">
        <div class="controls">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="fas fa-ghost"></i> 幻影坦克
                </div>
            </div>

            <div class="mode-switch-container">
                <div class="mode-switch-wrapper">
                    <button type="button" id="btn-prism" class="mode-switch-btn is-active" data-action="image-phantom.set-mode" data-mode="prism">
                        光棱坦克
                    </button>
                    <button type="button" id="btn-shadow" class="mode-switch-btn" data-action="image-phantom.set-mode" data-mode="shadow">
                        幻影坦克
                    </button>
                </div>
                <p id="mode-description" class="mode-description"></p>
            </div>

            <div class="control-section">
                <h3><i class="fas fa-upload"></i> 上传图片</h3>
                <p id="upload-hint" style="font-size: 0.8rem; color: var(--text-50); margin-bottom: 1rem;"></p>

                <div class="control-group">
                    <span class="zone-label" id="source-label"></span>
                    <div class="upload-area" data-action="file-click" data-file-target="imgInput1">
                        <div id="preview1-placeholder" class="upload-placeholder">
                            <span id="source-cta"></span>
                            <small id="source-hint"></small>
                        </div>
                        <img id="preview1">
                    </div>
                    <input type="file" id="imgInput1" accept="image/*" hidden data-action="image-phantom.handle-image" data-idx="1">
                    <p id="preview1-info" class="upload-info hidden"></p>
                </div>

                <div class="control-group" style="margin-top: 1rem;">
                    <span class="zone-label" id="hidden-label"></span>
                    <div class="upload-area" data-action="file-click" data-file-target="imgInput2">
                        <div id="preview2-placeholder" class="upload-placeholder">
                            <span id="hidden-cta"></span>
                            <small id="hidden-hint"></small>
                        </div>
                        <img id="preview2">
                    </div>
                    <input type="file" id="imgInput2" accept="image/*" hidden data-action="image-phantom.handle-image" data-idx="2">
                    <p id="preview2-info" class="upload-info hidden"></p>
                </div>
            </div>

            <div id="prism-controls" class="control-section">
                <h3><i class="fas fa-sliders-h"></i> 参数与操作</h3>
                <div class="param-grid">
                    <div class="param-box">
                        <h4>原图参数</h4>
                        <div class="param-row">
                            <label><span>原图亮度提高 (%)</span><span id="source-brightness-val">100</span></label>
                            <input type="range" id="source-brightness" min="0" max="200" step="1" value="100">
                        </div>
                        <div class="param-row">
                            <label><span>原图对比度 (%)</span><span id="source-contrast-val">20</span></label>
                            <input type="range" id="source-contrast" min="10" max="300" step="1" value="20">
                        </div>
                    </div>
                    <div class="param-box">
                        <h4>隐藏图参数</h4>
                        <div class="param-row">
                            <label><span>隐藏图亮度降低 (%)</span><span id="hidden-brightness-val">90</span></label>
                            <input type="range" id="hidden-brightness" min="0" max="100" step="1" value="90">
                        </div>
                        <div class="param-row">
                            <label><span>隐藏图对比度 (%)</span><span id="hidden-contrast-val">100</span></label>
                            <input type="range" id="hidden-contrast" min="10" max="300" step="1" value="100">
                        </div>
                    </div>
                </div>
            </div>

            <div id="shadow-controls" class="control-section hidden">
                <h3><i class="fas fa-sliders-h"></i> 参数与操作</h3>
                <div class="param-grid">
                    <div class="param-box">
                        <div class="checkbox-row" style="margin-bottom: 1rem;">
                            <label>全彩输出</label>
                            <input type="checkbox" id="shadow-is-colored" checked>
                        </div>
                        <div class="param-row">
                            <label><span>黑底图缩放</span><span id="shadow-inner-scale-val">0.30</span></label>
                            <input type="range" id="shadow-inner-scale" min="0" max="1" step="0.02" value="0.30">
                        </div>
                        <div class="param-row">
                            <label><span>黑底图去色</span><span id="shadow-inner-desat-val">0.00</span></label>
                            <input type="range" id="shadow-inner-desat" min="0" max="1" step="0.02" value="0.00">
                        </div>
                        <div class="param-row">
                            <label><span>黑底图混合权重</span><span id="shadow-inner-weight-val">0.70</span></label>
                            <input type="range" id="shadow-inner-weight" min="0" max="1" step="0.02" value="0.70">
                        </div>
                    </div>
                    <div class="param-box">
                        <div class="param-row">
                            <label><span>白底图缩放</span><span id="shadow-cover-scale-val">0.20</span></label>
                            <input type="range" id="shadow-cover-scale" min="0" max="1" step="0.02" value="0.20">
                        </div>
                        <div class="param-row">
                            <label><span>白底图去色</span><span id="shadow-cover-desat-val">0.00</span></label>
                            <input type="range" id="shadow-cover-desat" min="0" max="1" step="0.02" value="0.00">
                        </div>
                        <div class="param-row">
                            <label><span>最大输出尺寸</span><span id="shadow-max-size-val">1200</span></label>
                            <input type="range" id="shadow-max-size" min="0" max="4096" step="1" value="1200">
                        </div>
                        <p class="hint-text">0 表示不限制</p>
                    </div>
                </div>
            </div>

            <div id="size-mismatch" class="size-mismatch-warning hidden"></div>

            <div class="action-buttons">
                <button class="btn-primary" id="generate-btn" data-action="generateImage" disabled>
                    <i class="fas fa-magic"></i> 生成图像
                </button>
                <button class="btn-success" id="download-btn" data-action="downloadImage" disabled>
                    <i class="fas fa-download"></i> 下载 PNG
                </button>
            </div>
        </div>

        <div class="preview-area">
            <div class="canvas-container bg-checkerboard" id="canvasContainer">
                <div id="resultPlaceholder" class="result-placeholder">
                    <i class="fas fa-image"></i>
                    <div>生成结果将显示在这里</div>
                    <div style="font-size:0.8rem; margin-top:5px;">请上传两张图片后生成</div>
                </div>
                <canvas id="resultCanvas" style="display:none;"></canvas>
                <div id="shadow-result-grid" class="shadow-result-grid hidden">
                    <div class="shadow-result-item white-bg">
                        <p>白底预览</p>
                        <img id="result-img-white" src="" alt="白底预览">
                    </div>
                    <div class="shadow-result-item black-bg">
                        <p>黑底预览</p>
                        <img id="result-img-black" src="" alt="黑底预览">
                    </div>
                </div>
            </div>

            <div id="prism-result" class="preview-controls">
                <label><input type="radio" name="bg" data-action="image-phantom.change-bg" data-bg="white"> 白底预览</label>
                <label><input type="radio" name="bg" data-action="image-phantom.change-bg" data-bg="black"> 黑底预览</label>
                <label><input type="radio" name="bg" data-action="image-phantom.change-bg" data-bg="check" checked> 透明预览</label>
            </div>

            <div id="shadow-result" class="preview-controls hidden">
                <span style="color: var(--text-50);">幻影坦克模式提供白底/黑底双预览</span>
            </div>

            <div id="status-message" class="status-message"></div>
            <div id="error-message" class="status-message error-message hidden"></div>
            <p id="output-size" style="margin-top: 0.5rem; font-size: 0.75rem; color: var(--text-50);" class="hidden"></p>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/ui/worker-rpc.js"></script>
    <script src="../js/tools/image-phantom.js"></script>
</body>
</html>
