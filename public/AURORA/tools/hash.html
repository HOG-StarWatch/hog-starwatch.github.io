<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哈希计算</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <script src="../js/loader.js"></script>
    <link rel="stylesheet" href="../css/tools/hash.css">
</head>
<body>
    <div class="workspace">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">哈希计算 (Hash Calculation) 
                    <span id="engine-badge" class="stat-badge" style="margin-left:10px; background:#f59e0b; color:#fff; cursor:pointer;" data-action="hash.toggle-engine" title="点击切换引擎 (Click to Toggle Engine)">Engine: JS (Fallback)</span>
                </div>
                <div class="panel-actions">
                     <button class="btn btn-icon" data-action="clear" data-clear-prefix="hash">清空</button>
                </div>
            </div>
            <div style="padding: 1rem; display: flex; flex-direction: column; gap: 1rem; height: 100%; overflow-y: auto;">
                
                <div class="hash-grid">
                    <div class="hash-panel">
                        <div class="upload-area" data-action="file-click" data-file-target="file-input">
                            <i class="fas fa-file-upload text-dim"></i>
                            <p style="margin:0" class="text-dim">点击或拖拽文件到此处</p>
                            <input type="file" id="file-input" multiple style="display:none;">
                        </div>

                        <div id="file-info" class="file-info">
                            <span id="file-info-text"></span>
                            <button class="btn btn-secondary btn-sm" data-action="hash.clear-file">移除文件</button>
                        </div>
                        <div id="file-list" class="file-list"></div>
                    </div>
                    <div class="hash-panel">
                        <textarea id="hash-input" placeholder="在此输入文本进行哈希计算..." style="min-height:140px; padding:10px" class="flex-1"></textarea>

                        <div class="checkbox-group" style="flex-shrink:0;">
                            <label><input type="checkbox" id="hash-batch-text"> 按行批量处理文本</label>
                        </div>
                    </div>
                </div>
                
                <div class="checkbox-group" style="overflow-y:auto; flex-shrink:0; max-height:100px;">
                     <label><input type="checkbox" class="hash-algo" value="MD5" checked> MD5</label>
                     <label><input type="checkbox" class="hash-algo" value="SHA1" checked> SHA1</label>
                     <label><input type="checkbox" class="hash-algo" value="SHA256" checked> SHA256</label>
                     <label><input type="checkbox" class="hash-algo" value="SHA512"> SHA512</label>
                     <label><input type="checkbox" class="hash-algo" value="RIPEMD160"> RIPEMD160</label>
                     <label><input type="checkbox" class="hash-algo" value="HmacMD5"> HmacMD5</label>
                     <label><input type="checkbox" class="hash-algo" value="HmacSHA256"> HmacSHA256</label>
                </div>
                
                <div id="hash-key-row" class="input-row" style="display:none;">
                     <label>HMAC 密钥:</label>
                     <input type="text" id="hash-hmac-key" placeholder="HMAC 算法需要密钥">
                </div>

                <button class="btn btn-primary" data-action="hash.calc">计算哈希</button>
                
                <div id="hash-results" class="results-list">
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/ui/worker-rpc.js"></script>
    <script src="../js/ui/result-card.js"></script>
    <script src="../js/tools/hash.js"></script>
</body>
</html>
