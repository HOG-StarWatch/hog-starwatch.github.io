<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF 制作工具</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <script src="../js/loader.js"></script>
    <link rel="stylesheet" href="../css/tools/image-gif.css">
</head>
<body class="scroll-content">
    <div class="layout-sidebar">
        <!-- Controls -->
        <div class="controls panel">
            <h2 style="margin:0 0 15px 0; color:var(--primary); font-size:1.5rem;">GIF 制作</h2>
            
            <div class="control-group">
                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-images text-dim"></i>
                    <div style="font-size: 0.8rem;">点击或拖放多张图片</div>
                    <input type="file" id="input-files" accept="image/*" multiple hidden>
                </div>
            </div>

            <div id="file-list-container" class="control-group" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                    <label style="font-size:0.9rem; font-weight:600;">已选图片 <span id="file-count" style="font-weight:normal" class="text-dim">(0)</span></label>
                    <button class="btn btn-sm" data-action="clearFiles" style="padding: 2px 8px; font-size: 0.75rem;">清空</button>
                </div>
                <div class="file-list" id="file-list">
                    <!-- File items will be added here -->
                </div>
            </div>

            <div class="control-group">
                <div class="filter-title">参数设置</div>
                <div class="slider-row">
                    <label>宽度 (px)</label>
                    <input type="number" id="gif-width" placeholder="自动" style="width: 60px; padding: 4px;   background: var(--bg);">
                </div>
                <div class="slider-row">
                    <label>高度 (px)</label>
                    <input type="number" id="gif-height" placeholder="自动" style="width: 60px; padding: 4px;   background: var(--bg);">
                </div>
                <div class="slider-row">
                    <label>帧间隔 (ms)</label>
                    <input type="range" id="gif-delay" min="20" max="1000" value="200" step="10">
                    <span id="val-gif-delay">200</span>
                </div>
                <div class="slider-row">
                    <label>质量 (1-10)</label>
                    <input type="range" id="gif-quality" min="1" max="30" value="10" step="1" title="越低越好">
                    <span id="val-gif-quality">10</span>
                </div>
                <div class="slider-row">
                    <label>循环播放</label>
                    <input type="checkbox" id="gif-loop" checked>
                </div>
                <div class="slider-row">
                    <label>透明背景</label>
                    <input type="checkbox" id="gif-transparent">
                </div>
            </div>

            <button class="btn btn-primary w-100" id="btn-generate"><span class="ic" data-ic="film"></span> 生成 GIF</button>
            
            <!-- Progress Bar -->
            <div id="progress-container" style="display:none; margin-top:10px;">
                <div style="height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden;">
                    <div id="progress-bar" style="width:0%; height:100%; background:var(--primary); transition:width 0.2s;"></div>
                </div>
                <div id="progress-text" style="font-size:0.8rem; text-align:center; margin-top:4px" class="text-dim">0%</div>
            </div>
            
            <a id="btn-download" class="btn btn-success btn-center"><span class="ic" data-ic="save"></span> 保存 GIF</a>
        </div>

        <!-- Preview -->
        <div class="preview-area">
            <div id="placeholder-text" class="text-dim">请上传图片并点击生成</div>
            <img id="img-preview" class="canvas-responsive" style="display: none; border-radius: var(--radius-md); box-shadow: var(--shadow);">
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/tools/image-gif.js"></script>
</body>
</html>
