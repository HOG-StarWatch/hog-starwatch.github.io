<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic 免费游戏</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="preconnect" href="https://store-site-backend-static.ak.epicgames.com">
    <link rel="stylesheet" href="../css/tools/network-epic.css">
</head>
<body class="scroll-content">
    <div class="workspace epic-workspace">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title"><span class="ic" data-ic="zap"></span> EPIC 限免领取 <span class="stat-badge" id="chip-pc">0</span></div>
                <div class="panel-actions">
                    <span class="stat-badge" id="data-status">加载中…</span>
                    <button class="btn btn-primary btn-icon" id="btn-refresh" type="button"><span class="ic" data-ic="rotate-cw"></span> 刷新</button>
                </div>
            </div>
            <div class="epic-scroll">
                <div id="grid-pc" class="epic-grid"></div>
                <p class="epic-hint" id="epic-hint">
                    左键点击卡片或拖动框选可勾选多款限免，再点「批量领取」直达 Epic 结算页（请提前登录 EPIC 账号）。
                </p>
            </div>
        </div>
    </div>

    <!-- 底部操作坞 -->
    <div class="epic-dock" aria-label="批量领取操作">
        <div class="selected-tray" id="selected-tray" aria-hidden="true"></div>
        <div class="epic-dock-buttons">
            <button class="btn btn-secondary" id="btn-view-orders" type="button">查看订单</button>
            <button class="btn btn-secondary" id="btn-select-all" type="button">全选</button>
            <button class="btn btn-primary" id="btn-claim" type="button" disabled>批量领取</button>
        </div>
    </div>

    <!-- 批量领取确认弹窗 -->
    <div id="claim-modal" class="epic-modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="epic-modal">
            <h3>确认批量领取</h3>
            <p class="epic-modal-desc">您即将跳转至 EPIC 平台批量领取以下游戏（共 <strong id="modal-count">0</strong> 款）：</p>
            <div class="modal-tray" id="modal-tray"></div>
            <div class="epic-warn">
                <div class="epic-warn-title">批量领取注意事项</div>
                <ul>
                    <li>请勿勾选已拥有的游戏（否则 Epic 下单会报错）</li>
                    <li>请记得提前<a href="https://www.epicgames.com/account/transactions?productName=egs&historyType=PAYMENT_HISTORY" target="_blank" rel="noopener noreferrer">登录 EPIC 账号</a>（否则跳转后报错白屏）</li>
                    <li>如果领取跳转后白屏，可使用底部「查看订单」检查是否已入库</li>
                </ul>
            </div>
            <div class="epic-modal-actions">
                <button class="btn btn-secondary" id="btn-cancel" type="button">取消</button>
                <button class="btn btn-primary" id="btn-confirm" type="button">确认跳转</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">操作完成</div>

    <script src="../js/app.js"></script>
    <script src="../js/tools/network-epic.js"></script>
</body>
</html>
