<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 工具箱</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <script src="../js/loader.js"></script>
    
    <link rel="stylesheet" href="../css/tools/image-svg-optimizer.css">
</head>
<body>

    <div id="loading-mask" style="position:fixed; top:0; left:0; height:100%; background:var(--bg-deep); z-index:99999; display:flex; align-items:center; flex-direction:column; gap:10px" class="w-100 btn-center">
        <div style="width:30px; height:30px; border:3px solid rgba(255,255,255,0.1); border-top:3px solid var(--primary); border-radius:50%; animation:spin 1s linear infinite;"></div>
        <div style="font-size:0.9rem" class="text-dim">加载资源中...</div>
    </div>
    

    <div id="drag-overlay">
        <div class="overlay-content">
            <h2>释放文件以打开</h2>
            <button class="secondary" data-action="file-click" data-file-target="file-input">选择文件...</button>
        </div>
    </div>

    <header>
        <div class="brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                <path d="M2 2l7.586 7.586"></path>
                <circle cx="11" cy="11" r="2"></circle>
            </svg>
            SVG 工具箱
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" data-action="image-svg-optimizer.switch-tab" data-tab="editor">编辑器</button>
            <button class="tab-btn" data-action="image-svg-optimizer.switch-tab" data-tab="batch">批量处理</button>
        </div>

        <div class="control-group" style="padding-right: 10px;">
             <button class="secondary" data-action="window-open" data-href="https://thenounproject.com/"><span class="ic" data-ic="globe"></span> Noun Project</button>
             <button data-action="downloadSVG"><span class="ic" data-ic="save"></span> 导出</button>
        </div>
    </header>

    <div id="notification-bar" class="status-bar" style="display:none;">Ready</div>

    <!-- Editor Tab -->
    <div id="editor-view" class="workspace tab-content active">
        
        <!-- Left: Code -->
        <div class="editor-pane">
            <div class="pane-header">
                <div class="control-group">
                    <span>代码源</span>
                    <button class="secondary" data-action="file-click" data-file-target="file-input" title="打开文件" style="padding: 2px 8px;"><span class="ic" data-ic="folder-open"></span> 打开</button>
                    <input type="file" id="file-input" accept=".svg" data-action="image-svg-optimizer.load-file">
                </div>
                <button class="secondary icon-btn" data-action="formatCode" title="格式化">Format</button>
            </div>
            <textarea id="code-input" placeholder="粘贴 SVG 代码..." spellcheck="false"></textarea>
        </div>

        <!-- Middle: Preview -->
        <div class="preview-pane">
            <div class="pane-header">
                <div class="control-group">
                    <span>预览</span>
                    <span id="zoom-level" style="opacity: 0.6; font-size: 10px; margin-left: 5px;">100%</span>
                    <button class="secondary icon-btn" data-action="resetZoom" title="重置视图" style="padding: 2px 5px; height: 20px; font-size: 10px;">Reset</button>
                </div>
                <div class="control-group">
                     <button class="secondary icon-btn" data-action="toggleCenter" title="显示中心点" style="padding: 2px 5px; height: 20px; font-size: 10px;"><span class="ic" data-ic="eye"></span> Center</button>
                     <button class="warning" id="btn-remove-watermark" data-action="removeWatermark" style="display:none; font-size: 10px; padding: 2px 6px;"><span class="ic" data-ic="sparkle"></span> 去水印</button>
                    <div class="bg-toggle" data-action="image-svg-optimizer.set-bg" data-bg="check" title="透明" style="cursor:pointer; opacity:0.7;"><span class="ic" data-ic="flag"></span></div>
                    <div class="bg-toggle" data-action="image-svg-optimizer.set-bg" data-bg="light" title="浅色" style="cursor:pointer; opacity:0.7;"><span class="ic" data-ic="sun"></span></div>
                    <div class="bg-toggle" data-action="image-svg-optimizer.set-bg" data-bg="dark" title="深色" style="cursor:pointer; opacity:0.7;"><span class="ic" data-ic="moon"></span></div>
                </div>
            </div>
            <div id="preview-bg" class="preview-area">
                <div id="preview-viewport">
                    <div id="preview-content"></div>
                </div>
            </div>
        </div>

        <!-- Right: Inspector -->
        <div class="inspector-pane">
            <div class="pane-header">属性检查器</div>
            
            <div class="inspector-section">
                <div class="section-title">统计信息</div>
                <div id="stats-display" class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">原始大小</span>
                        <span class="stat-value" id="size-orig">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">当前大小</span>
                        <span class="stat-value" id="size-curr">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">优化比例</span>
                        <span class="stat-value" id="size-saved">-</span>
                    </div>
                </div>
            </div>

            <div class="inspector-section">
                <div class="section-title">全局操作</div>
                <div style="display:flex; gap:5px; flex-wrap:wrap;">
                    <button class="secondary flex-1" data-action="optimizeSVG"><span class="ic" data-ic="rocket"></span> SVGO 压缩</button>
                    <button class="secondary flex-1" data-action="showBase64">Base64</button>
                </div>
                <div style="display:flex; gap:5px; margin-top:5px;">
                    <button class="secondary icon-btn" data-action="image-svg-optimizer.transform-svg" data-type="rotate" data-val="90" title="顺时针"><span class="ic" data-ic="rotate-cw"></span></button>
                    <button class="secondary icon-btn" data-action="image-svg-optimizer.flip-svg" data-axis="h" title="水平翻转"><span class="ic" data-ic="arrows-h"></span></button>
                    <button class="secondary icon-btn" data-action="image-svg-optimizer.flip-svg" data-axis="v" title="垂直翻转"><span class="ic" data-ic="arrows-v"></span></button>
                    <button class="secondary icon-btn" data-action="image-svg-optimizer.export-image" data-fmt="png" title="导出PNG">PNG</button>
                </div>
            </div>

            <div class="inspector-section" id="attr-editor" style="display:none;">
                <div class="section-title">当前选中: <span id="sel-tag" style="color:var(--primary)">-</span></div>
                
                <div class="prop-row">
                    <span class="prop-label">ID</span>
                    <input type="text" class="prop-input" id="inp-id" data-action="image-svg-optimizer.update-attr" data-attr="id">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Fill</span>
                    <input type="color" class="prop-color" id="inp-fill-color" data-action="image-svg-optimizer.update-attr" data-attr="fill">
                    <input type="text" class="prop-input" id="inp-fill" data-action="image-svg-optimizer.update-attr" data-attr="fill">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Stroke</span>
                    <input type="color" class="prop-color" id="inp-stroke-color" data-action="image-svg-optimizer.update-attr" data-attr="stroke">
                    <input type="text" class="prop-input" id="inp-stroke" data-action="image-svg-optimizer.update-attr" data-attr="stroke">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Width</span>
                    <input type="number" class="prop-input" id="inp-stroke-width" step="0.5" data-action="image-svg-optimizer.update-attr" data-attr="stroke-width">
                </div>
                <div class="prop-row">
                    <span class="prop-label">Opacity</span>
                    <input type="range" class="prop-input" id="inp-opacity" min="0" max="1" step="0.1" data-action="image-svg-optimizer.update-attr" data-attr="opacity">
                </div>
            </div>
            
            <div class="inspector-section flex-1">
                <div class="section-title">图层结构</div>
                <div class="tree-view" id="dom-tree"></div>
            </div>
        </div>
    </div>

    <!-- Batch Tab -->
    <div id="batch-view" class="tab-content">
        <div class="drop-zone" data-action="file-click" data-file-target="batch-file-input">
            <h3>批量处理模式</h3>
            <p>拖入多个 SVG 文件</p>
            <input type="file" id="batch-file-input" multiple accept=".svg" data-action="image-svg-optimizer.handle-batch">
        </div>
        <div class="file-list" id="batch-list"></div>
        <button id="btn-batch-download" disabled data-action="downloadBatchZip" style="margin: 20px;"><span class="ic" data-ic="package"></span> 下载全部</button>
    </div>

    <!-- Base64 Modal -->
    <div id="base64-modal" class="modal" data-action="image-svg-optimizer.close-modal-backdrop">
        <div class="modal-content">
            <h3>Base64 编码</h3>
            <textarea id="base64-output" readonly></textarea>
            <div class="control-group" style="justify-content: flex-end;">
                <button class="secondary" data-action="copyBase64">复制</button>
                <button data-action="image-svg-optimizer.close-modal">关闭</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/tools/image-svg-optimizer.js"></script>
</body>
</html>
