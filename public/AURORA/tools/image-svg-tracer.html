<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转 SVG (Vectorize)</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/image-svg-tracer.css">
</head>
<body class="scroll-content">
    
    <div class="panel" style="padding: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h2 style="margin: 0; color: var(--primary);">SVG 矢量化工具</h2>
                <p style="margin:0.5rem 0 0 0" class="text-dim">将位图 (PNG, JPG) 转换为矢量 SVG，支持批量处理与实时预览</p>
            </div>
            <div style="text-align: right;">
                <button class="btn" data-action="tracer.download-all" id="btn-download-all" disabled>
                    下载全部 (ZIP)
                </button>
            </div>
        </div>

        <div class="tracer-container">
            <div class="tracer-shell">
                <div class="tracer-left">
                    <div class="panel" style="background: rgba(0,0,0,0.2);">
                        <div class="settings-grid">
                            <div class="input-row">
                                <label>色彩数量 (Colors)</label>
                                <div style="display: flex; align-items: center; gap: 1rem;">
                                    <input type="range" id="color-count" min="2" max="64" value="16" class="flex-1" data-action="tracer.sync-color-count">
                                    <span id="color-val" style="width: 30px; text-align: right; color: var(--primary);">16</span>
                                </div>
                            </div>

                            <div class="input-row">
                                <label>限制最大宽度 (Resize)</label>
                                <select id="max-width" style="background:var(--input-bg)" class="w-100">
                                    <option value="0">原始尺寸 (不缩放)</option>
                                    <option value="640">640px</option>
                                    <option value="1024" selected>1024px</option>
                                    <option value="2048">2048px</option>
                                </select>
                            </div>

                            <div class="input-row">
                                <label>路径精度 (LTres)</label>
                                <div style="display: flex; align-items: center; gap: 1rem;">
                                    <input type="range" id="ltres" min="0" max="10" step="0.1" value="1" class="flex-1" data-action="tracer.sync-ltres">
                                    <span id="ltres-val" style="width: 30px; text-align: right; color: var(--primary);">1</span>
                                </div>
                                <div style="font-size:0.75rem; margin-top:0.2rem" class="text-dim">值越小精度越高</div>
                            </div>

                            <div class="input-row">
                                <label>曲线精度 (QTres)</label>
                                <div style="display: flex; align-items: center; gap: 1rem;">
                                    <input type="range" id="qtres" min="0" max="10" step="0.1" value="1" class="flex-1" data-action="tracer.sync-qtres">
                                    <span id="qtres-val" style="width: 30px; text-align: right; color: var(--primary);">1</span>
                                </div>
                            </div>
                            
                            <div class="input-row">
                                <label>模糊预处理</label>
                                 <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; margin-top: 0.5rem;">
                                    <input type="checkbox" id="blur-check" data-action="tracer.toggle-blur">
                                    启用高斯模糊
                                </label>
                                <div id="blur-control" style="display: none; margin-top: 0.5rem;">
                                    <input type="range" id="blur-radius" min="1" max="20" value="5" class="w-100">
                                </div>
                            </div>

                            <div class="input-row" style="display: flex; align-items: flex-end;">
                                 <button class="btn btn-primary w-100" data-action="tracer.process-all">应用设置并重新转换</button>
                            </div>
                        </div>
                    </div>

                    <div class="upload-area" id="drop-zone" data-action="file-click" data-file-target="file-input">
                        <div style="font-size: 2.5rem; margin-bottom: 1rem; color: var(--primary);"><span class="ic" data-ic="palette"></span></div>
                        <div style="font-size: 1.1rem; font-weight: 500;">点击或拖拽图片到此处</div>
                        <div style="font-size:0.9rem; margin-top:0.5rem" class="text-dim">支持 JPG, PNG (推荐透明背景)</div>
                        <input type="file" id="file-input" accept="image/*" multiple style="display: none;">
                    </div>
                </div>

                <div class="tracer-right">
                    <div class="panel-title list-header" style="margin-top: 0;">
                        <span>文件列表 (<span id="file-count">0</span>)</span>
                        <div class="list-meta">
                            <span>处理中 <b id="file-processing">0</b></span>
                            <span>完成 <b id="file-done">0</b></span>
                            <span>失败 <b id="file-error">0</b></span>
                        </div>
                        <button class="btn btn-sm" data-action="tracer.clear-all" style="color: var(--accent);">清空列表</button>
                    </div>
                    <div id="file-list" class="file-list">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
                <h3 style="margin: 0;">预览对比</h3>
                <span data-action="tracer.close-preview" style="cursor: pointer; font-size: 1.5rem;">&times;</span>
            </div>
            <div class="compare-view">
                <div class="view-pane">
                    <h4>原图</h4>
                    <div class="img-container" id="preview-original"></div>
                </div>
                <div class="view-pane">
                    <h4>SVG 矢量图 (<span id="svg-size">-</span> KB)</h4>
                    <div class="img-container" id="preview-svg"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/ui/worker-rpc.js"></script>
    <script src="../js/tools/image-svg-tracer.js"></script>
</body>
</html>
