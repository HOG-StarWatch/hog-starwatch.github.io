<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件处理</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
</head>
<body>
    <div class="workspace" style="flex-direction: column;">
        <div class="sub-tab-group">
            <div class="sub-tab active" data-action="fileTool.switchSubTab" data-mode="zip">ZIP 打包</div>
            <div class="sub-tab" data-action="fileTool.switchSubTab" data-mode="corrupt">文件破坏</div>
        </div>

        <!-- External Tool Container (Iframe) -->
        <div id="external-tool-container" style="display:none; height:100%; overflow:hidden; border-radius:var(--radius-lg); background:var(--bg-panel); border:1px solid var(--border)" class="flex-1 w-100">
            <iframe id="tool-frame" style="height:100%; border:none; background:transparent" class="w-100"></iframe>
        </div>

        <div class="workspace" id="inline-workspace">
            <div class="panel">
                <!-- ZIP Pack SubTab -->
                <div id="file-zip-view">
                    <div class="panel-header">
                        <div class="panel-title">文件打包 (ZIP Archiver)</div>
                    </div>
                    <div style="padding:2rem; display:flex; flex-direction:column; align-items:center; gap:2rem; height:100%" class="btn-center">
                        
                        <div class="upload-area" id="drop-zone">
                            <div style="font-size: 3rem; margin-bottom: 1rem;"><span class="ic" data-ic="package"></span></div>
                            <div style="font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem;">点击或拖拽文件/文件夹到此处</div>
                            <div style="font-size:0.9rem" class="text-dim">支持多文件选择，将自动打包为 ZIP</div>
                            <input type="file" id="file-picker" multiple style="position:absolute; top:0; left:0; height:100%; opacity:0; cursor:pointer" class="w-100" data-action="fileTool.handleFiles">
                        </div>

                        <div id="file-list" style="max-width:500px; max-height:200px; overflow-y:auto; display:none; background:rgba(0,0,0,0.2); border-radius:8px; padding:1rem" class="w-100">
                            <!-- File items will be added here -->
                        </div>

                        <div id="file-options" style="max-width:500px; display:none; flex-direction:column; gap:1rem" class="w-100">
                            <div class="input-row">
                                <label>压缩级别:</label>
                                <select id="zip-level">
                                    <option value="STORE">仅存储 (不压缩, 最快)</option>
                                    <option value="DEFLATE_1">快速压缩 (Level 1)</option>
                                    <option value="DEFLATE_5" selected>标准压缩 (Level 5)</option>
                                    <option value="DEFLATE_9">最大压缩 (Level 9, 最慢)</option>
                                </select>
                            </div>
                            <div class="input-row">
                                <label>文件名:</label>
                                <input type="text" id="zip-name" value="archive.zip" placeholder="archive.zip">
                            </div>
                            <button class="btn btn-primary btn-center" data-action="fileTool.createZip">
                                <span id="zip-btn-text">开始打包下载</span>
                            </button>
                        </div>

                    </div>
                </div>

                <!-- File Corrupt SubTab -->
                <div id="file-corrupt-view" style="display:none; height:100%; flex-direction:column;">
                    <div class="panel-header">
                        <div class="panel-title">文件破坏 (File Corruptor)</div>
                        <div class="panel-actions">
                             <button class="btn btn-icon" data-action="fileTool.clearCorrupt">清空</button>
                        </div>
                    </div>
                    <div style="padding:1rem; display:flex; flex-direction:column; gap:1rem; overflow:hidden" class="flex-1">
                        <div class="upload-area" id="corrupt-drop-zone">
                             <div style="margin-bottom:1rem; font-size:3rem;"><span class="ic" data-ic="trash"></span></div>
                             <div style="font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem;">拖拽文件到此处 或 点击选择</div>
                             <div style="font-size:0.9rem" class="text-dim">警告：此操作不可逆（虽然这里只是生成副本），请谨慎使用</div>
                             <input type="file" id="corrupt-file-input" style="position:absolute; top:0; left:0; height:100%; opacity:0; cursor:pointer" class="w-100" data-action="fileTool.handleCorruptFile">
                        </div>
                        
                        <div id="corrupt-settings" style="display:none; flex-direction:column; gap:1.5rem; max-width:600px; margin:0 auto" class="w-100">
                             <div class="info-row" style="display:flex; justify-content:space-between; align-items:center; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 8px;">
                                <span id="corrupt-file-name" style="font-weight:bold;">Filename.ext</span>
                                <span id="corrupt-file-size" class="text-dim">0 KB</span>
                             </div>
                             
                             <div class="input-row">
                                <label>破坏模式:</label>
                                <select id="corrupt-mode">
                                    <option value="random">随机字节替换 (Random Noise)</option>
                                    <option value="zero">清零 (Zero Fill)</option>
                                    <option value="header">仅头部破坏 (Header Only)</option>
                                    <option value="scramble">局部乱序 (Shuffle)</option>
                                </select>
                             </div>
                             
                             <div class="input-row" style="flex-direction: column; align-items: flex-start; gap: 0.5rem;">
                                <div class="flex-between" class="w-100">
                                    <label>破坏程度 (Intensity):</label>
                                    <span id="corrupt-val" style="font-weight: bold; color: var(--primary);">5%</span>
                                </div>
                                <input type="range" id="corrupt-amount" min="1" max="100" value="5" class="w-100" data-action="fileTool.updateCorruptVal">
                             </div>
                             
                             <button class="btn btn-primary btn-center" data-action="fileTool.execCorrupt"><span class="ic" data-ic="skull"></span> 开始破坏并下载</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/tools/file.js"></script>
</body>
</html>
