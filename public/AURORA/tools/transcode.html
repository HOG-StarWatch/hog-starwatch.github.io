<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本转码</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <script src="../js/loader.js"></script>
</head>
<body>
    <div class="workspace layout-vertical">
        <div class="sub-tab-group">
            <div class="sub-tab active" data-action="transcoder.set-mode" data-mode="url">URL</div>
            <div class="sub-tab" data-action="transcoder.set-mode" data-mode="base64">Base64 (UTF-8)</div>
            <div class="sub-tab" data-action="transcoder.set-mode" data-mode="unicode">Unicode (\u)</div>
            <div class="sub-tab" data-action="transcoder.set-mode" data-mode="html">HTML实体</div>
            <div class="sub-tab" data-action="transcoder.set-mode" data-mode="hex">Hex (16进制)</div>
            <div class="sub-tab" data-action="transcoder.set-mode" data-mode="bin">Binary (2进制)</div>
            <div class="sub-tab" data-action="transcoder.set-mode" data-mode="punycode">Punycode</div>
        </div>

        <div class="workspace">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">待转码</div>
                    <div class="panel-actions">
                        <button class="btn btn-icon" data-action="clear" data-clear-prefix="code">清空</button>
                    </div>
                </div>
                <textarea id="code-input" placeholder="输入内容..."></textarea>
            </div>

            <div class="toolbar">
                <div class="tool-group">
                    <div class="group-label">操作</div>
                    <button class="btn btn-primary" data-action="transcoder.run" data-mode="encode">编码 (Encode) <span class="ic" data-ic="arrow-right"></span></button>
                    <button class="btn btn-primary" data-action="transcoder.run" data-mode="decode">解码 (Decode) <span class="ic" data-ic="arrow-left"></span></button>
                    <button class="btn" data-action="transcoder.swap"><span class="ic" data-ic="arrows-v"></span> 交换内容</button>
                </div>
                <div class="tool-group">
                    <div class="group-label">说明</div>
                    <div style="font-size:0.8rem; padding:0.5rem; line-height:1.4" class="text-dim">
                        当前模式：<span id="current-mode-label" class="text-secondary">URL</span>
                        <br><br>
                        Base64模式已优化中文支持。
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">结果</div>
                    <div class="panel-actions">
                        <button class="btn btn-icon btn-secondary" data-action="copy" data-copy-target="code-output">复制</button>
                    </div>
                </div>
                <textarea id="code-output" readonly placeholder="转换结果..."></textarea>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/tools/transcode.js"></script>
</body>
</html>
