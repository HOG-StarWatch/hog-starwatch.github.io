<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码格式化</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <script src="../js/loader.js"></script>
</head>
<body>
    <div class="workspace">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">源码输入</div>
                <div class="panel-actions">
                    <button class="btn btn-icon" data-action="clear" data-clear-prefix="fmt">清空</button>
                </div>
            </div>
            <textarea id="fmt-input" placeholder="粘贴 JSON, HTML, CSS, JS 代码..."></textarea>
        </div>

        <div class="toolbar">
            <div class="tool-group">
                <div class="group-label">JSON</div>
                <button class="btn" data-action="fmtTool.format" data-mode="json">格式化 JSON</button>
                <button class="btn" data-action="fmtTool.minify" data-mode="json">压缩 JSON</button>
            </div>
            <div class="tool-group">
                <div class="group-label">Web</div>
                <button class="btn" data-action="fmtTool.format" data-mode="html">格式化 HTML</button>
                <button class="btn" data-action="fmtTool.format" data-mode="css">格式化 CSS</button>
                <button class="btn" data-action="fmtTool.format" data-mode="js">格式化 JS</button>
            </div>
            <div class="tool-group">
                <div class="group-label">Other</div>
                <button class="btn" data-action="fmtTool.minify" data-mode="xml">XML 压缩</button>
                <button class="btn" data-action="fmtTool.minify" data-mode="sql">SQL 压缩</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">格式化结果</div>
                <div class="panel-actions">
                    <button class="btn btn-icon btn-secondary" data-action="copy" data-copy-target="fmt-output">复制</button>
                </div>
            </div>
            <textarea id="fmt-output" readonly placeholder="结果..."></textarea>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/tools/format.js"></script>
</body>
</html>
