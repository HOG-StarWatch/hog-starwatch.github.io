<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/qrcode.css">
</head>
<body>
    <div class="workspace"> <!-- 允许主workspace滚动 -->
        <div class="workspace-split">
            <!-- Left: Settings Panel -->
            <div class="panel settings-panel">
                <div class="panel-header">
                    <div class="panel-title">设置</div>
                </div>
                <div style="padding: 1.5rem; padding-top: 0;">
                    <!-- Content Input -->
                    <div class="input-group" style="margin-bottom: 1.5rem;">
                        <label style="display:block; margin-bottom:0.5rem" class="text-dim">二维码内容</label>
                        <textarea id="qr-text" placeholder="输入网址、文本或任何内容..." style="min-height:80px" class="w-100">https://www.example.com</textarea>
                    </div>

                    <!-- Options -->
                    <div class="options-grid">
                        <!-- Basic -->
                        <div class="sub-group-title" style="margin-top: 0;">基础设置</div>
                        <div class="input-row">
                            <label>尺寸 (px)</label>
                            <input type="number" id="qr-width" value="300" min="64" max="2048" step="10" class="w-100">
                        </div>
                        <div class="input-row">
                            <label>容错率</label>
                            <select id="qr-correct" class="w-100">
                                <option value="L">L (7%)</option>
                                <option value="M" selected>M (15%)</option>
                                <option value="Q">Q (25%)</option>
                                <option value="H">H (30%)</option>
                            </select>
                        </div>

                        <!-- Colors -->
                        <div class="sub-group-title">颜色设置</div>
                        <div class="input-row">
                            <label>前景色 (码)</label>
                            <div class="color-picker-wrapper">
                                <input type="color" id="qr-color-dark" value="#000000">
                                <input type="text" id="qr-color-dark-text" value="#000000" data-action="sync-color-input" data-sync-target="qr-color-dark" class="flex-1">
                            </div>
                        </div>
                        <div class="input-row">
                            <label>背景色</label>
                            <div class="color-picker-wrapper">
                                <input type="color" id="qr-color-light" value="#ffffff">
                                <input type="text" id="qr-color-light-text" value="#ffffff" data-action="sync-color-input" data-sync-target="qr-color-light" class="flex-1">
                            </div>
                        </div>

                        <!-- Advanced -->
                        <div class="sub-group-title">样式微调</div>
                        <div class="input-row">
                            <label>点大小比例 (0.1-1.0)</label>
                            <input type="number" id="qr-dot-scale" value="1.0" min="0.1" max="1.0" step="0.1" class="w-100">
                        </div>
                        <div class="input-row">
                            <label>静默区 (边距)</label>
                            <input type="number" id="qr-quiet-zone" value="10" min="0" max="100" class="w-100">
                        </div>

                        <!-- Logo -->
                        <div class="sub-group-title">Logo 设置</div>
                        <div class="input-row full-width-col">
                            <label>上传 Logo (可选)</label>
                            <input type="file" id="qr-logo-file" accept="image/*" class="w-100">
                        </div>
                    </div>

                    <!-- Actions -->
                    <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                        <button class="btn btn-primary flex-1 btn-center" data-action="generateQR">生成/刷新</button>
                    </div>
                </div>
            </div>

            <!-- Right: Preview Panel -->
            <div class="preview-panel">
                <div style="position:absolute; top:1rem; left:1rem; font-weight:600" class="text-dim">预览</div>
                <div style="position: absolute; top: 1rem; right: 1rem;">
                     <button class="btn btn-secondary btn-sm" data-action="downloadQR">下载 PNG</button>
                </div>
                
                <div id="qrcode-container"></div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/tools/qrcode.js"></script>
</body>
</html>
