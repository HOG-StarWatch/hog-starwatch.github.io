<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能翻译</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <link rel="stylesheet" href="../css/tools/ai-translate.css">
</head>
<body class="scroll-content">
    <div class="workspace translate-container">
        <div class="translate-top">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">智能翻译</div>
                    <div class="panel-actions">
                        <button class="btn btn-icon" data-action="translate.clear">清空</button>
                    </div>
                </div>
                <textarea id="translate-input" placeholder="输入需要翻译的文本..." style="min-height: 220px;"></textarea>
                <div class="stats-row">字符: <b id="translate-count">0</b></div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">翻译设置</div>
                </div>
                <div class="translate-grid">
                    <div class="input-group">
                        <label for="translate-from">源语言</label>
                        <select id="translate-from">
                            <option value="auto">自动检测</option>
                            <option value="zh-CN">中文</option>
                            <option value="en">English</option>
                            <option value="ja">日本語</option>
                            <option value="ko">한국어</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="es">Español</option>
                            <option value="ru">Русский</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="translate-to">目标语言</label>
                        <select id="translate-to">
                            <option value="zh-CN">中文</option>
                            <option value="en">English</option>
                            <option value="ja">日本語</option>
                            <option value="ko">한국어</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="es">Español</option>
                            <option value="ru">Русский</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>快捷操作</label>
                        <button class="btn" data-action="translate.swap">交换语言</button>
                    </div>
                </div>
                <div class="translate-actions">
                    <button class="btn btn-primary" data-action="translate.run">开始翻译</button>
                    <button class="btn btn-secondary" data-action="copy" data-copy-target="translate-output">复制结果</button>
                    <button class="btn btn-secondary" data-action="translate.open-ms">微软翻译</button>
                </div>
                <div class="api-note">翻译接口：MyMemory (api.mymemory.translated.net)；网页同步：Bing Translator</div>
                <textarea id="translate-output" placeholder="翻译结果将在这里显示..." readonly></textarea>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">微软翻译</div>
                <div class="panel-actions">
                    <button class="btn btn-icon" data-action="translate.open-ms">同步</button>
                    <button class="btn btn-icon" data-action="translate.open-ms" data-new-tab="1">打开网页</button>
                </div>
            </div>
            <div style="padding: 0 1rem 1rem;">
                <div class="ms-translate-wrap">
                    <div class="ms-translate-loading" id="ms-translate-loading">
                        <div class="spinner"></div>
                        <div>微软翻译加载中...</div>
                    </div>
                    <iframe id="ms-translate-frame" loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">操作成功</div>
    <script src="../js/app.js"></script>
    <script src="../js/tools/ai-translate.js"></script>
</body>
</html>
