<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图种生成器</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/loader.js"></script>
    <link rel="stylesheet" href="../css/tools/image-seeder.css">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header-section">
            <h1 style="color: var(--primary); margin-bottom: 10px;"><span class="ic" data-ic="sprout"></span> 图种生成器</h1>
            <p class="text-dim">将文件隐藏在图片中。修改后缀为 .zip 或用解压软件打开即可提取。</p>
        </div>

        <div class="main-grid">
            <!-- 1. Cover Image -->
            <div class="panel">
                <div class="section-title">
                    <span>1. 封面图片 (Cover)</span>
                </div>

                <div class="tab-group">
                    <button class="tab-btn active" data-action="image-seeder.switch-cover-tab" data-mode="upload"><span class="ic" data-ic="upload"></span> 上传图片</button>
                    <button class="tab-btn" data-action="image-seeder.switch-cover-tab" data-mode="generate"><span class="ic" data-ic="palette"></span> 自动生成</button>
                </div>

                <!-- Upload Mode -->
                <div id="cover-upload" class="cover-content flex-1">
                    <input type="file" id="input-cover" accept="image/*" style="display: none;">
                    <div class="upload-zone" data-action="file-click" data-file-target="input-cover">
                        <p id="ph-cover" class="text-dim">点击上传封面图片 (JPG/PNG/GIF)</p>
                        <img id="img-preview">
                    </div>
                </div>

                <!-- Generate Mode -->
                <div id="cover-generate" class="cover-content flex-1">
                    <div class="control-row">
                        <label>背景颜色:</label>
                        <input type="color" id="gen-color" value="#8b5cf6" data-action="renderCanvas">
                    </div>
                    
                    <div style="margin-bottom: 15px;">
                        <label style="display:block; margin-bottom:10px; color:var(--text-main);">自定义元素:</label>
                        <div id="element-list"></div>
                        <button class="tab-btn w-100" data-action="addCustomElement"><span class="ic" data-ic="plus"></span> 添加 Emoji / 文字</button>
                    </div>

                    <div class="upload-zone" style="cursor: default; background: transparent; padding: 10px;">
                        <canvas id="gen-canvas" width="600" height="400" style="max-width: 100%; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);"></canvas>
                    </div>
                </div>
            </div>

            <!-- 2. Hidden Content -->
            <div class="panel">
                <div class="section-title">
                    <span>2. 隐藏内容 (Hidden Content)</span>
                </div>

                <div class="tab-group">
                    <button class="tab-btn active" data-action="image-seeder.switch-hidden-tab" data-mode="files"><span class="ic" data-ic="file"></span> 选择文件</button>
                    <button class="tab-btn" data-action="image-seeder.switch-hidden-tab" data-mode="zip"><span class="ic" data-ic="package"></span> 选择压缩包</button>
                </div>

                <!-- Files Mode -->
                <div id="hidden-files" class="hidden-content flex-1">
                    <input type="file" id="input-files" multiple style="display: none;">
                    <div class="upload-zone" data-action="file-click" data-file-target="input-files" style="min-height: 120px;">
                        <p class="text-dim">点击选择一个或多个文件<br>(将自动打包为 .zip)</p>
                        <div id="file-list" class="file-list"></div>
                    </div>
                </div>

                <!-- Zip Mode -->
                <div id="hidden-zip" class="hidden-content flex-1">
                    <input type="file" id="input-zip" accept=".zip,.rar,.7z,.tar" style="display: none;">
                    <div class="upload-zone" data-action="file-click" data-file-target="input-zip" style="min-height: 120px;">
                        <p id="ph-zip" class="text-dim">点击上传已有的压缩包 (.zip/.rar等)</p>
                        <div id="zip-info" style="display:none; color: var(--secondary); font-weight: bold; margin-top: 10px;"></div>
                    </div>
                </div>
            </div>

            <!-- Action -->
            <div class="full-width">
                <button class="btn btn-primary" id="btn-create"><span class="ic" data-ic="wand"></span> 生成图种</button>
                <a id="btn-download" class="btn btn-success"><span class="ic" data-ic="save"></span> 下载结果</a>
            </div>
        </div>

    </div>

    <script src="../js/tools/image-seeder.js"></script>
</body>
</html>
