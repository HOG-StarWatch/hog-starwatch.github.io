<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG 画板</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-boot.js"></script>
    <script src="../js/ui/icons.js"></script>
    <script src="../js/app.js"></script>
    <link rel="stylesheet" href="../css/tools/image-svg-painter.css">
</head>
<body>
    <div class="panel-header">
        <div class="panel-title">SVG 矢量画板</div>
        <div class="panel-actions">
            <button class="btn btn-secondary" data-action="image-svg-painter.go-drawing">前往简易画板颜色转换</button>
        </div>
    </div>

    <div class="layout-sidebar">
        <div class="controls panel">
            <div class="color-picker-wrapper">
                <span>描边:</span>
                <input type="color" id="stroke-color" value="#000000">
            </div>
            <div class="color-picker-wrapper">
                <span>填充:</span>
                <div style="display:flex; align-items:center; gap:5px;">
                    <input type="color" id="fill-color" value="#ffffff">
                    <label style="font-size:0.8rem;"><input type="checkbox" id="enable-fill"> 启用</label>
                </div>
            </div>
            <div class="color-picker-wrapper">
                <span>粗细:</span>
                <div style="display:flex; align-items:center; gap:5px; justify-content:flex-end" class="flex-1">
                    <input type="range" id="stroke-width" min="1" max="50" value="3" style="width:100px">
                    <span id="width-val" style="width:20px; text-align:right;">3</span>
                </div>
            </div>
            <div class="color-picker-wrapper">
                <span>透明度:</span>
                <div style="display:flex; align-items:center; gap:5px; justify-content:flex-end" class="flex-1">
                    <input type="range" id="opacity" min="0" max="100" value="100" style="width:100px">
                    <span id="opacity-val" style="width:35px; text-align:right;">100%</span>
                </div>
            </div>
            <div class="color-picker-wrapper">
                <span>笔触:</span>
                <select id="line-cap" style="background:var(--bg-deep);    padding:2px;">
                    <option value="round">圆头</option>
                    <option value="square">方头</option>
                    <option value="butt">平头</option>
                </select>
            </div>
            
            <div style="height:1px; background:var(--border); margin:5px 0" class="w-100"></div>

            <div class="color-picker-wrapper">
                <span>辅助:</span>
                <div style="display:flex; align-items:center; gap:5px; justify-content:flex-end" class="flex-1">
                    <label style="font-size:0.8rem; display:flex; align-items:center;"><input type="checkbox" id="show-grid" data-action="toggleGrid"> 网格</label>
                    <label style="font-size:0.8rem; display:flex; align-items:center;"><input type="checkbox" id="snap-grid"> 吸附</label>
                    <input type="number" id="grid-size" value="20" min="5" max="100" style="width:35px; font-size:0.8rem; padding:0;" data-action="updateGrid" title="网格大小">
                </div>
            </div>
            
            <div class="tool-grid">
                <button class="btn btn-primary tool-btn active" data-action="image-svg-painter.set-mode" data-mode="path"><span class="ic" data-ic="pencil"></span> 自由笔</button>
                <button class="btn tool-btn" data-action="image-svg-painter.set-mode" data-mode="line"><span class="ic" data-ic="ruler"></span> 直线</button>
                <button class="btn tool-btn" data-action="image-svg-painter.set-mode" data-mode="rect"><span class="ic" data-ic="square"></span> 矩形</button>
                <button class="btn tool-btn" data-action="image-svg-painter.set-mode" data-mode="circle"><span class="ic" data-ic="circle"></span> 圆形</button>
                <button class="btn tool-btn" data-action="image-svg-painter.set-mode" data-mode="ellipse"><span class="ic" data-ic="egg"></span> 椭圆</button>
                <button class="btn tool-btn" data-action="image-svg-painter.set-mode" data-mode="text">T 文本</button>
                <button class="btn tool-btn" data-action="image-svg-painter.set-mode" data-mode="spray"><span class="ic" data-ic="droplet"></span> 喷枪</button>
                <button class="btn tool-btn" data-action="image-svg-painter.set-mode" data-mode="calligraphy"><span class="ic" data-ic="pen"></span> 书法笔</button>
            </div>
            
            <div style="height:1px; background:var(--border); margin:5px 0" class="w-100"></div>
            
            <div class="tool-grid">
                <button class="btn btn-success" data-action="undo"><span class="ic" data-ic="corner-up-left"></span> 撤销</button>
                <button class="btn btn-danger" data-action="clearCanvas"><span class="ic" data-ic="trash"></span> 清空</button>
            </div>
            <button class="btn btn-primary" data-action="exportSVG" style="margin-top:auto;"><span class="ic" data-ic="save"></span> 导出 SVG</button>
            
            <div style="height:1px; background:var(--border); margin:5px 0" class="w-100"></div>
            
            <div class="flex-col">
                <div style="display:flex; gap:5px; align-items:center;">
                    <input type="text" id="art-seed" placeholder="留空则随机" style="width:80px; font-size:0.8rem; padding:4px;">
                    <button class="btn btn-secondary flex-1" data-action="generateRandomArt"><span class="ic" data-ic="dice"></span> 生成艺术</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
                    <label style="font-size:0.8rem; cursor:pointer; display:flex; align-items:center; gap:5px; user-select:none;">
                        <input type="checkbox" id="clear-before-gen" checked> 覆盖清空
                    </label>
                    <span id="seed-display" 
                          style="font-size:0.75rem; color:var(--text-main); background:var(--bg-deep); padding:2px 6px; border-radius:4px; border:1px solid var(--border); cursor:pointer; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" 
                          title="点击复制当前种子" 
                          data-action="copySeed">
                    </span>
                </div>
                
                <div style="border:1px solid var(--border); border-radius:4px; padding:5px; margin-top:5px; max-height:150px; overflow-y:auto; font-size:0.8rem;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                        <span style="font-weight:bold;">风格筛选:</span>
                        <a href="javascript:void(0)" data-action="image-svg-painter.toggle-all-styles" style="color:var(--secondary); text-decoration:none;">全选</a>
                    </div>
                    <div id="style-list" style="display:grid; grid-template-columns: 1fr 1fr; gap:2px;">
                        <!-- Styles injected by JS -->
                    </div>
                </div>
            </div>
        </div>

        <div class="canvas-container">
            <svg id="svg-canvas" width="512" height="512" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
    </div>

    <div id="toast"></div>
    <script src="../js/tools/image-svg-painter.js"></script>
</body>
</html>
