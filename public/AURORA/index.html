<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极光工具箱 (Aurora Toolbox)</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="dns-prefetch" href="//cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="//unpkg.com">
    <script src="js/loader.js"></script>
    <link rel="stylesheet" href="css/shell/layout.css">
</head>
<body>
    <header>
        <div style="display:flex; align-items:center; width: 100%; justify-content: space-between; height: 100%;">
            <div style="display:flex; align-items:center; height: 100%;">
                <!-- Mobile Menu Button -->
                <button id="mobile-menu-btn" style="display:none; background:none; border:none; color:var(--text-main); font-size:1.5rem; margin-right:15px; cursor:pointer;">
                    <span class="ic" data-ic="menu"></span>
                </button>
                <div class="logo" id="logo-home" style="cursor: pointer;">AURORA <span style="font-weight:300; opacity:0.7">TOOLBOX</span></div>
            </div>
            
            <div style="display:flex; align-items:center; height: 100%;">
                <nav class="nav-tabs" id="main-nav">
                    <button class="btn" id="back-home-btn">
                    <span><span class="ic" data-ic="heart"></span></span>
                    </button>   
                    <button class="tab-btn active" data-src="tools/home.html">主页</button>
        
                    <!-- Image Dropdown -->
                    <div class="dropdown">
                        <button class="tab-btn dropdown-toggle">图像与视觉</button>
                        <div class="dropdown-content">
                            <div class="dropdown-header">格式与处理</div>
                            <button class="tab-btn" data-src="tools/image-convert.html">格式转换</button>
                            <button class="tab-btn" data-src="tools/image-appicon.html">图标制作</button>
                            <button class="tab-btn" data-src="tools/image-overlay.html">图片叠加</button>
                            <button class="tab-btn" data-src="tools/image-pixel.html">像素化</button>
                            <button class="tab-btn" data-src="tools/image-photon.html">专业滤镜 (Photon)</button>

                            <div class="dropdown-divider"></div>
                            <div class="dropdown-header">绘制与 SVG</div>
                            <button class="tab-btn" data-src="tools/image-drawing.html">简易画板</button>
                            <button class="tab-btn" data-src="tools/image-svg-painter.html">SVG 画板</button>
                            <button class="tab-btn" data-src="tools/image-svg-optimizer.html">SVG 优化</button>
                            <button class="tab-btn" data-src="tools/image-svg-tracer.html">SVG 矢量化</button>

                            <div class="dropdown-divider"></div>
                            <div class="dropdown-header">特效与动画</div>
                            <button class="tab-btn" data-src="tools/image-gif.html">GIF 合成</button>
                            <button class="tab-btn" data-src="tools/image-glitch.html">故障艺术</button>
                            <button class="tab-btn" data-src="tools/image-ascii.html">字符画</button>

                            <div class="dropdown-divider"></div>
                            <div class="dropdown-header">隐写与生成</div>
                            <button class="tab-btn" data-src="tools/image-crypto.html">视觉加密</button>
                            <button class="tab-btn" data-src="tools/image-phantom.html">幻影坦克</button>
                            <button class="tab-btn" data-src="tools/image-hybrid.html">混合图像</button>
                            <button class="tab-btn" data-src="tools/image-seeder.html">图种生成</button>
                            <button class="tab-btn" data-src="tools/image-fun.html">趣味生成</button>
                        </div>
                    </div>

                    <!-- Text Dropdown -->
                    <div class="dropdown">
                        <button class="tab-btn dropdown-toggle">文本与编码</button>
                        <div class="dropdown-content">
                            <div class="dropdown-header">文本工具</div>
                            <button class="tab-btn" data-src="tools/text.html">文本处理</button>
                            <button class="tab-btn" data-src="tools/transcode.html">文本转码</button>
                            <button class="tab-btn" data-src="tools/regex.html">正则实验室</button>
                            <button class="tab-btn" data-src="tools/markdown.html">Markdown</button>
                            <button class="tab-btn" data-src="tools/diff.html">文本对比 (Diff)</button>

                            <div class="dropdown-divider"></div>
                            <div class="dropdown-header">代码与格式</div>
                            <button class="tab-btn" data-src="tools/format.html">代码格式化</button>
                            <button class="tab-btn" data-src="tools/obfuscator.html">HTML 混淆</button>

                            <div class="dropdown-divider"></div>
                            <div class="dropdown-header">加解密</div>
                            <button class="tab-btn" data-src="tools/encrypt.html">对称加密</button>
                        </div>
                    </div>
        
                    <!-- File Dropdown -->
                    <div class="dropdown">
                        <button class="tab-btn dropdown-toggle">文件与数据</button>
                        <div class="dropdown-content">
                            <div class="dropdown-header">文件处理</div>
                            <button class="tab-btn" data-src="tools/file.html">文件管理</button>
                            <button class="tab-btn" data-src="tools/file-encoding.html">文件编码</button>
                            <button class="tab-btn" data-src="tools/file-qrcode.html">文件二维码序列</button>

                            <div class="dropdown-divider"></div>
                            <div class="dropdown-header">数据工具</div>
                            <button class="tab-btn" data-src="tools/hash.html">哈希计算</button>
                            <button class="tab-btn" data-src="tools/qrcode.html">二维码生成</button>
                            <button class="tab-btn" data-src="tools/generator.html">数据生成器</button>
                            <button class="tab-btn" data-src="tools/datetime.html">时间工具</button>
                            <button class="tab-btn" data-src="tools/unit.html">单位换算</button>
                        </div>
                    </div>
        
                    <!-- Network Dropdown -->
                    <div class="dropdown">
                        <button class="tab-btn dropdown-toggle">网络与查询</button>
                        <div class="dropdown-content">
                            <button class="tab-btn" data-src="tools/network-ip.html">IP 信息查询</button>
                            <button class="tab-btn" data-src="tools/url.html">URL 解析器</button>
                            <button class="tab-btn" data-src="tools/network-ping.html">网络测试</button>
                            <button class="tab-btn" data-src="tools/network-rdap.html">RDAP/Whois 查询</button>
                            <button class="tab-btn" data-src="tools/network-github.html">GitHub 搜索</button>
                            <button class="tab-btn" data-src="tools/network-epic.html">Epic 免费游戏</button>
                        </div>
                    </div>

                    <!-- Dev & AI Dropdown -->
                    <div class="dropdown">
                        <button class="tab-btn dropdown-toggle">开发与 AI</button>
                        <div class="dropdown-content">
                            <div class="dropdown-header">开发工具</div>
                            <button class="tab-btn" data-src="tools/developer-toolbox.html">开发者工具箱</button>
                            <button class="tab-btn" data-src="tools/hf-space-converter.html">Space 应用转换</button>
                            <div class="dropdown-divider"></div>
                            <div class="dropdown-header">AI 服务</div>
                            <button class="tab-btn" data-src="tools/ai-tts.html">语音合成 (TTS)</button>
                            <button class="tab-btn" data-src="tools/ai-stt.html">语音转文本 (STT)</button>
                            <button class="tab-btn" data-src="tools/ai-translate.html">智能翻译</button>
                        </div>
                    </div>
                </nav>

                <button id="offline-btn" title="离线可用性" style="margin-left: 15px; background:rgba(255,255,255,0.1); border:none; color:var(--text-main); cursor:pointer; height:32px; padding:0 10px; border-radius:16px; display:flex; align-items:center; justify-content:center; transition:0.2s; font-size:0.8rem;">
                    ⊗
                </button>
                <button id="theme-btn" title="切换主题" style="margin-left: 10px; background:rgba(255,255,255,0.1); border:none; color:var(--text-main); cursor:pointer; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:0.2s;">
                    <span class="ic" data-ic="heart"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile Drawer -->
    <div id="mobile-drawer" style="position:fixed; top:60px; left:-100%; width:260px; height:calc(100% - 60px); background:var(--bg-deep); border-right:1px solid var(--border); transition:left 0.3s ease; z-index:100; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:0.5rem; box-shadow: 2px 0 10px rgba(0,0,0,0.5);">
        <!-- Content will be injected by JS or cloned -->
    </div>
    <div id="mobile-overlay" style="display:none; position:fixed; top:60px; left:0; width:100%; height:calc(100% - 60px); background:rgba(0,0,0,0.5); z-index:90; backdrop-filter:blur(3px);"></div>
    
    <main style="position:relative;">
        <div id="loading-overlay" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:var(--bg-deep); z-index:50; justify-content:center; align-items:center; flex-direction:column;">
            <div class="spinner"></div>
            <div style="margin-top:10px; color:var(--text-dim); font-size:0.9rem;">加载中...</div>
        </div>
        <iframe id="app-frame" src="tools/home.html"></iframe>
    </main>

    <!-- Theme Modal -->
    <div id="theme-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(5px); z-index:2000; align-items:center; justify-content:center; opacity:0; transition: opacity 0.3s;">
        <div style="background:var(--bg-deep); width:600px; max-height:85vh; overflow-y:auto; padding:24px; border-radius:var(--radius-lg); border:1px solid var(--border); box-shadow:var(--shadow); transform: scale(0.95); transition: transform 0.3s;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; position:sticky; top:0; background:var(--bg-deep); padding-bottom:10px; border-bottom:1px solid var(--border); z-index:10;">
                <div>
                    <h3 style="margin:0; color:var(--text-main); font-size:1.2rem;">主题设置</h3>
                    <div style="font-size:0.8rem; color:var(--text-dim); margin-top:4px;">选择您喜欢的界面风格</div>
                </div>
                <button id="theme-modal-close" style="background:none; border:none; color:var(--text-dim); font-size:1.5rem; cursor:pointer; padding:5px; border-radius:50%; display:flex; align-items:center; justify-content:center; width:32px; height:32px;">×</button>
            </div>
            
            <div style="margin-bottom:30px;">
                <h4 style="color:var(--text-dim); margin-bottom:15px; font-size:0.75rem; text-transform:uppercase; letter-spacing:1px; font-weight:600;">风格预设 (Presets)</h4>
                <div id="preset-themes-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:15px;">
                    <!-- Themes will be generated by JS -->
                </div>
            </div>

            <div style="margin-bottom:30px;">
                <h4 style="color:var(--text-dim); margin-bottom:15px; font-size:0.75rem; text-transform:uppercase; letter-spacing:1px; font-weight:600;">仿知名网站配色 (Famous Sites)</h4>
                <div id="famous-themes-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:15px;">
                    <!-- Themes will be generated by JS -->
                </div>
            </div>

            <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <h4 style="color:var(--text-dim); margin:0; font-size:0.75rem; text-transform:uppercase; letter-spacing:1px; font-weight:600;">自定义 (Custom)</h4>
                    <div style="display:flex; gap:8px;">
                        <button id="randomize-btn" class="btn btn-sm btn-secondary" style="font-size:0.75rem; padding:2px 8px;"><span class="ic" data-ic="dice"></span> 随机</button>
                        <button id="chaos-btn" class="btn btn-sm btn-secondary" style="font-size:0.75rem; padding:2px 8px;"><span class="ic" data-ic="flame"></span> 全随机</button>
                        <button id="meltdown-btn" class="btn btn-sm btn-secondary" style="font-size:0.75rem; padding:2px 8px;"><span class="ic" data-ic="cyclone"></span> 崩坏</button>
                    </div>
                </div>
                <div style="background:var(--bg-panel); padding:20px; border-radius:var(--radius-md); border:1px solid var(--border);">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                        <div class="flex-col">
                            <label style="font-size:0.8rem; color:var(--text-dim);">主色 (Primary)</label>
                            <div class="color-input-wrapper">
                                <input type="color" id="custom-primary">
                                <span id="val-primary">#000000</span>
                            </div>
                        </div>
                        <div class="flex-col">
                            <label style="font-size:0.8rem; color:var(--text-dim);">辅色 (Secondary)</label>
                            <div class="color-input-wrapper">
                                <input type="color" id="custom-secondary">
                                <span id="val-secondary">#000000</span>
                            </div>
                        </div>
                        <div class="flex-col">
                            <label style="font-size:0.8rem; color:var(--text-dim);">背景 (Background)</label>
                            <div class="color-input-wrapper">
                                <input type="color" id="custom-bg">
                                <span id="val-bg">#000000</span>
                            </div>
                        </div>
                        <div class="flex-col">
                            <label style="font-size:0.8rem; color:var(--text-dim);">文本 (Text)</label>
                            <div class="color-input-wrapper">
                                <input type="color" id="custom-text-main">
                                <span id="val-text">#000000</span>
                            </div>
                        </div>
                    </div>
                    <!-- Hidden inputs -->
                    <input type="hidden" id="custom-accent">
                    <input type="hidden" id="custom-text-dim">
                </div>
            </div>
        </div>
    </div>

    <div id="offline-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(5px); z-index:2000; align-items:center; justify-content:center; opacity:0; transition: opacity 0.3s;">
        <div style="background:var(--bg-deep); width:640px; max-height:85vh; overflow-y:auto; padding:24px; border-radius:var(--radius-lg); border:1px solid var(--border); box-shadow:var(--shadow); transform: scale(0.95); transition: transform 0.3s;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; position:sticky; top:0; background:var(--bg-deep); padding-bottom:10px; border-bottom:1px solid var(--border); z-index:10; gap:12px;">
                <div style="min-width:0;">
                    <h3 style="margin:0; color:var(--text-main); font-size:1.2rem;">离线可用性</h3>
                    <div style="font-size:0.8rem; color:var(--text-dim); margin-top:4px;">选择需要离线缓存的工具页</div>
                    <div id="offline-cache-summary" style="font-size:0.75rem; color:var(--text-dim); margin-top:6px;">暂无统计</div>
                    <div style="font-size:0.7rem; color:var(--text-dim); margin-top:4px;">浏览器占用可能需要刷新才会清除</div>
                    <div style="font-size:0.7rem; color:var(--text-dim); margin-top:2px;">跨域资源可能显示 0B，但仍计入浏览器占用</div>
                </div>
                <button id="offline-modal-close" style="background:none; border:none; color:var(--text-dim); font-size:1.5rem; cursor:pointer; padding:5px; border-radius:50%; display:flex; align-items:center; justify-content:center; width:32px; height:32px;">×</button>
            </div>
            <div id="offline-status" style="font-size:0.8rem; color:var(--text-dim); margin-bottom:12px;"></div>
            <div style="display:flex; flex-direction:column; gap:14px;" id="offline-layout">
                <div id="offline-list" style="display:flex; flex-direction:column; gap:14px;"></div>
                <div style="padding:12px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--bg-panel);">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
                        <div style="font-size:0.85rem; color:var(--text-main);">缓存明细</div>
                        <div style="display:flex; gap:8px; flex-wrap:wrap;">
                            <button id="offline-stats-refresh" class="btn btn-sm btn-secondary">刷新统计</button>
                        </div>
                    </div>
                    <div id="offline-cache-details" style="margin-top:10px; max-height:200px; overflow:auto; border-top:1px solid var(--border); padding-top:10px; font-size:0.75rem; color:var(--text-dim); display:grid; gap:6px;"></div>
                </div>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px; flex-wrap:wrap;">
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button id="offline-select-all" class="btn btn-sm btn-secondary">全选</button>
                    <button id="offline-clear" class="btn btn-sm btn-secondary">清空</button>
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button id="offline-apply" class="btn btn-primary">应用选择</button>
                    <button id="offline-clear-site" class="btn btn-secondary">清除网站数据</button>
                </div>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="css/shell/modals.css">
    <script src="js/theme-boot.js"></script>
    <script src="js/ui/icons.js"></script>

    <script src="js/shell/core.js"></script>
    <script src="js/shell/theme.js"></script>
    <script src="js/shell/offline.js"></script>
    <script src="js/shell/nav.js"></script>
</body>
</html>
